apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
    # Pod Security admission (M149 re-audit, finding A1). `baseline` forbids hostNetwork,
    # which is the ONE thing a NetworkPolicy cannot stop: `from` selectors match pods, and
    # a hostNetwork pod has no pod identity on the wire, so Calico never applies pod policy
    # to it. Proven — a hostNetwork probe read the database straight through the datastore
    # policies.
    #
    # This closes the INSTALL namespace, so nobody can schedule such a pod next to the
    # datastores. It does NOT close agent namespaces, which the platform watches but does
    # not own; labelling those is a behaviour change for existing installs and is carded
    # rather than done here (m52 M149-psa-agent-namespaces).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    # Audit/warn at the stricter level so an operator sees what `restricted` would reject
    # before anyone considers moving the enforce line up.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ctxmesh
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: ctxmesh
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        env:
          # CONTAINER_MEMORY_LIMIT_BYTES — the container's own memory limit, via the
          # downward API. internal/runtimelimit reads it at startup and sets GOMEMLIMIT
          # to 80% of it.
          #
          # Without this the Go GC sizes the heap from GOGC alone, knows nothing about
          # the cgroup, and grows straight through the limit — so the kernel kills the
          # process rather than the collector working harder. M148 watched the BFF do
          # exactly that at 512Mi AND again at 1Gi: the ceiling was never the problem.
          - name: CONTAINER_MEMORY_LIMIT_BYTES
            valueFrom:
              resourceFieldRef:
                containerName: manager
                resource: limits.memory
                divisor: "1"
          # POD_NAMESPACE (downward API): the manager's install namespace — the platform
          # cert-controller (M128/Gate E, ADR 0102) puts its CA + serving-cert Secret here and
          # derives the webhook Service SAN from it. Inert when the tenant-label webhook is off.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # STATELAYER_PROXY_URL (M53, ADR 0050 §8 phase 3 — the cutover default): every
          # agent's memory + quota + async-dedup route through the state-layer proxy
          # (which holds the Valkey credential + derives tenant/namespace from the pod
          # token), so agent workloads hold NO Valkey path. Points at the in-cluster proxy
          # Service (the namespace is Helm-templated). Set to "" to run PROXY-LESS — agents
          # then get the direct Valkey address (the legacy pre-cutover path).
          - name: STATELAYER_PROXY_URL
            value: http://ctxmesh-statelayer-proxy.ctxmesh.svc:8080
          # CONSOLE_URL (M75, ADR 0069 §3) — the browser-reachable console origin, used by the
          # AlertPolicy approvalWaiting condition to build the HITL notification's deep-link to the
          # AUTHENTICATED console approval view (a POINTER, never the public share link, never an
          # approve-magic-link). Empty (the default) ⇒ the payload carries a relative path. Mirrors the
          # BFF's CONSOLE_URL; the Helm chart can template it from the same console-origin value.
          - name: CONSOLE_URL
            value: ""
          # OPS-4a — controller-injected image + OBO-egress config, exposed as Helm values. Each is
          # hardcoded here to its os.Getenv code default (empty ⇒ off / dev.local image), so
          # `kustomize build`/`make deploy` behavior is byte-identical; gen_helm_chart.py replaces
          # each literal with a `.Values.controllerManager.*` template so a real install can point the
          # injected sidecar images at its registry (they ImagePullBackOff off dev.local otherwise —
          # OPS-1) and enable OBO egress-sidecar injection (ADR 0030). A working OBO install needs the
          # whole oboEgress block set; the credential namespace MUST match bff.mcp.credentialNamespace.
          - name: COLLECTOR_IMAGE
            value: ""
          - name: DISCOVERY_IMAGE
            value: ""
          - name: MCP_OBO_EGRESS_ENABLED
            value: "false"
          - name: EGRESS_SIDECAR_IMAGE
            value: ""
          # MCP_CAPABILITY_PUBLIC_KEY — read from the bff-capability Secret (the keygen hook generates
          # both keys there; the BFF signs with the private seed, the controller injects this public key
          # into agent egress-sidecars to VERIFY capabilities). optional: absent Secret ⇒ unset env,
          # byte-identical to the legacy "" (no OBO). Provisioned by `bff -ensure-capability-key` (M124).
          - name: MCP_CAPABILITY_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: bff-capability
                key: MCP_CAPABILITY_PUBLIC_KEY
                optional: true
          - name: MCP_CAPABILITY_AUDIENCE
            value: ""
          - name: MCP_CREDENTIAL_NAMESPACE
            value: ctxmesh
          - name: TOKEN_SERVICE_URL
            value: http://ctxmesh-token-service.ctxmesh.svc:8443
          # OPS-2 — dev-data-plane gate. "true" here (== the kustomize dev posture) makes the
          # controller inject the DEV-ONLY object-store + Langfuse feedback creds into agent pods;
          # gen_helm_chart templates it to {{ .Values.devDataPlane.enabled }}, so a
          # `profile: production` render (devDataPlane off) sets it "false" and NO dev creds are
          # injected. Its value must track the bundled dev Valkey/MinIO gate (same values key).
          - name: DEV_DATA_PLANE
            value: "true"
          # ENABLE_TENANT_LABEL_WEBHOOK (M134, ADR 0102) — DEFAULT-ON. The fail-closed tenant-label
          # ValidatingWebhook forbids a non-controller principal from repointing a namespace's tenant
          # label (a cross-tenant boundary move). Proven no-wedge fresh (cert bootstrap + restart +
          # cert-kill + uninstall) on a throwaway cluster before this flip. The manager SELF-DERIVES the
          # allowed controller principal via SelfSubjectReview (no TENANT_WEBHOOK_CONTROLLER_SA needed —
          # removes the namePrefix-fragile wedge). gen_helm_chart templates this to
          # {{ ternary "true" "false" .Values.security.tenantLabelWebhook.enabled }} so an operator can
          # opt OUT (with the values.yaml ack); the webhook is inert unless a tenant-label write happens
          # (matchConditions-scoped, system-ns-exempt).
          - name: ENABLE_TENANT_LABEL_WEBHOOK
            value: "true"
          # --- Durability knobs (M148/m148.9, m52 Theme M143-knobs) --------------
          # Three values that code has READ since M126/M143 and that NOTHING set.
          # They shipped with sensible in-code fallbacks, so nothing was broken —
          # but an operator who hit the failure they exist for had no way to turn
          # the dial. That is the same "read by code, set by nothing" shape as
          # MODEL_GATEWAY_URL (m148.5).
          #
          # The two egress timeouts are passed through to the agent's egress
          # SIDECAR, and they are already folded into egressDigest (M146.7) — which
          # is the load-bearing part. Sidecar env that does not move the revision
          # name is silently dropped by the CreateOrUpdate guard (the M4 landmine),
          # so an operator would change the value and watch nothing happen.
          #
          # Empty ⇒ the in-code defaults (120s header, 300s idle, and the
          # knowledge settle window's own default), so the render is unchanged.
          - name: EGRESS_RESPONSE_HEADER_TIMEOUT
            value: ""
          - name: EGRESS_STREAM_IDLE_TIMEOUT
            value: ""
          # KNOWLEDGE_SETTLE_WINDOW (M143): how long an unresolved KnowledgeBase
          # ref HOLDS a revision rather than publishing a KB-less one that answers
          # with retrieval silently off. values.yaml has carried a
          # `knowledgeSettleWindow` key since M143 that reached no container.
          - name: KNOWLEDGE_SETTLE_WINDOW
            value: ""
        # CONTROLPLANE_DSN (ADR 0044) — the manager REQUIRES it at startup (ToolRegistry
        # retired to Postgres; cmd/main.go hard-exits without it). Sourced from the shared
        # bff-adapters Secret (same one the BFF/run-worker/token-service read), never a
        # literal here. optional:true so the manifest builds before the Secret exists — but
        # a real install MUST provision it, else the operator CrashLoops (audit FUNC-1).
        envFrom:
          # The chart-owned DSN Secret FIRST (M148/ADR 0130): it carries the
          # CONTROLPLANE_DSN this process hard-requires, so a stock install no
          # longer CrashLoops on the audit FUNC-1 gap described above.
          - secretRef:
              name: postgres-dsn
              optional: true
          # bff-adapters SECOND and still optional — it is the OPERATOR's Secret.
          # Later envFrom entries win, so an operator's own CONTROLPLANE_DSN in
          # bff-adapters overrides the chart default rather than being shadowed.
          - secretRef:
              name: bff-adapters
              optional: true
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        # Webhook serving port (M128/Gate E, ADR 0102): the tenant-label ValidatingWebhook's
        # TLS listener. The in-process cert-controller writes the serving cert into the
        # webhook-certs volume; controller-runtime serves + hot-reloads from it. Inert (no
        # listener) when ENABLE_TENANT_LABEL_WEBHOOK is off — the default.
        - containerPort: 9443
          name: webhook
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          # Webhook serving certs (M128/Gate E, ADR 0102 + the M134 first-boot fix): the in-process
          # cert-controller (open-policy-agent/cert-controller) POPULATES an existing Secret's data via
          # the API — it does NOT create the Secret (v0.16.0 rotator errors "acquiring secret ... not
          # found" and exits if it's absent), and it writes only to the API, never to this disk. Its
          # contract is that that Secret is VOLUME-MOUNTED here so the KUBELET projects the cert files;
          # controller-runtime's certwatcher then reads + hot-reloads them (read-only mount). The empty
          # Secret is SHIPPED (config/manager/webhook-cert-secret.yaml) — an emptyDir (the old wiring) or
          # a missing Secret both wedge the fresh boot (the M134 bug, caught live on a throwaway cluster).
          - name: webhook-certs
            mountPath: /tmp/k8s-webhook-server/serving-certs
            readOnly: true
      volumes:
        # NON-optional: the empty `webhook-server-cert` Secret is shipped unconditionally (namePrefix
        # → ctxmesh-webhook-server-cert = pki.SecretName), so it always exists (empty or populated).
        # A truly missing Secret then surfaces as a legible MountVolume event, not a Go crash-loop.
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
