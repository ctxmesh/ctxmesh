apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: agent-engine
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: agent-engine
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        imagePullPolicy: IfNotPresent
        name: manager
        env:
          # POD_NAMESPACE (downward API): the manager's install namespace — the platform
          # cert-controller (M128/Gate E, ADR 0102) puts its CA + serving-cert Secret here and
          # derives the webhook Service SAN from it. Inert when the tenant-label webhook is off.
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          # STATELAYER_PROXY_URL (M53, ADR 0050 §8 phase 3 — the cutover default): every
          # agent's memory + quota + async-dedup route through the state-layer proxy
          # (which holds the Valkey credential + derives tenant/namespace from the pod
          # token), so agent workloads hold NO Valkey path. Points at the in-cluster proxy
          # Service (the namespace is Helm-templated). Set to "" to run PROXY-LESS — agents
          # then get the direct Valkey address (the legacy pre-cutover path).
          - name: STATELAYER_PROXY_URL
            value: http://agent-engine-statelayer-proxy.agent-engine-system.svc:8080
          # CONSOLE_URL (M75, ADR 0069 §3) — the browser-reachable console origin, used by the
          # AlertPolicy approvalWaiting condition to build the HITL notification's deep-link to the
          # AUTHENTICATED console approval view (a POINTER, never the public share link, never an
          # approve-magic-link). Empty (the default) ⇒ the payload carries a relative path. Mirrors the
          # BFF's CONSOLE_URL; the Helm chart can template it from the same console-origin value.
          - name: CONSOLE_URL
            value: ""
          # OPS-4a — controller-injected image + OBO-egress config, exposed as Helm values. Each is
          # hardcoded here to its os.Getenv code default (empty ⇒ off / dev.local image), so
          # `kustomize build`/`make deploy` behavior is byte-identical; gen_helm_chart.py replaces
          # each literal with a `.Values.controllerManager.*` template so a real install can point the
          # injected sidecar images at its registry (they ImagePullBackOff off dev.local otherwise —
          # OPS-1) and enable OBO egress-sidecar injection (ADR 0030). A working OBO install needs the
          # whole oboEgress block set; the credential namespace MUST match bff.mcp.credentialNamespace.
          - name: COLLECTOR_IMAGE
            value: ""
          - name: DISCOVERY_IMAGE
            value: ""
          - name: MCP_OBO_EGRESS_ENABLED
            value: "false"
          - name: EGRESS_SIDECAR_IMAGE
            value: ""
          # MCP_CAPABILITY_PUBLIC_KEY — read from the bff-capability Secret (the keygen hook generates
          # both keys there; the BFF signs with the private seed, the controller injects this public key
          # into agent egress-sidecars to VERIFY capabilities). optional: absent Secret ⇒ unset env,
          # byte-identical to the legacy "" (no OBO). Provisioned by `bff -ensure-capability-key` (M124).
          - name: MCP_CAPABILITY_PUBLIC_KEY
            valueFrom:
              secretKeyRef:
                name: bff-capability
                key: MCP_CAPABILITY_PUBLIC_KEY
                optional: true
          - name: MCP_CAPABILITY_AUDIENCE
            value: ""
          - name: MCP_CREDENTIAL_NAMESPACE
            value: agent-engine-system
          - name: TOKEN_SERVICE_URL
            value: http://agent-engine-token-service.agent-engine-system.svc:8443
          # OPS-2 — dev-data-plane gate. "true" here (== the kustomize dev posture) makes the
          # controller inject the DEV-ONLY object-store + Langfuse feedback creds into agent pods;
          # gen_helm_chart templates it to {{ .Values.devDataPlane.enabled }}, so a
          # `profile: production` render (devDataPlane off) sets it "false" and NO dev creds are
          # injected. Its value must track the bundled dev Valkey/MinIO gate (same values key).
          - name: DEV_DATA_PLANE
            value: "true"
        # CONTROLPLANE_DSN (ADR 0044) — the manager REQUIRES it at startup (ToolRegistry
        # retired to Postgres; cmd/main.go hard-exits without it). Sourced from the shared
        # bff-adapters Secret (same one the BFF/run-worker/token-service read), never a
        # literal here. optional:true so the manifest builds before the Secret exists — but
        # a real install MUST provision it, else the operator CrashLoops (audit FUNC-1).
        envFrom:
          - secretRef:
              name: bff-adapters
              optional: true
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        # Webhook serving port (M128/Gate E, ADR 0102): the tenant-label ValidatingWebhook's
        # TLS listener. The in-process cert-controller writes the serving cert into the
        # webhook-certs volume; controller-runtime serves + hot-reloads from it. Inert (no
        # listener) when ENABLE_TENANT_LABEL_WEBHOOK is off — the default.
        - containerPort: 9443
          name: webhook
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts:
          # Webhook serving certs (M128/Gate E, ADR 0102 + the M134 first-boot fix): the in-process
          # cert-controller (open-policy-agent/cert-controller) POPULATES an existing Secret's data via
          # the API — it does NOT create the Secret (v0.16.0 rotator errors "acquiring secret ... not
          # found" and exits if it's absent), and it writes only to the API, never to this disk. Its
          # contract is that that Secret is VOLUME-MOUNTED here so the KUBELET projects the cert files;
          # controller-runtime's certwatcher then reads + hot-reloads them (read-only mount). The empty
          # Secret is SHIPPED (config/manager/webhook-cert-secret.yaml) — an emptyDir (the old wiring) or
          # a missing Secret both wedge the fresh boot (the M134 bug, caught live on a throwaway cluster).
          - name: webhook-certs
            mountPath: /tmp/k8s-webhook-server/serving-certs
            readOnly: true
      volumes:
        # NON-optional: the empty `webhook-server-cert` Secret is shipped unconditionally (namePrefix
        # → agent-engine-webhook-server-cert = pki.SecretName), so it always exists (empty or populated).
        # A truly missing Secret then surfaces as a legible MountVolume event, not a Go crash-loop.
        - name: webhook-certs
          secret:
            secretName: webhook-server-cert
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
