# Tenant-label webhook serving-cert Secret (M128/Gate E, ADR 0102 + the M134 first-boot fix).
#
# The in-process cert-controller (open-policy-agent/cert-controller) POPULATES this Secret's data
# (ca.crt/ca.key/tls.crt/tls.key) at boot when the tenant-label webhook is enabled — it does NOT
# create it. v0.16.0's rotator Gets the Secret and, on NotFound, errors ("acquiring secret to update
# certificates ... not found") and the manager EXITS → CrashLoopBackOff on every fresh install. So the
# empty Secret MUST be shipped (the gatekeeper bootstrap pattern). It is shipped UNCONDITIONALLY (the
# manager volume-mounts it non-optionally regardless of ENABLE_TENANT_LABEL_WEBHOOK); when the webhook
# is off the rotator never runs and it simply stays empty.
#
# - name `webhook-server-cert` (pre-prefix): config/default namePrefix `agentry-` renders it to
#   `agentry-webhook-server-cert` = the pki.SecretName constant + the manager volume's secretName
#   (kustomize nameReference keeps all three aligned). Do NOT name it with the prefix already applied.
# - type Opaque (omit `type`): `kubernetes.io/tls` is rejected at apply without tls.crt/tls.key present,
#   and the rotator also stores the CA private key here (nonstandard for a tls-type Secret).
# - NO `helm.sh/resource-policy: keep`: Helm 3-way merge preserves the rotator-written data across
#   `helm upgrade` (the data is in neither the old nor the new chart manifest), and on uninstall the
#   Secret SHOULD be deleted (the VWC dies with it; a reinstall regenerates in seconds). NEVER run
#   `helm upgrade --force` on this release — replace semantics would wipe the populated cert.
apiVersion: v1
kind: Secret
metadata:
  name: webhook-server-cert
  namespace: system
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/component: webhook-cert
# no data — the cert-controller rotator populates ca.crt/ca.key/tls.crt/tls.key.
