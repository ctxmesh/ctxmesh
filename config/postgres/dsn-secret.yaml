# The control-plane DSN — the one value the platform genuinely cannot start
# without, and which until M148 no chart path produced (m148.3, ADR 0130).
#
# THE BUG THIS CLOSES. `cmd/main.go` and `cmd/bff/main.go` both os.Exit(1) on an
# empty CONTROLPLANE_DSN (ADR 0044 retired ToolRegistry/PromptVersion to
# Postgres). Both read it from the `bff-adapters` Secret, which is consumed in
# four places and created in none — config/manager/manager.yaml even says so out
# loud: "a real install MUST provision it, else the operator CrashLoops (audit
# FUNC-1)". It was a known finding carried as a comment instead of a fix.
#
# WHY A SEPARATE SECRET FROM `bff-adapters`. bff-adapters is the OPERATOR's
# grab-bag for optional adapter credentials (Langfuse, Prometheus) — the chart
# must not own it, or an operator adding their Langfuse keys would fight Helm for
# ownership of the same object. So the chart owns THIS Secret, whose single job
# is the DSN, and `bff-adapters` stays optional and operator-supplied.
#
# OVERRIDE ORDER IS LOAD-BEARING. Every consumer lists this Secret FIRST and
# `bff-adapters` SECOND in `envFrom`. Later entries win, so an operator who puts
# their own CONTROLPLANE_DSN in bff-adapters still overrides the chart default —
# the chart provides a working default without taking away the override.
#
# The generator rewrites the DSN literal below into
# `{{ .Values.postgres.externalDsn | default … }}`, the same treatment
# statelayer.externalAddr gets — so a production install points at an
# operator-managed database and renders none of the bundled Postgres.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dsn
  namespace: system
  labels:
    control-plane: controlplane-dsn
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # Credentials match config/postgres/secret.yaml — dev-only, deterministic, and
  # meaningful ONLY against the bundled in-cluster database.
  CONTROLPLANE_DSN: postgres://ctxmesh:ctxmesh-dev-secret@ctxmesh-postgres.ctxmesh.svc:5432/ctxmesh?sslmode=disable
  RUN_STORE_DSN: postgres://ctxmesh:ctxmesh-dev-secret@ctxmesh-postgres.ctxmesh.svc:5432/ctxmesh?sslmode=disable
