# Dev-only credentials for the bundled control-plane / run-store Postgres.
#
# Same posture as the dev MinIO (config/objectstore/secret.yaml) and the dev
# Langfuse keys: DETERMINISTIC, DEV-ONLY, FIXED values committed as such. This is
# NOT a real credential, is never rotated, and is only ever meaningful against
# this in-cluster dev database. A production install sets
# `devDataPlane.enabled=false` and points `postgres.externalDsn` at an
# operator-managed database (ADR 0130) — at which point nothing here is rendered.
#
# stringData (not data) so the value is human-readable in git and greppable
# against the DSN the chart composes from it; kustomize/apply encodes it.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-dev
  namespace: system
  labels:
    control-plane: postgres
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # Consumed by the Postgres container itself AND by the DSN the control plane
  # reads. The two MUST agree — that is the whole reason they come from one
  # Secret rather than two literals in two templates.
  username: ctxmesh
  password: ctxmesh-dev-secret
  database: ctxmesh
