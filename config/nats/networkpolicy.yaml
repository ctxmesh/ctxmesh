# Dev NATS JetStream ingress restriction (M149 m149.2).
#
# WHY. Same shape as the Postgres policy beside it, and slightly worse on one axis: the
# bundled NATS has no `authorization` block at all, so :4222 is an UNAUTHENTICATED
# JetStream. Its only legitimate clients are control-plane components in the install
# namespace (the BFF's publish edge and its durable consumers); agents reach A2A through
# the platform, never the broker directly.
#
# Proven live before this policy existed: a pod in a namespace with no AgentRegistry and
# no Tenant — so covered by neither egress allowlist — reached the monitoring endpoint on
# :8222 and got HTTP 200. With no auth on :4222, the same pod could publish onto, consume
# from, or purge another tenant's A2A stream.
#
# :8222 (monitoring) is restricted alongside :4222 rather than left open: it exposes
# stream and consumer topology, which is a tenancy leak even though it is read-only.
# The kubelet's httpGet probe against :8222 comes from the NODE, not from a pod, and
# Kubernetes does not apply NetworkPolicy to kubelet health probes — verified live after
# applying this policy: the pod stays Ready.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats-ingress
  namespace: system
  labels:
    control-plane: nats
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      control-plane: nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4222
        - protocol: TCP
          port: 8222
