# ClusterIP Service for the bundled dev NATS. The BFF reaches it at
# nats://ctxmesh-nats.ctxmesh.svc:4222 — the bff.natsURL an operator sets
# alongside bff.asyncBackend=nats (M148/m148.5).
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: system
  labels:
    control-plane: nats
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: nats
    app.kubernetes.io/name: ctxmesh
  ports:
    - name: client
      port: 4222
      targetPort: 4222
      protocol: TCP
    - name: monitor
      port: 8222
      targetPort: 8222
      protocol: TCP
