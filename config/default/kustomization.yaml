# Adds namespace to all resources.
namespace: agent-engine-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Note that it should also match with the prefix (text before '-') of the namespace
# field above.
namePrefix: agent-engine-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
- ../gateway
- ../statelayer
- ../objectstore
# The Go BFF (UI server-side layer) + its least-privilege SA/RBAC. Flows into
# both `make deploy` and the generated Helm chart (no-drift). ADR 0011: the BFF
# SA holds no agent-CRD access — user ops run on the caller's token.
- ../bff
# The central OBO token-service + its least-privilege SA/RBAC (ADR 0030 §1). mTLS
# + credential namespace are values-gated/optional so a plain install degrades to
# the built-in kubernetes credential backend (ADR 0032). No-drift.
- ../token-service
# The state-layer proxy (M51, ADR 0050): holds the Valkey credential + enforces
# per-tenant/agent memory scope server-side from the run-capability token. Idle
# until the launcher is wired to it (migration phase 1); refuses requests until the
# capability keypair is provisioned. No-drift (capability key via optional Secret).
- ../statelayer-proxy
# The tenant-label ValidatingWebhook's Service (M128/Gate E, ADR 0102; ACTIVATED in M134). Its target
# is the manager's in-process webhook TLS listener (:9443). Named `webhook-service` pre-prefix so
# kustomize renders it to `agent-engine-webhook-service` = the cmd/main.go webhookServiceName constant
# (the VWC clientConfig target + the cert SAN). Shipped unconditionally; inert until the webhook is
# enabled (ENABLE_TENANT_LABEL_WEBHOOK). NO cert-manager — the manager runs its own in-process rotator.
- ../webhook
# [CERTMANAGER] cert-manager is NOT used — the manager's in-process cert-controller (internal/pki,
# open-policy-agent/cert-controller) generates + rotates the CA + serving cert (ADR 0102 §1).
#- ../certmanager
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
# [METRICS] Expose the controller manager metrics service.
- metrics_service.yaml
# [NETWORK POLICY] Protect the /metrics endpoint and Webhook Server with NetworkPolicy.
# Only Pod(s) running a namespace labeled with 'metrics: enabled' will be able to gather the metrics.
# Only CR(s) which requires webhooks and are applied on namespaces labeled with 'webhooks: enabled' will
# be able to communicate with the Webhook Server.
#- ../network-policy

# Uncomment the patches line if you enable Metrics
patches:
# [METRICS] The following patch will enable the metrics endpoint using HTTPS and the port :8443.
# More info: https://book.kubebuilder.io/reference/metrics
- path: manager_metrics_patch.yaml
  target:
    kind: Deployment
    name: controller-manager   # scope: the gateway Deployment must not get manager flags

# Uncomment the patches line if you enable Metrics and CertManager
# [METRICS-WITH-CERTS] To enable metrics protected with certManager, uncomment the following line.
# This patch will protect the metrics with certManager self-signed certs.
#- path: cert_metrics_manager_patch.yaml
#  target:
#    kind: Deployment

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
#- path: manager_webhook_patch.yaml
#  target:
#    kind: Deployment

