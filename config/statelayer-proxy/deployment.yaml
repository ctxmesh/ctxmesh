# State-layer proxy Deployment (M51, ADR 0050; ADR 0052 §C6 RESOLUTION) — the
# control-plane service that holds the Valkey credential and enforces per-tenant/agent
# memory scope SERVER-SIDE from the caller's verified POD IDENTITY (projected SA token +
# TokenReview). Session memory is workload-scoped, so ALL paths (memory, quota, async)
# authenticate the pod — no runcap, no capability keypair. Agent workloads hold no Valkey
# credential and cannot name another tenant's key. Absent cluster auth the proxy STARTS
# but refuses every request (401), not a CrashLoop.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statelayer-proxy
  namespace: system
  labels:
    control-plane: statelayer-proxy
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: statelayer-proxy
      app.kubernetes.io/name: agent-engine
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: statelayer-proxy
      labels:
        control-plane: statelayer-proxy
        app.kubernetes.io/name: agent-engine
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: statelayer-proxy
          image: statelayer-proxy:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # The shared state-layer Valkey (same target as the BFF's STATELAYER_ADDR,
            # m49). BYO-external installs override it (ADR 0049 posture). The Helm chart
            # templates it (no drift).
            - name: STATELAYER_ADDR
              value: agent-engine-statelayer.agent-engine-system.svc:6379
            # STATELAYER_USERNAME/PASSWORD for a Valkey ACL user (ADR 0050 §6) — empty by
            # default (the in-cluster Valkey is unauthenticated, ADR 0049). Set for a
            # password-protected/BYO-external Valkey.
            - name: STATELAYER_USERNAME
              value: ""
            - name: STATELAYER_PASSWORD
              value: ""
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
      serviceAccountName: statelayer-proxy
      terminationGracePeriodSeconds: 10
