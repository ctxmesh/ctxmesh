# State-layer proxy ServiceAccount (M51, ADR 0050). The memory-first proxy needs no
# cluster RBAC (it authenticates callers by the run-capability token, not the K8s
# API, and holds the Valkey credential directly). The Tenant informer for quota
# scope (m51.5) adds a least-privilege read Role then.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: statelayer-proxy
  namespace: system
  labels:
    control-plane: statelayer-proxy
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: kustomize
