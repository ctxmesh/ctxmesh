# This kustomization.yaml is not intended to be run by itself,
# since it depends on service name and namespace that are out of this kustomize package.
# It should be run by config/default

# helm.sh/resource-policy: keep protects the CRDs — and therefore every custom resource
# they own — from a `helm uninstall`: deleting a CRD cascade-deletes ALL its CRs, so an
# accidental uninstall would nuke every AgentDeployment/Tenant/ModelRoute/etc. The
# annotation is helm-only (inert for `make deploy`/kustomize), so it lives safely in this
# shared base and keeps the no-drift contract (both sides carry it). M128/Gate E, ADR 0102.
commonAnnotations:
  helm.sh/resource-policy: keep

resources:
- bases/agents.ctxmesh.ai_agentdeployments.yaml
- bases/agents.ctxmesh.ai_agentversions.yaml
- bases/agents.ctxmesh.ai_modelroutes.yaml
- bases/agents.ctxmesh.ai_secretbindings.yaml
- bases/agents.ctxmesh.ai_mcptoolbindings.yaml
- bases/agents.ctxmesh.ai_agentregistries.yaml
- bases/agents.ctxmesh.ai_agentteams.yaml
- bases/agents.ctxmesh.ai_agentscalingpolicies.yaml
- bases/agents.ctxmesh.ai_guardrailpolicies.yaml
- bases/agents.ctxmesh.ai_approvalpolicies.yaml
- bases/agents.ctxmesh.ai_workflows.yaml
- bases/agents.ctxmesh.ai_evalsuites.yaml
- bases/agents.ctxmesh.ai_credentialstores.yaml
- bases/agents.ctxmesh.ai_clustercredentialstores.yaml
- bases/agents.ctxmesh.ai_tenants.yaml
- bases/agents.ctxmesh.ai_knowledgebases.yaml
- bases/agents.ctxmesh.ai_alertpolicies.yaml
# +kubebuilder:scaffold:crdkustomizeresource

patches:
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix.
# patches here are for enabling the conversion webhook for each CRD
# +kubebuilder:scaffold:crdkustomizewebhookpatch

# [WEBHOOK] To enable webhook, uncomment the following section
# the following config is for teaching kustomize how to do kustomization for CRDs.
#configurations:
#- kustomizeconfig.yaml
