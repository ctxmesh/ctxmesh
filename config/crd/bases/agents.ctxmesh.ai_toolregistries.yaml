---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: toolregistries.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: ToolRegistry
    listKind: ToolRegistryList
    plural: toolregistries
    shortNames:
    - tr
    singular: toolregistry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ToolRegistry is the Schema for the toolregistries API — the operator's
          catalog of approved MCP tools that MCPToolBindings must reference.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the approved-tool catalog.
            properties:
              tools:
                description: |-
                  tools is the catalog of approved MCP tools. At most 20 entries —
                  MaxItems (with MaxLength on entry fields) bounds the O(n²) CEL cost of
                  the uniqueness rule under the apiserver's budget.
                items:
                  description: |-
                    ToolEntry is one approved MCP tool in a ToolRegistry catalog. A
                    MCPToolBinding is valid only if its toolName matches an entry here and its
                    server image/url matches whatever the entry pins (empty pin = any value
                    allowed for that field).
                  properties:
                    image:
                      description: |-
                        image optionally pins the container image a sidecar-mode binding for
                        this tool must use. Empty = sidecar bindings may use any image.
                      maxLength: 512
                      type: string
                    name:
                      description: |-
                        name is the catalog key that MCPToolBinding.spec.toolName must
                        reference. Required, unique within the registry. MaxLength bounds the
                        CEL cost estimate for the uniqueness rule.
                      maxLength: 63
                      minLength: 1
                      type: string
                    url:
                      description: |-
                        url optionally pins the server URL a remote-mode binding for this tool
                        must use. Empty = remote bindings may use any URL.
                      maxLength: 512
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 20
                minItems: 1
                type: array
            required:
            - tools
            type: object
            x-kubernetes-validations:
            - message: tool names must be unique within a ToolRegistry
              rule: self.tools.all(i, self.tools.filter(j, j.name == i.name).size()
                == 1)
          status:
            description: status defines the observed state of this ToolRegistry.
            properties:
              conditions:
                description: conditions reflect the current state of the registry.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
