---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentteams.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: AgentTeam
    listKind: AgentTeamList
    plural: agentteams
    shortNames:
    - at
    singular: agentteam
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.registryRef
      name: Registry
      type: string
    - jsonPath: .spec.supervisor.agentRef
      name: Supervisor
      type: string
    - jsonPath: .status.members
      name: Members
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AgentTeam is a governed roster of summonable sub-agents plus a supervisor and a spawn budget (M64,
          ADR 0057). The controller resolves + validates the roster against spec.registryRef (the trust
          boundary); at runtime the supervisor delegates to a roster member via the `delegate_to` tool, which
          starts the member as a durable SUB-RUN on the run-worker path — inheriting the invoking user's OBO
          (no re-consent), the conversation, and the trace, bounded by the spawn budget + tenant quota.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AgentTeamSpec defines the desired state of an AgentTeam (ADR
              0057).
            properties:
              registryRef:
                description: |-
                  registryRef is the name of the AgentRegistry (same namespace) that is this team's trust boundary:
                  OBO (ADR 0033), the NetworkPolicy, and the `shared` memory scope (ADR 0035) are all
                  registry-scoped. The supervisor + every roster member MUST be members of it. The registry is
                  REFERENCED, never generated by the team; a sub-run inherits it as its Boundary.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                type: string
              roster:
                description: |-
                  roster is the governed set of summonable sub-agents. At least one entry; names are unique
                  (listMapKey). Each entry references a standing AgentDeployment.
                items:
                  description: |-
                    AgentTeamRosterEntry is one summonable sub-agent in a team's roster (ADR 0057 Door 1). In v1 it is a
                    REFERENCE to a standing AgentDeployment (`agentRef`) — NOT an inline spec. It is kept a discriminated
                    union so an `inline:` template arm (a non-deployed template executed by a generic executor) can be
                    added later without a breaking change.
                  properties:
                    agentRef:
                      description: |-
                        agentRef is the name of a standing AgentDeployment (same namespace) this entry summons as a
                        sub-run. It MUST be a member of the team's registryRef.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                      type: string
                    description:
                      description: |-
                        description is a short natural-language summary of what this sub-agent does. It is surfaced to the
                        supervisor's model at summon time so it can choose whom to delegate to.
                      maxLength: 512
                      type: string
                    name:
                      description: |-
                        name is the roster-local identifier the supervisor uses to summon this sub-agent (the delegate_to
                        `sub_agent` argument). Unique within the roster.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                      type: string
                  required:
                  - agentRef
                  - name
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              spawnBudget:
                description: |-
                  spawnBudget bounds on-demand delegation (defaults maxFanOut=4, maxSpawnDepth=3,
                  maxTotalSpawns=20). A nil block resolves to all defaults in the controller.
                properties:
                  maxFanOut:
                    default: 4
                    description: maxFanOut is the maximum number of sub-runs a single
                      supervisor step may start. Defaults to 4.
                    format: int32
                    minimum: 1
                    type: integer
                  maxSpawnDepth:
                    default: 3
                    description: |-
                      maxSpawnDepth is the maximum depth of the spawn tree (supervisor -> sub-agent -> ...), distinct
                      from A2A hop depth. Defaults to 3.
                    format: int32
                    minimum: 1
                    type: integer
                  maxTotalSpawns:
                    default: 20
                    description: |-
                      maxTotalSpawns is the maximum number of sub-runs across the whole spawn tree of one root run.
                      Defaults to 20.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              supervisor:
                description: supervisor is the orchestrating agent that summons the
                  roster.
                properties:
                  agentRef:
                    description: |-
                      agentRef is the name of a standing AgentDeployment (same namespace) that orchestrates the team
                      (its role should be "orchestrator"). It MUST be a member of the team's registryRef.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                    type: string
                required:
                - agentRef
                type: object
            required:
            - registryRef
            - roster
            - supervisor
            type: object
          status:
            description: AgentTeamStatus defines the observed state of an AgentTeam.
            properties:
              conditions:
                description: |-
                  conditions reflect the team's reconciliation state. Ready=True means registryRef, the supervisor,
                  and every roster member resolved AND all are members of registryRef. Failure reasons include
                  RegistryNotFound, MemberNotFound, and NotARegistryMember.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              members:
                description: |-
                  members lists the resolved supervisor + roster members that are Ready standing agents in the
                  registry. Populated by the controller on each reconcile.
                items:
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              registry:
                description: registry echoes the resolved registryRef (the trust boundary),
                  for convenience in listings.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
