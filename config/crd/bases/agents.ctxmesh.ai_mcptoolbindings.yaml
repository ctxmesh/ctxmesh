---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: mcptoolbindings.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: MCPToolBinding
    listKind: MCPToolBindingList
    plural: mcptoolbindings
    shortNames:
    - mtb
    singular: mcptoolbinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .spec.toolName
      name: Tool
      type: string
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPToolBinding is the Schema for the mcptoolbindings API — it binds an MCP
          tool server (sidecar or remote) to an agent and drives the discovery
          sidecar's manifest (specs/mcp-tools.md).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired tool binding.
            properties:
              agentRef:
                description: |-
                  agentRef names the AgentDeployment (same namespace) this tool is bound
                  to. Required.
                minLength: 1
                type: string
              mode:
                description: |-
                  mode selects how the tool server runs: "sidecar" (in the agent pod,
                  localhost) or "remote" (shared standalone service). Required.
                enum:
                - sidecar
                - remote
                type: string
              registryRef:
                description: |-
                  registryRef names the ToolRegistry (same namespace) that must approve
                  this tool. Required.
                minLength: 1
                type: string
              server:
                description: server locates the tool server for the selected mode.
                properties:
                  image:
                    description: |-
                      image is the container image for a sidecar-mode tool server, run inside
                      the agent pod and reached over localhost. Required when mode=sidecar.
                    type: string
                  url:
                    description: |-
                      url is the base URL of a remote-mode MCP server (typically a standalone
                      Knative service shared across agents). Required when mode=remote.
                    type: string
                type: object
              toolName:
                description: toolName is the catalog key in the referenced ToolRegistry.
                  Required.
                minLength: 1
                type: string
            required:
            - agentRef
            - mode
            - registryRef
            - server
            - toolName
            type: object
            x-kubernetes-validations:
            - message: server.url is required for remote mode; server.image is required
                for sidecar mode
              rule: 'self.mode == ''remote'' ? has(self.server.url) : has(self.server.image)'
          status:
            description: status defines the observed state of this binding.
            properties:
              conditions:
                description: |-
                  conditions reflect the binding's reconciliation state. Ready=True means
                  the tool is registered, pin-matched, rendered into the agent's manifest,
                  and pushed to the discovery sidecar. Failure reasons include
                  UnregisteredTool and RegistryMismatch.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
