---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: memorybindings.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: MemoryBinding
    listKind: MemoryBindingList
    plural: memorybindings
    shortNames:
    - mb
    singular: memorybinding
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentRef
      name: Agent
      type: string
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MemoryBinding binds a Valkey-backed session-memory store to an
          AgentDeployment. The controller injects MEMORY_BACKEND_ADDR into the agent
          pod template; the launcher's :2998 memory endpoint uses that address.
          (specs/state-layer.md, PRD §10)
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired memory binding.
            properties:
              agentRef:
                description: |-
                  agentRef names the AgentDeployment (same namespace) that this binding
                  applies to. Required.
                maxLength: 63
                minLength: 1
                type: string
              backend:
                description: |-
                  backend locates the Valkey state-layer instance.
                  If omitted the controller applies the cluster-default address.
                properties:
                  addr:
                    description: |-
                      addr is the host:port of the Valkey backend.
                      If omitted the controller defaults to
                      agent-engine-statelayer.agent-engine-system.svc:6379.
                    maxLength: 256
                    type: string
                type: object
              scope:
                default: session
                description: |-
                  scope is the memory scope. Only "session" is supported in v1;
                  agent/shared scopes are phase-2.
                enum:
                - session
                type: string
            required:
            - agentRef
            type: object
          status:
            description: status defines the observed state of this binding.
            properties:
              conditions:
                description: |-
                  conditions reflect the binding's reconciliation state.
                  Ready=True means the referenced AgentDeployment exists, the scope is
                  known, and MEMORY_BACKEND_ADDR has been injected into the agent's pod
                  template. Failure reasons include AgentNotFound and InvalidScope.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
