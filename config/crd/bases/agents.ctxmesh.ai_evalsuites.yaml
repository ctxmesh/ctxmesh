---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: evalsuites.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: EvalSuite
    listKind: EvalSuiteList
    plural: evalsuites
    shortNames:
    - es
    singular: evalsuite
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.gate
      name: Gate
      type: string
    - jsonPath: .spec.threshold
      name: Threshold
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EvalSuite is the Schema for the evalsuites API.
          An EvalSuite defines a set of scorers and a threshold used to gate an
          AgentDeployment rollout. An AgentDeployment references a suite via
          spec.evalSuiteRef; when present, the controller scores the candidate revision
          against the suite and promotes or blocks the rollout based on the result.
          Absent evalSuiteRef means no gate — the deploy proceeds unchanged (PRD §17).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the EvalSuite.
            properties:
              dataset:
                description: dataset locates the cases to score the candidate against.
                properties:
                  ref:
                    description: |-
                      ref is the name of the dataset (a Langfuse dataset or an inline fixture
                      in the harness). Required.
                    minLength: 1
                    type: string
                required:
                - ref
                type: object
              gate:
                default: block
                description: |-
                  gate controls the deploy action when the suite score is below threshold:
                    - block (default): hold the rollout; the old revision keeps serving.
                    - warn: promote the rollout anyway, but annotate with eval.warn.
                enum:
                - block
                - warn
                type: string
              scorers:
                description: |-
                  scorers is the list of scorers to apply. At least one scorer is required.
                  Each scorer yields a 0..1 score; the suite score is the weighted mean.
                items:
                  description: |-
                    ScorerSpec defines one scorer within an EvalSuite. Each scorer yields a 0..1
                    score; the suite score is the weighted mean of all scorers.
                  properties:
                    name:
                      description: name is the unique identifier for this scorer within
                        the suite.
                      minLength: 1
                      type: string
                    type:
                      description: |-
                        type is the scorer implementation:
                          - mock: deterministic scorer keyed by candidate+dataset (CI-reproducible, no Langfuse needed).
                          - llm-judge: delegates to Langfuse's LLM-as-judge evaluator.
                          - code: delegates to Langfuse's code evaluator.
                      enum:
                      - mock
                      - llm-judge
                      - code
                      type: string
                    weight:
                      default: 1
                      description: |-
                        weight is the relative weight of this scorer in the weighted mean.
                        Defaults to 1. Optional.
                      format: int32
                      minimum: 1
                      type: integer
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
              threshold:
                description: |-
                  threshold is the minimum weighted-mean score required for the gate to
                  pass. Expressed as an exact decimal string in the range 0..1 (inclusive),
                  e.g. "0.80". The pattern allows up to four fractional digits.
                pattern: ^0(\.[0-9]{1,4})?$|^1(\.0{1,4})?$
                type: string
            required:
            - dataset
            - scorers
            - threshold
            type: object
          status:
            description: status defines the observed state of the EvalSuite.
            properties:
              conditions:
                description: conditions reflect the current reconciliation state of
                  the EvalSuite.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources:
      status: {}
  - additionalPrinterColumns:
    - jsonPath: .spec.gate
      name: Gate
      type: string
    - jsonPath: .spec.threshold
      name: Threshold
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
