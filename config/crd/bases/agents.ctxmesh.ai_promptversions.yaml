    controller-gen.kubebuilder.io/version: v0.21.0
  name: promptversions.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: PromptVersion
    listKind: PromptVersionList
    plural: promptversions
    shortNames:
    - pv
    singular: promptversion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.git.repo
      name: Repo
      type: string
    - jsonPath: .spec.git.ref
      name: Ref
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PromptVersion is the Schema for the promptversions API.
          A PromptVersion is a git-backed pointer to a prompt artifact. An
          AgentDeployment references it via spec.promptRef; swapping promptRef (or its
          ref) changes the active prompt without an image rebuild — the container image
          digest is unchanged but a new Knative revision is rolled out carrying the new
          prompt material. Absent promptRef means the image-bundled prompt is used
          (unchanged deploy). (PRD §7, ADR 0008).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of the PromptVersion.
            properties:
              git:
                description: |-
                  git points to the prompt artifact in a git repository.
                  The platform never becomes the prompt store — git remains the source of
                  truth (ADR 0008, PRD §7).
                properties:
                  path:
                    description: |-
                      path is the path within the repository to the prompt file, e.g.
                      "prompts/my-agent/system.txt". Required.
                    minLength: 1
                    type: string
                  ref:
                    description: |-
                      ref is the immutable git ref that pins the prompt version — a full commit
                      SHA or an annotated tag. Branch names are discouraged because they are
                      mutable; the controller resolves ref → content at reconcile time and the
                      result must be reproducible. Required.
                    minLength: 1
                    type: string
                  repo:
                    description: |-
                      repo is the URL of the git repository containing the prompt, e.g.
                      "https://github.com/example/prompts.git". Required.
                    minLength: 1
                    type: string
                required:
                - path
                - ref
                - repo
                type: object
            required:
            - git
            type: object
          status:
            description: status defines the observed state of the PromptVersion.
            properties:
              conditions:
                description: conditions reflect the current reconciliation state of
                  the PromptVersion.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: false
    subresources:
      status: {}
