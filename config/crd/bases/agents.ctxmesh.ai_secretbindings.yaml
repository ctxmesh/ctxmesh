                      key is the key within the Secret's data map whose value is the credential
                      to inject into the gateway, e.g. "api-key". Required.
                    minLength: 1
                    type: string
                  name:
                    description: name is the name of the Kubernetes Secret resource.
                      Required.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - secretRef
            type: object
          status:
            description: status defines the observed resolution state of this SecretBinding.
            properties:
              conditions:
                description: |-
                  conditions reflect the current reconciliation state of the SecretBinding.
                  The "Resolved" condition is set to True once the referenced Kubernetes
                  Secret exists and the specified key is present in its data map.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
