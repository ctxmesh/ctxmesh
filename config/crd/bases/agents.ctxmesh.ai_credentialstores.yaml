                            minLength: 1
                            type: string
                        required:
                        - caSecretRef
                        - clientTLSSecretName
                        type: object
                    required:
                    - endpoint
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one provider (kubernetes, postgres, openbao, remote)
