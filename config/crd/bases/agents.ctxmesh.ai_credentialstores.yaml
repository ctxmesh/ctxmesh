                                type: string
                              caSecretRef:
                                description: caSecretRef optionally verifies the OpenBao
                                  server cert (a Secret + key).
                                properties:
                                  key:
                                    description: |-
                                      key is the key within the Secret's data map whose value is the credential
                                      to inject into the gateway, e.g. "api-key". Required.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Kubernetes
                                      Secret resource. Required.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                              keyPrefix:
                                description: keyPrefix derives the per-tenant transit
                                  key name (<keyPrefix><tenant>).
                                type: string
                              mountPath:
                                description: mountPath is the transit engine mount.
                                  Empty ⇒ "transit".
                                type: string
                              tokenSecretRef:
                                description: tokenSecretRef locates the OpenBao token
                                  the token-service authenticates with.
                                properties:
                                  key:
                                    description: |-
                                      key is the key within the Secret's data map whose value is the credential
                                      to inject into the gateway, e.g. "api-key". Required.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Kubernetes
                                      Secret resource. Required.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
