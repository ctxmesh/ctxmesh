apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: credentialstores.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: CredentialStore
    listKind: CredentialStoreList
    plural: credentialstores
    shortNames:
    - credstore
    singular: credentialstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CredentialStore selects the credential backend for OBO grants in its own namespace,
          overriding the cluster default. Modeled on ESO's namespaced SecretStore (ADR 0032).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
