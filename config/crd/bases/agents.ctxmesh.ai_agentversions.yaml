---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentversions.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    kind: AgentVersion
    listKind: AgentVersionList
    plural: agentversions
    singular: agentversion
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentVersion is the Schema for the agentversions API.
          Each AgentVersion is an immutable, controller-created snapshot of an
          AgentDeployment's spec at a specific point in time. Immutability is enforced
          by a CRD-level CEL rule — no webhook is required. AgentVersions are
          owner-referenced to their parent AgentDeployment and garbage collected
          automatically when the deployment is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the immutable snapshot of the AgentDeployment
              spec.
            properties:
              deploymentName:
                description: |-
                  deploymentName is the name of the parent AgentDeployment this version
                  was snapshotted from.
                minLength: 1
                type: string
              snapshot:
                description: |-
                  snapshot is a verbatim copy of the AgentDeploymentSpec at the time this
                  AgentVersion was created. It is used by the controller to drive the
                  Knative Service template and is never modified after creation.
                properties:
                  allowedCallers:
                    description: |-
                      allowedCallers is the per-agent inbound allowlist (PRD §12.4 layer 3):
                      the names of peer agents permitted to call this agent over A2A. The
                      controller comma-joins it into the static AGENT_ALLOWED_CALLERS env var;
                      the callee's launcher rejects a caller not on the list with a typed
                      caller_not_allowed error. An empty/omitted list means the launcher applies
                      its default policy (registry-membership check only). Bounded at 64 entries
                      of at most 63 characters each (DNS-label-sized agent names).
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  env:
                    description: |-
                      env is an optional list of environment variables injected directly into
                      the agent container alongside the controller-managed variables such as
                      $AGENT_PORT. Uses the standard Kubernetes EnvVar schema.
                    items:
                      description: EnvVar represents an environment variable present
                        in a Container.
                      properties:
                        name:
                          description: |-
                            Name of the environment variable.
                            May consist of any printable ASCII characters except '='.
                          type: string
                        value:
                          description: |-
                            Variable references $(VAR_NAME) are expanded
                            using the previously defined environment variables in the container and
                            any service environment variables. If a variable cannot be resolved,
                            the reference in the input string will be unchanged. Double $$ are reduced
                            to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                            "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                            Escaped references will never be expanded, regardless of whether the variable
                            exists or not.
                            Defaults to "".
                          type: string
                        valueFrom:
                          description: Source for the environment variable's value.
                            Cannot be used if value is not empty.
                          properties:
                            configMapKeyRef:
                              description: Selects a key of a ConfigMap.
                              properties:
                                key:
                                  description: The key to select.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the ConfigMap or its
                                    key must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                            fieldRef:
                              description: |-
                                Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                                spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                              properties:
                                apiVersion:
                                  description: Version of the schema the FieldPath
                                    is written in terms of, defaults to "v1".
                                  type: string
                                fieldPath:
                                  description: Path of the field to select in the
                                    specified API version.
                                  type: string
                              required:
                              - fieldPath
                              type: object
                              x-kubernetes-map-type: atomic
                            fileKeyRef:
                              description: |-
                                FileKeyRef selects a key of the env file.
                                Requires the EnvFiles feature gate to be enabled.
                              properties:
                                key:
                                  description: |-
                                    The key within the env file. An invalid key will prevent the pod from starting.
                                    The keys defined within a source may consist of any printable ASCII characters except '='.
                                    During Alpha stage of the EnvFiles feature gate, the key size is limited to 128 characters.
                                  type: string
                                optional:
                                  default: false
                                  description: |-
                                    Specify whether the file or its key must be defined. If the file or key
                                    does not exist, then the env var is not published.
                                    If optional is set to true and the specified key does not exist,
                                    the environment variable will not be set in the Pod's containers.

                                    If optional is set to false and the specified key does not exist,
                                    an error will be returned during Pod creation.
                                  type: boolean
                                path:
                                  description: |-
                                    The path within the volume from which to select the file.
                                    Must be relative and may not contain the '..' path or start with '..'.
                                  type: string
                                volumeName:
                                  description: The name of the volume mount containing
                                    the env file.
                                  type: string
                              required:
                              - key
                              - path
                              - volumeName
                              type: object
                              x-kubernetes-map-type: atomic
                            resourceFieldRef:
                              description: |-
                                Selects a resource of the container: only resources limits and requests
                                (limits.cpu, limits.memory, limits.ephemeral-storage, requests.cpu, requests.memory and requests.ephemeral-storage) are currently supported.
                              properties:
                                containerName:
                                  description: 'Container name: required for volumes,
                                    optional for env vars'
                                  type: string
                                divisor:
                                  anyOf:
                                  - type: integer
                                  - type: string
                                  description: Specifies the output format of the
                                    exposed resources, defaults to "1"
                                  pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                  x-kubernetes-int-or-string: true
                                resource:
                                  description: 'Required: resource to select'
                                  type: string
                              required:
                              - resource
                              type: object
                              x-kubernetes-map-type: atomic
                            secretKeyRef:
                              description: Selects a key of a secret in the pod's
                                namespace
                              properties:
                                key:
                                  description: The key of the secret to select from.  Must
                                    be a valid secret key.
                                  type: string
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                                optional:
                                  description: Specify whether the Secret or its key
                                    must be defined
                                  type: boolean
                              required:
                              - key
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - name
                      type: object
                    type: array
                  executionModel:
                    default: serving
                    description: |-
                      executionModel determines how the agent runtime is hosted:
                        - serving (default): a Knative Service (request-driven), unchanged from M1.
                        - eventing: a Knative Service PLUS a Knative Eventing Trigger subscribing it
                          to the agent's registry broker (the agent must be a registry member).
                        - job: a one-shot Kubernetes Job (restartPolicy Never), or a CronJob when a
                          schedule AgentScalingPolicy targets the agent.
                      The reconciler branches on this value; serving stays the default so every
                      M1-M6 agent is unaffected.
                    enum:
                    - serving
                    - eventing
                    - job
                    type: string
                  image:
                    description: |-
                      image is the fully-qualified container image for the agent,
                      e.g. "ghcr.io/ctxmesh/echo-agent:latest". Required.
                    minLength: 1
                    type: string
                  port:
                    default: 8080
                    description: |-
                      port is the TCP port the agent HTTP server listens on. Passed to the
                      container as the $AGENT_PORT environment variable. Defaults to 8080.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  resources:
                    description: |-
                      resources optionally constrains the CPU and memory available to the agent
                      container. When omitted, no resource requests are set (Knative default).
                    properties:
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          cpu is the CPU resource request for the agent container, e.g. "500m".
                          Maps to resources.requests.cpu on the Knative Service container.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          memory is the memory resource request for the agent container, e.g. "256Mi".
                          Maps to resources.requests.memory on the Knative Service container.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  role:
                    description: |-
                      role is the agent's role within its AgentRegistry (PRD §12.4 role-based
                      access control). The three built-in roles always exist: "orchestrator",
                      "worker", and "reviewer"; a registry may also declare custom roles via
                      AgentRegistry.spec.roles. When set on a registry member, the controller
                      injects it as the static AGENT_ROLE env var, which the launcher stamps
                      into the A2A message envelope and checks against the callee's role policy.
                      Bounded at 63 characters (the AGENT_ROLE value is a short label, never a
                      free-form string). Ignored for non-members.
                    maxLength: 63
                    type: string
                  scaling:
                    description: |-
                      scaling configures the Knative autoscaler bounds for this agent.
                      When omitted, defaults to min=0 (scale-to-zero) and max=3.
                    properties:
                      max:
                        default: 3
                        description: max is the maximum number of replicas the autoscaler
                          may create.
                        format: int32
                        minimum: 1
                        type: integer
                      min:
                        default: 0
                        description: min is the minimum number of replicas. Set to
                          0 (default) to enable scale-to-zero.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                required:
                - image
                type: object
            required:
            - deploymentName
            - snapshot
            type: object
            x-kubernetes-validations:
            - message: AgentVersion spec is immutable
              rule: self == oldSelf
        required:
        - spec
        type: object
    served: true
    storage: true
