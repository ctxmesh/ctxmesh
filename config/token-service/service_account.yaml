# Central OBO token-service ServiceAccount (ADR 0030 §1). Its Role grants ONLY the
# credential-plane reads/writes the resolver needs (grant Secrets + ToolRegistry lookups),
# never agent-CRD access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: token-service
  namespace: system
  labels:
    control-plane: token-service
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
