# Binds the token-service SA to its least-privilege Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: token-service-rolebinding
  namespace: system
  labels:
    control-plane: token-service
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: token-service-role
subjects:
  - kind: ServiceAccount
    name: token-service
    namespace: system
