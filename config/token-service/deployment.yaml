# Central OBO token-service Deployment (ADR 0030 §1). Runs the credresolve backend behind
# an internal API; the per-pod injecting egress sidecars DELEGATE grant reads + OAuth
# refresh here, so those two ceilings amortize once at the center (global cache + singleflight).
#
# The credential backend is this Deployment's own configuration (CREDENTIAL_BACKEND*, ADR 0152);
# unset means the built-in kubernetes backend, so a plain install needs no external store.
#
# CALLER AUTHENTICATION (ADR 0154): every request carries a projected ServiceAccount token,
# reviewed by TokenReview (the tokenreviewer ClusterRole). The egress sidecar and the BFF
# present the ctxmesh-token-service audience, an agent's own container the
# ctxmesh-token-service-agent audience. A credential resolves only for the run capability the
# sidecar forwards, verified with the capability public key from bff-capability; only the
# ServiceAccounts in TOKEN_SERVICE_PLATFORM_SERVICE_ACCOUNTS (the BFF's) may store grants.
#
# TLS POSTURE: the TLS env below always points at an OPTIONAL cert Secret mount
# (token-service-tls). Provision that Secret and the wire is encrypted; absent it, the service
# serves plain HTTP with a LOUD warning (dev only). A ca.crt in it is taken as the client CA
# and makes the service demand client certificates (ADR 0102 §3).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-service
  namespace: system
  labels:
    control-plane: token-service
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  # progressDeadlineSeconds: Kubernetes defaults to 600s, and this workload cannot meet it on a COLD
  # cluster. It fails fast when the control-plane store is unreachable and relies on Kubernetes to
  # restart it, so while postgres is still pulling its image this pod crash-loops -- and CrashLoopBackOff
  # is exponential (10s..300s). On a cold node postgres can take minutes, by which time its dependents
  # are sleeping out a 300s backoff, and the Deployment trips the 600s deadline with nothing actually
  # broken. That failed a first `helm install` of v0.1.0-beta.1 intermittently, decided purely by how
  # fast postgres pulled relative to eight other images. Raising it hands the bound back to the user's
  # `helm --timeout` instead of a fixed 600s. The real fix is retrying the store connection in-process
  # instead of exiting (m52.M166-store-retry); this stops the release being a coin flip until then.
  progressDeadlineSeconds: 1800
  selector:
    matchLabels:
      control-plane: token-service
      app.kubernetes.io/name: ctxmesh
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: token-service
      labels:
        control-plane: token-service
        app.kubernetes.io/name: ctxmesh
    spec:
      # Load-bearing: a Service named credential-backend would inject CREDENTIAL_BACKEND_* variables,
      # which the strict config refuses (TestConfigFromEnv_RefusesServiceLinkVariables).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: token-service
          image: token-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: mtls
              containerPort: 8443
              protocol: TCP
          env:
            # CONTAINER_MEMORY_LIMIT_BYTES — the container's own memory limit, via the downward
            # API. internal/runtimelimit reads it at startup and sets GOMEMLIMIT to 80% of it.
            #
            # Without this the Go GC sizes the heap from GOGC alone, knows nothing about the
            # cgroup, and grows straight through the limit — so the kernel kills the process
            # rather than the collector working harder. M148 watched the BFF do exactly that at
            # 512Mi AND again at 1Gi: the ceiling was never the problem (M148/m148.12).
            - name: CONTAINER_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: token-service
                  resource: limits.memory
                  divisor: "1"
            # MCP_CREDENTIAL_NAMESPACE is the locked namespace holding per-user grant Secrets
            # (ADR 0029 §7); must match the BFF's bff.mcp.credentialNamespace. Empty (default)
            # keeps the legacy per-source-namespace grant path so kustomize/helm-default stay
            # valid. The Helm chart templates it from mcp.credentialNamespace (no drift).
            - name: MCP_CREDENTIAL_NAMESPACE
              value: ctxmesh
            # MODEL_GATEWAY_URL — the token-service is the SOLE holder of the pgvector
            # knowledge + long-term-memory stores, and it embeds the QUERY through the
            # gateway. cmd/token-service/main.go hangs BOTH WithMemory and WithKnowledge
            # off a single `gwURL != ""` condition, so with this unset managed-RAG
            # retrieval is not merely degraded — it is never wired at all, and every KB
            # search returns an empty result set with no error anywhere.
            #
            # M148/m148.11 found this the hard way: ingestion wrote chunks correctly and
            # search still returned nothing, because the READ half lives here and this
            # variable had no chart home. It is the same gap as m148.5 (the BFF's own
            # gateway URL) in the component that actually serves retrieval, which is why
            # RAG had never worked on a stock install.
            - name: MODEL_GATEWAY_URL
              value: http://ctxmesh-gateway.ctxmesh.svc:4000
            # The cross-encoder rerank stage (ADR 0117) is optional and deployed
            # separately; empty keeps it off without disabling retrieval.
            - name: KNOWLEDGE_RERANK_URL
              value: ""
            # Caller authentication (ADR 0154). The capability public key verifies the run
            # capability a sidecar forwards; optional because the keygen hook creates it after the
            # install and then restarts this Deployment. Without it credential resolution answers
            # 503, unless MCP_OBO_REQUIRED, which refuses to start as the BFF does.
            - name: MCP_CAPABILITY_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: bff-capability
                  key: MCP_CAPABILITY_PUBLIC_KEY
                  optional: true
            - name: MCP_CAPABILITY_AUDIENCE
              value: ""
            - name: MCP_OBO_REQUIRED
              value: "false"
            # The ServiceAccounts, in this namespace, that may store and revoke grants: the BFF's.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TOKEN_SERVICE_PLATFORM_SERVICE_ACCOUNTS
              value: ctxmesh-bff
            # TLS files live on the OPTIONAL token-service-tls mount. Present ⇒ TLS; absent ⇒
            # plain HTTP (dev). No literal secret material here.
            - name: TOKEN_SERVICE_TLS_CERT_FILE
              value: /etc/token-service/tls/tls.crt
            - name: TOKEN_SERVICE_TLS_KEY_FILE
              value: /etc/token-service/tls/tls.key
            - name: TOKEN_SERVICE_CLIENT_CA_FILE
              value: /etc/token-service/tls/ca.crt
            # TOKEN_SERVICE_TLS_REQUIRED (SEC-5): false ⇒ absent certs degrade to plain HTTP
            # (dev). The chart templates it from tokenService.tls.required; true ⇒ the
            # token-service refuses to start without TLS (no silent HTTP downgrade of the
            # credential plane in production). Default "false" so kustomize/helm-default match.
            - name: TOKEN_SERVICE_TLS_REQUIRED
              value: "false"
          # CONTROLPLANE_DSN (ADR 0044) — the token-service REQUIRES it at startup
          # (cmd/token-service/main.go:118 hard-exits without it). Sourced from the shared
          # bff-adapters Secret, never a literal here. optional:true so the manifest builds
          # before the Secret exists — a real install MUST provision it (audit FUNC-1).
          envFrom:
            # Chart-owned DSN first (M148/ADR 0130). cmd/token-service/main.go:91
            # os.Exit(1)s on an empty CONTROLPLANE_DSN exactly as the manager and the
            # BFF do — it is the FOURTH consumer of that Secret, and the one m148.3
            # missed. Found by redeploying and watching it CrashLoop, not by reading
            # the diff: the running pod only survived because a past session had set
            # the env by hand, which is the same illusion that hid the original bug.
            - secretRef:
                name: postgres-dsn
                optional: true
            # Operator adapter creds second, so they override the chart default.
            - secretRef:
                name: bff-adapters
                optional: true
          # startupProbe so LIVENESS does not police STARTUP (see config/manager/manager.yaml).
          # Every component here gave its process 45-75s to come up on a COLD cluster or be killed,
          # which is a crash-loop caused by the probe rather than by anything being wrong.
          startupProbe:
            tcpSocket:
              port: 8443
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          volumeMounts:
            - name: tls
              mountPath: /etc/token-service/tls
              readOnly: true
      volumes:
        # Optional: the platform TLS material. Absent ⇒ the mount is empty ⇒ plain HTTP.
        - name: tls
          secret:
            secretName: token-service-tls
            optional: true
      serviceAccountName: token-service
      terminationGracePeriodSeconds: 10
