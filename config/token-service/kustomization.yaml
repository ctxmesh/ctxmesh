# Central OBO token-service — Deployment + Service + least-privilege SA/RBAC (ADR 0030 §1).
# Flows into config/default (namespace agent-engine-system, namePrefix agent-engine-).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
  - service.yaml
  - deployment.yaml
