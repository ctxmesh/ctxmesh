# Token-service Role — the LEAST privilege the central credential resolver needs (ADR 0030
# §1, ADR 0029 §7). It reads per-user grant Secrets and writes back rotated tokens
# (optimistic concurrency) + deletes on revoke; it reads ToolRegistries to classify a
# server's auth type / scope. NO agent-CRD access, NO create.
#
# This Role is namespaced to the platform namespace. When an operator runs OBO with a
# DEDICATED credential namespace (mcp.credentialNamespace), the Helm chart also binds this
# SA to the credential-component RBAC there (templated), so grants resolve cross-namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: token-service-role
  namespace: system
  labels:
    control-plane: token-service
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
rules:
  # Per-user grant Secrets in the LOCKED credential namespace: read to resolve, CREATE a
  # first-time (user, server) grant, update to write back a rotated token / re-consent, delete on
  # revoke (RFC 7009: forget locally). create IS required — K8sBackend.StoreGrant upserts, calling
  # Client.Create on a not-found grant (internal/credresolve/backend.go). Grants live only in this
  # one namespace (ADR 0029 §7), so this stays a namespaced Role. (ToolRegistry + CredentialStore
  # reads are cluster-wide — the plane serves requests from ANY namespace — see the ClusterRole.)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
