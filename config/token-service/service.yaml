# Token-service Service — the central credential plane the injecting egress sidecars
# delegate to (ADR 0030 §1), authenticating with projected tokens (ADR 0154). Sidecars reach
# it via TOKEN_SERVICE_URL (https://ctxmesh-token-service.<ns>.svc:8443 when TLS is required),
# injected by the controller.
apiVersion: v1
kind: Service
metadata:
  name: token-service
  namespace: system
  labels:
    control-plane: token-service
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    control-plane: token-service
    app.kubernetes.io/name: ctxmesh
  ports:
    - name: mtls
      port: 8443
      targetPort: 8443
      protocol: TCP
