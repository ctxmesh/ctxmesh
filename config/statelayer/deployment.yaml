# Valkey State-Layer Deployment — dedicated session-memory backend (specs/state-layer.md, PRD §10).
# Deliberately NOT Langfuse's Redis: no product-to-observability coupling.
# Image pinned at valkey/valkey:8.1.3 (newest 8.1.x stable as of 2026-07-09;
# verified multi-arch amd64/arm64 via docker manifest inspect).
# Dev posture: emptyDir + appendonly no — agent scale-to-zero never touches
# Valkey; losing dev sessions on a Valkey restart is accepted (spec: Not in M5).
# Probes: tcpSocket on 6379 — valkey-cli ping via exec would fork a process per
# probe period for no extra signal (an unauthenticated dev Valkey accepts TCP
# only once it can serve commands; there is no separate "loading" window with
# appendonly off and no RDB to restore from emptyDir). tcpSocket is cheaper and
# equally accurate here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statelayer
  namespace: system
  labels:
    control-plane: statelayer
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: statelayer
      app.kubernetes.io/name: ctxmesh
  template:
    metadata:
      labels:
        control-plane: statelayer
        app.kubernetes.io/name: ctxmesh
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3
          args:
            - --appendonly
            - "no"
            # State-layer ACL hardening (M53, ADR 0050 §6): the state-layer proxy is the
            # ONLY client (post-m53.7-cutover agents hold no Valkey path). Scope the
            # default (nopass) user to the three state-layer key spaces and deny
            # destructive/admin commands, so a compromised proxy cannot wipe or
            # reconfigure the store. No password (dev posture, ADR 0049) — this is
            # command/key restriction as defense-in-depth, not authentication. Verified
            # live: the arg form parses AND enforcement denies flushall/config/out-of-
            # scope keys. BYO-external Valkey operators mirror this ACL (m53.7 guidance).
            - --user
            - default
            - "on"
            - nopass
            - sanitize-payload
            - resetchannels
            - "~mem:*"
            - "~tenant:*"
            - "~a2a:seen:*"
            # spawn-tree counters for delegate-to spawn-guard enforcement (M64/M94, ADR 0057/0088):
            # the launcher's spawn guard reads/writes spawn:{ns}:{scope}:{root}:{inflight|count} via the
            # state-layer proxy. Missing from the M53 ACL → NOPERM → spawn_guard_unavailable → delegation
            # fails closed. Added M119 (the delegation run-tree was never live-exercised on this ACL).
            - "~spawn:*"
            # per-AGENT durable cost keys (m84.6, ADR 0063 D1): the launcher's gateway books each
            # completion's spend onto agent:{ns}/{name}:spend:{YYYY-MM} via the state-layer proxy's
            # /quota/agent-spend, and the BFF cost-rollup worker snapshots them into cost_rollups
            # (scope_type='agent') → the Cost surface. Missing from the M53/M119 ACL → NOPERM → the
            # agent-spend write 502s and is swallowed → cost_rollups stays empty → the Cost surface
            # shows $0. Added M122 (the cost pipeline was never live-exercised on this ACL).
            - "~agent:*"
            - "+@all"
            - "-flushall"
            - "-flushdb"
            - "-config"
            - "-debug"
            - "-shutdown"
            - "-swapdb"
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi   # leak policy: a runaway keyspace OOMs the pod, not the node
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
      terminationGracePeriodSeconds: 10
