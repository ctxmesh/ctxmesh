# ClusterIP Service for the Valkey State Layer. The controller's default
# sessionMemory backend addr is agentry-statelayer.agentry.svc:6379.
apiVersion: v1
kind: Service
metadata:
  name: statelayer
  namespace: system
  labels:
    control-plane: statelayer
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: statelayer
    app.kubernetes.io/name: agentry
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      protocol: TCP
