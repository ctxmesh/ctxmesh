# ClusterIP Service for the Valkey State Layer. The MemoryBinding controller's
# default backend addr is agent-engine-statelayer.agent-engine-system.svc:6379.
apiVersion: v1
kind: Service
metadata:
  name: statelayer
  namespace: system
  labels:
    control-plane: statelayer
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: statelayer
    app.kubernetes.io/name: agent-engine
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      protocol: TCP
