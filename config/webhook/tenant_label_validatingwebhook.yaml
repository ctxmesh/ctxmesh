# Tenant-label ValidatingWebhook (C14, audit P1-3) — OPT-IN, NOT wired into config/default.
#
# Activation is a user-gated deploy step (the base install has no webhook cert infra):
#   1. Install cert-manager (or provide serving certs) and a Certificate for the webhook Service.
#   2. Set ENABLE_TENANT_LABEL_WEBHOOK=true and TENANT_WEBHOOK_CONTROLLER_SA=<the controller SA username>
#      on the controller-manager Deployment (the manager then registers /validate-tenant-label).
#   3. Add this directory to config/default/kustomization.yaml (with the cert-manager caBundle injection).
# See internal/webhook/tenant_label.go. Carded: m52.C14.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: tenant-label-validator
  annotations:
    # cert-manager injects the CA bundle here when a Certificate is issued for the webhook Service.
    cert-manager.io/inject-ca-from: system/webhook-serving-cert
webhooks:
  - name: tenant-label.agents.ctxmesh.ai
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail # fail-closed: if the webhook is unreachable, deny the namespace write
    clientConfig:
      service:
        name: webhook-service
        namespace: system
        path: /validate-tenant-label
    rules:
      # audit P2-1: include the status + finalize subresources — for a built-in Namespace the status/finalize
      # strategies do not reset metadata, so a label set via either subresource would otherwise bypass the
      # webhook (needs explicit `update namespaces/status|/finalize` RBAC, but close it anyway). The handler
      # compares full old/new objects, so it evaluates them correctly.
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["namespaces", "namespaces/status", "namespaces/finalize"]
        scope: "Cluster"
