# Durable run-worker overlay (ADR 0034, m32.2): the worker Deployment + its KEDA autoscaler.
#
# Opt-in — NOT wired into config/default by default (a deploy enables the worker path only when it
# has provisioned the durable Postgres run store + set RUN_WORKER_DISPATCH=true on the BFF). Apply
# with `kubectl apply -k config/run-worker` once the `run-store` + `bff-capability` Secrets exist.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The default install namespace (config/default). A standalone `kustomize build config/run-worker |
# kubectl apply` must target the SAME namespace the control plane installed into, or it lands in a
# non-existent `system` ns with a dangling SA (OPS-4e). This overlay carries no namePrefix on purpose:
# the run-worker Deployment name (`run-worker`) is referenced verbatim by the ScaledObject's
# scaleTargetRef, which kustomize's name-reference transformer does NOT rewrite for a CRD — a prefix
# would silently break the KEDA target. The bff SA is name-aligned explicitly on the Deployment below.
namespace: ctxmesh
resources:
  - deployment.yaml
  - scaledobject.yaml
