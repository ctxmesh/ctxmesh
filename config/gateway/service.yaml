# ClusterIP Service for the LiteLLM gateway. Agents reach the gateway via
# MODEL_GATEWAY_URL=http://agent-engine-gateway.agent-engine-system.svc:4000
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: system
  labels:
    control-plane: gateway
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    control-plane: gateway
    app.kubernetes.io/name: agent-engine
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      protocol: TCP
