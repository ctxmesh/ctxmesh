# This rule is not used by the project ctxmesh itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over agents.ctxmesh.ai.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
  name: agentdeployment-admin-role
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments
  # Enumerated rather than '*' (M149 m149.3). Behaviour-preserving — these are every
  # standard verb — but a FUTURE custom verb is no longer implied. M146 needed a `kill`
  # permission that a wildcard would have granted to every holder of this role, and had to
  # route it through a subresource to escape that; this removes the hazard at the source.
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
  - deletecollection
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments/status
  verbs:
  - get
