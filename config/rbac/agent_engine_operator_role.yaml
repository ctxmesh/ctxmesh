# Platform-persona ClusterRole: agent-engine-operator (M11.4, PRD §20).
#
# Full management of every agent.ctxmesh.ai CRD — all verbs on all agent
# resources plus their status subresources. Intended for platform operators who
# own the agent control plane. Bind to users/groups/ServiceAccounts via a
# (Cluster)RoleBinding created by the cluster admin.
#
# This role is NOT used by the agent-engine controller itself (that is
# manager-role in role.yaml); it is a built-in persona for humans/automation
# acting on the CRDs through the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
    rbac.ctxmesh.ai/persona: operator
  name: operator
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments
  - agentversions
  - modelroutes
  - secretbindings
  - mcptoolbindings
  # toolregistries is retired as a CRD (ADR 0044) but stays in this persona RBAC:
  # the BFF gates every store read/write with a SelfSubjectAccessReview on this
  # resource, so the persona's RBAC on toolregistries IS the authorization policy.
  # Do NOT remove — dropping it would fail-closed every ToolRegistry API call.
  - toolregistries
  - memorybindings
  - agentregistries
  - agentscalingpolicies
  - evalsuites
  verbs:
  - '*'
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments/status
  - agentversions/status
  - modelroutes/status
  - secretbindings/status
  - mcptoolbindings/status
  - memorybindings/status
  - agentregistries/status
  - agentscalingpolicies/status
  - evalsuites/status
  verbs:
  - get
  - list
  - watch
