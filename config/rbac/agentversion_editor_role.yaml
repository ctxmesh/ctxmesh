# This rule is not used by the project agent-engine itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the agents.ctxmesh.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: agentversion-editor-role
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentversions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentversions/status
  verbs:
  - get
