# Platform-persona ClusterRole: ctxmesh-credential-admin (M155, ADR 0136).
#
# WHY THIS EXISTS
# ---------------
# Every console flow that stores a credential writes a core Secret with the CALLER's client
# (ADR 0011, caller-scoped). No other shipped persona grants `secrets: create` —
# ctxmesh-operator withholds it deliberately, by name, for least privilege — so four flows
# were uncompletable by every shipped role:
#
#   * connect a model provider          (internal/bff/providers.go)
#   * register a key-authed MCP server  (internal/bff/mcpservers.go)
#   * complete an MCP OAuth grant       (internal/bff/mcp_grant_handlers.go)
#   * store an org-level MCP credential (internal/bff/mcp_org_handlers.go)
#
# The product shipped a first-run story ("connect a provider in the console") that no shipped
# role could execute.
#
# BIND IT WITH A RoleBinding, NOT A ClusterRoleBinding
# ----------------------------------------------------
# This is a ClusterRole so it can be bound into ANY namespace without the platform having to
# provision a Role there first — exactly how Kubernetes' own `admin` and `edit` ClusterRoles
# work (both grant secrets create/delete/patch/update and are documented for per-namespace
# RoleBinding). A ClusterRole is a permission TEMPLATE; it grants nothing until bound.
#
#   kubectl create rolebinding alice-credentials \
#     --clusterrole=ctxmesh-credential-admin --user=alice -n team-a
#
# That name is the BUILT one. This file declares `credential-admin`; config/default's
# `namePrefix: ctxmesh-` makes it `ctxmesh-credential-admin`, which is also what the Helm chart
# renders. Do not `kubectl apply -f` this file on its own — you get an unprefixed role, and the
# command above then fails with "clusterrole not found" against a role that is sitting right
# there under a different name.
#
# Binding it with a ClusterRoleBinding would give cluster-wide Secret writes, which is the
# posture hack/rbac-least-privilege.sh exists to prevent. The gate enforces that no binding
# WE ship does so; a cluster admin who binds it cluster-wide has made that choice knowingly.
#
# NOTHING BINDS THIS BY DEFAULT. An install grants no one credential writes; an operator opts
# in, per namespace, which is the right granularity for "who may store credentials for this
# team".
#
# NO READ VERBS, ON PURPOSE
# -------------------------
# create/update/delete only. The console never reads a key back — it writes the Secret and
# thereafter refers to it through a SecretBinding — so this role must not become a way to
# read every credential in a namespace. Least privilege is the whole reason it is separate.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
    rbac.ctxmesh.ai/persona: credential-admin
    # Read by hack/rbac-least-privilege.sh: this ClusterRole is permitted to grant Secret
    # writes ONLY because it is bind-only and nothing we ship binds it cluster-wide.
    rbac.ctxmesh.ai/bind-only: "true"
  name: credential-admin
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - update
      - delete
