# Platform-persona ClusterRole: ctxmesh-developer (M11.4, PRD §20).
#
# Manage agents: create/update/delete/get/list/watch on every agent.ctxmesh.ai
# CRD (developers author AgentDeployment/PromptVersion/EvalSuite and their
# supporting bindings), plus read access to the status subresources. Does NOT
# grant '*' (no ability to escalate/manage RBAC or use unbounded verbs on the
# resources) — that is the operator persona.
#
# This role is NOT used by the ctxmesh controller itself; it is a built-in
# persona for developers acting on the CRDs through the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
    rbac.ctxmesh.ai/persona: developer
  name: developer
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments
  - agentversions
  - modelroutes
  - secretbindings
  - mcptoolbindings
  # toolregistries is retired as a CRD (ADR 0044) but stays in this persona RBAC:
  # the BFF gates every store read/write with a SelfSubjectAccessReview on this
  # resource, so the persona's RBAC on toolregistries IS the authorization policy.
  # Do NOT remove — dropping it would fail-closed every ToolRegistry API call.
  - toolregistries
  # promptversions is likewise store-backed (Postgres-authoritative, ADR 0044):
  # the BFF authorizes every PromptVersion store read/write with a caller-scoped
  # SelfSubjectAccessReview on this resource, so the persona's RBAC on
  # promptversions IS the authz policy. Omitting it fail-closes every PromptVersion
  # API call — the same contract as toolregistries above.
  - promptversions
  - agentregistries
  - agentteams
  - workflows
  - agentscalingpolicies
  - evalsuites
  # knowledgebases is a v1beta1 CRD an author owns (RAG grounding, M68); the console
  # Knowledge Bases surface + the BFF caller-scoped list authorize on this grant — without
  # it every /api/knowledgebases call fail-closes to 403 (M116 fix).
  - knowledgebases
  - guardrailpolicies
  # alertpolicies mirrors guardrailpolicies (an agent-scoped policy CRD, M70/ADR 0063 D2): an
  # author defines alerting for their agents, and the grant also passes the GET /api/alerts SSAR.
  - alertpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Tenants are a platform-admin object (namespace grouping + quotas); a developer
# reads them (console visibility) but does not manage them — that is the operator's.
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments/status
  - agentversions/status
  - modelroutes/status
  - secretbindings/status
  - mcptoolbindings/status
  - agentregistries/status
  - agentteams/status
  - workflows/status
  - agentscalingpolicies/status
  - evalsuites/status
  - knowledgebases/status
  - guardrailpolicies/status
  - alertpolicies/status
  verbs:
  - get
  - list
  - watch
# MCP-server registration (POST /api/mcpservers) creates the tool's egress NetworkPolicy
# with the CALLER's client (ADR 0011), so a builder self-serves it in their namespace.
# (Caller-created NetworkPolicy is a design smell — m52.G9 tracks moving it controller-
# side; until then the builder needs this. An auth-less MCP needs no Secret, so `secrets`
# create is deliberately NOT granted here — least privilege.)
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - get
  - list
  - delete
