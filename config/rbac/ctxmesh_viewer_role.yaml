# Platform-persona ClusterRole: ctxmesh-viewer (M11.4, PRD §20).
#
# Read-only across every agent.ctxmesh.ai CRD: get/list/watch on the resources
# and their status subresources, no mutating verbs. Intended for auditors,
# dashboards, and least-privilege service accounts that only observe the agent
# control plane.
#
# This role is NOT used by the ctxmesh controller itself; it is a built-in
# persona for read-only access to the CRDs through the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
    rbac.ctxmesh.ai/persona: viewer
  name: viewer
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments
  - agentversions
  - modelroutes
  - secretbindings
  - mcptoolbindings
  # toolregistries is retired as a CRD (ADR 0044) but stays in this persona RBAC:
  # the BFF gates every store read with a SelfSubjectAccessReview on this resource,
  # so the persona's RBAC on toolregistries IS the authorization policy. Do NOT
  # remove — dropping it would fail-closed every ToolRegistry read for viewers.
  - toolregistries
  # promptversions is likewise store-backed (Postgres-authoritative, ADR 0044):
  # the BFF authorizes every PromptVersion store read with a caller-scoped
  # SelfSubjectAccessReview on this resource, so the persona's RBAC on
  # promptversions IS the authz policy. Omitting it fail-closes every PromptVersion
  # read for viewers — the same contract as toolregistries above.
  - promptversions
  - agentregistries
  - agentteams
  - workflows
  - agentscalingpolicies
  - evalsuites
  - knowledgebases # M116: console Knowledge Bases surface + caller-scoped list (was 403 for all roles)
  - guardrailpolicies
  # alertpolicies mirrors guardrailpolicies (an agent-scoped policy CRD, M70/ADR 0063 D2): a
  # read-only viewer sees the fired-alert feed (GET /api/alerts gates on a caller-scoped SSAR
  # on this resource). Read verbs only, like the rest of the viewer persona.
  - alertpolicies
  - tenants
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments/status
  - agentversions/status
  - modelroutes/status
  - secretbindings/status
  - mcptoolbindings/status
  - agentregistries/status
  - agentteams/status
  - workflows/status
  - agentscalingpolicies/status
  - evalsuites/status
  - knowledgebases/status
  - guardrailpolicies/status
  - alertpolicies/status
  verbs:
  - get
  - list
  - watch
