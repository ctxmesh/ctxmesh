# Dev-only credentials for the dedicated blob-offload MinIO (specs/eventing-scaling.md
# §"Blob offload"). These are DETERMINISTIC, DEV-ONLY, FIXED values committed as
# such — identical posture to the dev Langfuse / Valkey: NOT a real credential,
# never rotated, only ever meaningful against this in-cluster dev MinIO. The
# controller injects the SAME values into a registry member's launcher as STATIC
# env (OBJECT_STORE_ACCESS_KEY / OBJECT_STORE_SECRET_KEY) — see
# internal/controller/agentdeployment_controller.go objectStoreDevAccessKey /
# objectStoreDevSecretKey, which MUST match rootUser / rootPassword here.
#
# stringData (not data) so the values are human-readable in git and trivially
# grep-able against the controller constants; kustomize/apply encodes them.
apiVersion: v1
kind: Secret
metadata:
  name: objectstore-dev
  namespace: system
  labels:
    control-plane: objectstore
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # The dev access/secret keys the launcher, the BFF and the controller all use as S3 CLIENT
  # credentials. Named rootUser/rootPassword for continuity with every consumer that already
  # reads those keys (config/bff/deployment.yaml, the controller constants above).
  rootUser: ctxmesh-dev
  rootPassword: ctxmesh-dev-secret
  # The SERVER side of the same pair. SeaweedFS takes its S3 identities as a config FILE rather
  # than env vars, so the one credential pair is expressed twice and must stay in step -- which
  # is why it lives in this Secret beside the keys rather than in a separate ConfigMap.
  s3.json: |
    {
      "identities": [
        {
          "name": "ctxmesh-dev",
          "credentials": [
            { "accessKey": "ctxmesh-dev", "secretKey": "ctxmesh-dev-secret" }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
