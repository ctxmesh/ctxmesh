# BFF Role — INFRA/HEALTH READS ONLY, and today that set is EMPTY.
#
# ADR 0011 (auth-transparent proxy): the BFF must NOT hold agent-CRD access. All
# user-facing CRD list/get/create/update/delete run on the CALLER'S token via a
# per-request client, so the API server enforces the caller's RBAC. Consequently
# the BFF's own SA needs NO agent-CRD verbs (agentdeployments / agentregistries /
# agentversions / …) and NO create/update/delete anywhere.
#
# The BFF's server-side work that is NOT caller-scoped uses NON-K8s creds:
#   - /api/health           — no cluster access at all (pure liveness + version)
#   - Langfuse adapter      — Langfuse public API creds (env/Secret), not RBAC
#   - Prometheus adapter    — Prometheus URL/token (env), not RBAC
#   - in-cluster base config — only AUTHENTICATES to the API server (host + CA);
#                              authentication needs no RBAC grant
# so the genuine caller-scoped set is empty. This Role is committed with an
# explicit, auditable ruleset — a reviewer sees exactly what the SA can do
# instead of inferring it from an absent binding. If the BFF ever needs a
# specific SA-side read (e.g. a ConfigMap holding the Langfuse URL), add EXACTLY
# that get/list here and nothing more — never a WRITE verb, never a caller-scoped
# read.
#
# NOTE (M69): the online-scoring worker's per-agent policy read is NOT here — it
# is a CLUSTER-scoped read (agents live in many namespaces, not just `system`),
# so it lives in the dedicated bff-online-scorer ClusterRole below. A namespaced
# Role in `system` cannot authorize reads in an agent's own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: bff-role
  namespace: system
rules: []
---
# THE ONE SANCTIONED SA-SIDE CROSS-NAMESPACE READ (M69, ADR 0062 Fork 2): the
# online-scoring worker — an OFF-REQUEST control-plane worker (governance #8),
# NOT a caller-scoped request path — resolves each agent's EvalSuite.online
# policy by reading AgentDeployment.spec.evalSuiteRef → EvalSuite.spec.online.
# It holds no caller token and reads agents across ALL namespaces, so this is a
# ClusterRole (a namespaced Role in `system` would grant zero access in an
# agent's own namespace). Read-only get/list on agentdeployments + evalsuites
# only. This is NOT the ADR-0011 confused-deputy hole: it is read-only,
# non-caller-scoped control-plane policy resolution — the same trust class as
# the worker's cpDB + Langfuse creds. No create/update/delete anywhere. Bound
# only where the worker runs; the front-end BFF (ONLINE_SCORER_ENABLED unset)
# never exercises it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: bff-online-scorer
rules:
- apiGroups:
  - agents.ctxmesh.ai
  resources:
  - agentdeployments
  - evalsuites
  verbs:
  - get
  - list
