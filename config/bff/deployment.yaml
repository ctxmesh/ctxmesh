# Go BFF Deployment — the UI's server-side layer (ADR 0010 / spec ui-dev-helm §2).
#
# Serves the STATIC Vite SPA (from /ui/dist baked into the image) plus the /api/*
# surface, all behind the M11 control-plane auth (BearerAuthenticator). The image
# is the distroless Go binary + compiled dist (Dockerfile.bff) — NO Node runtime.
#
# AUTHZ POSTURE (ADR 0011): user-facing CRD ops run on the CALLER'S token via a
# per-request client; the BFF SA (serviceAccountName: bff) holds no agent-CRD
# access. The in-cluster rest.Config the SA provides is used only as the BASE
# (API-server host + cluster CA) for that caller-scoped factory.
#
# ADAPTER CREDS: Langfuse/Prometheus creds are injected from an OPTIONAL Secret
# (envFrom, optional: true) — never literals in this manifest. Absent the Secret
# the adapters stay nil and their routes serve an honest 501; /api/health and the
# static UI still work. The Secret is supplied out of band (a real deploy) or by
# the dev data plane; the env var names match cmd/bff/main.go
# (LANGFUSE_HOST / LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / PROMETHEUS_URL /
# PROMETHEUS_TOKEN).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
  namespace: system
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: bff
      app.kubernetes.io/name: agent-engine
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: bff
      labels:
        control-plane: bff
        app.kubernetes.io/name: agent-engine
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bff
          image: bff:latest
          imagePullPolicy: IfNotPresent
          # --static-dir is baked into the image ENTRYPOINT; --addr defaults to
          # :9090. Nothing here overrides them so the manifest stays minimal.
          ports:
            - name: http
              containerPort: 9090
              protocol: TCP
          # Non-secret feature flags. PROVIDER_CONNECT_ENABLED is the ADR 0015
          # connect-a-provider kill-switch: "true" (the default) exposes the
          # POST/GET /api/providers endpoints; "false" on a hardened install makes
          # them 404 and the UI falls back to reference-existing. This literal keeps
          # `kustomize build`/`make deploy` valid; the Helm chart templates THIS env
          # value from `bff.providerConnect.enabled` (values.yaml) so an operator can
          # `helm install --set bff.providerConnect.enabled=false` — the generator
          # (hack/gen_helm_chart.py) substitutes it, default renders "true" (no drift).
          env:
            - name: PROVIDER_CONNECT_ENABLED
              value: "true"
            # STATELAYER_ADDR (M49): the shared state-layer Valkey the launcher tenant enforcer writes
            # usage to — the BFF reads it (read-only) for the Tenants live usage-vs-cap surface. Absent ⇒
            # the /api/tenants/{name}/usage endpoint 501s.
            - name: STATELAYER_ADDR
              value: agent-engine-statelayer.agent-engine-system.svc:6379
            # PLATFORM_GENERATION_MODELS is the ADR 0014 create-from-prompt
            # generation-model pin (comma-separated). "" (the default) leaves
            # generation using the caller's connected-provider model unpinned; an
            # operator sets a list to govern which model generation uses (the UI
            # dropdown source). This literal keeps `kustomize build`/`make deploy`
            # valid; the Helm chart templates THIS value from
            # `bff.generation.platformModels` (values.yaml), default renders "" (no drift).
            - name: PLATFORM_GENERATION_MODELS
              value: ""
            # MCP_ENABLED is the ADR 0016 BYO-MCP kill-switch: "true" (the default)
            # exposes the POST/GET /api/mcpservers + GET /api/tools endpoints;
            # "false" on a hardened install makes them 404 (BYO MCP forbidden). This
            # literal keeps `kustomize build`/`make deploy` valid; the Helm chart
            # templates it from `bff.mcp.enabled`, default renders "true" (no drift).
            - name: MCP_ENABLED
              value: "true"
            # MCP_REQUIRE_APPROVAL is the ADR 0016 trust policy: "false" (the
            # default) is self-serve — a registered MCP server's tools are
            # immediately bindable; "true" (hardened) marks newly registered tools
            # pending-approval (the approval queue is M17). This literal keeps
            # `kustomize build`/`make deploy` valid; the Helm chart templates it from
            # `bff.mcp.requireApproval`, default renders "false" (no drift).
            - name: MCP_REQUIRE_APPROVAL
              value: "false"
            # CONSOLE_URL is the canonical console origin for cross-origin MCP consent
            # (ADR 0040): the pre-registered redirect_uri + the trusted cross-origin
            # relay target. Empty (the default) ⇒ single-origin behaviour (the request's
            # own origin is the callback, no relay). This literal keeps `kustomize build`/
            # `make deploy` valid; the Helm chart templates it from `bff.consoleURL`,
            # default renders "" (no drift).
            - name: CONSOLE_URL
              value: ""
            # MCP_CREDENTIAL_NAMESPACE is the m25.1b locked platform namespace that
            # holds every MCP grant Secret (ADR 0029 §7). Empty (the default) keeps the
            # legacy per-request-namespace grant path (ADR 0011) so `kustomize build`/
            # `make deploy` stay valid with no extra namespace/RBAC. The Helm chart
            # templates it from `bff.mcp.credentialNamespace`; setting it renders the
            # dedicated namespace + credential-component RBAC (templates/mcp-credentials
            # .yaml) and routes grants there. Default renders "" (no drift).
            - name: MCP_CREDENTIAL_NAMESPACE
              value: ""
            # OIDC_ENABLED / OIDC_ISSUER / OIDC_CLIENT_ID are the ADR 0020 console
            # SSO seam (m19.6). OFF by default ("false" + empty) → the BFF advertises
            # NO OIDC at GET /api/authconfig and the SPA uses token login (ADR 0012).
            # These literals keep `kustomize build`/`make deploy` valid; the Helm chart
            # templates them from `auth.oidc.*` (values.yaml) so
            # `--set auth.oidc.enabled=true` (with an issuer + client) lights up SSO —
            # the generator substitutes them, default renders OFF (no drift). The BFF
            # holds NO OIDC secret: the console is a public PKCE client.
            - name: OIDC_ENABLED
              value: "false"
            - name: OIDC_ISSUER
              value: ""
            - name: OIDC_CLIENT_ID
              value: ""
            # OBJECT_STORE_* (M78/ADR 0071 §2): the durable object store the BFF reads recorded
            # fixtures from (GET /api/runs/{id}/fixture — the O10a console stepper) and writes KB
            # documents to (M68). Unset ⇒ docStore nil ⇒ those endpoints 501 (honest feature-off).
            # The addr points at the in-cluster MinIO (config/objectstore, which config/default ships);
            # the creds come from the objectstore-dev Secret via secretKeyRef, OPTIONAL so a
            # no-object-store install still starts cleanly. A production install points these at its own
            # object store (a values override / overlay). The Helm chart carries the SAME env (the
            # generator copies it verbatim → no drift).
            - name: OBJECT_STORE_ADDR
              value: agent-engine-objectstore.agent-engine-system.svc:9000
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: objectstore-dev
                  key: rootUser
                  optional: true
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: objectstore-dev
                  key: rootPassword
                  optional: true
          # Optional adapter creds (Langfuse/Prometheus). Absent → adapters nil →
          # their routes 501; the UI + /api/health still serve. No literals here.
          envFrom:
            - secretRef:
                name: bff-adapters
                optional: true
            # bff-capability carries MCP_CAPABILITY_PRIVATE_KEY (audit OPS-4d): the BFF MINTS
            # the run capability (ADR 0030 §2) — the run-worker reads the same Secret. Absent
            # this, minting is silently DISABLED (server.go) and every OBO tool call falls
            # back to org/public creds. Optional so the manifest builds before it's provisioned.
            - secretRef:
                name: bff-capability
                optional: true
          # /api/health needs no cluster access (pure liveness + version), so it
          # is a safe probe target and works before any caller authenticates.
          livenessProbe:
            httpGet:
              path: /api/health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 9090
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              # 192Mi request: the BFF's steady base footprint (~100Mi: Go runtime + the
              # static SPA + controller-runtime caller caches + adapters) plus headroom for a
              # single in-flight ingestion's document buffer, so the scheduler reserves enough
              # that a normal ingestion never runs against a too-tight request. It stays well
              # under the limit so bursts are absorbed, not the baseline reservation.
              memory: 192Mi
            limits:
              cpu: 500m
              # 512Mi limit — right-sized for the ingestion executor (ADR 0061), NOT picked
              # blindly. The m68.14 OOM (even 512Mi OOMed on 3 tiny docs) was the M3 artifact
              # (c0bf933: the MinIO lazy reader's context was cancelled on Get return, so every
              # ingestion spun/failed on doc 1); that is FIXED. Post-fix + m80.2, the peak is
              # BOUNDED and independent of corpus/doc-chunk count:
              #   base BFF                                        ~100Mi
              # + one document transient (data ≤25Mi upload cap + extracted text ~25Mi +
              #   the []rune + []TextChunk of one doc)            ~150-180Mi (freed per doc)
              # + one embed sub-batch (128 chunks × 1536-dim ×
              #   4B ≈ 0.8Mi vectors + records)                   ~1-2Mi  (was O(all doc chunks)
              #                                                    pre-m80.2 — up to ~120Mi for a
              #                                                    25Mi doc; m80.2 streams
              #                                                    embed→upsert per sub-batch)
              # + GC/heap-fragmentation headroom (~1.5×)          → ~430Mi
              # rounded up to the 512Mi power-of-two ceiling. Because the executor no longer
              # buffers a whole document's (or the corpus's) vectors, this ceiling does not have
              # to grow with corpus size — it is bounded by the 25Mi per-document upload cap.
              # (Live in-cluster re-verify under the shipped limit is BFF-OIDC-auth-gated =
              # user-only; the code-level proof is the m80.2 bounded-buffering heap test +
              # this bounded-peak analysis.)
              memory: 512Mi
          volumeMounts: []
      volumes: []
      serviceAccountName: bff
      terminationGracePeriodSeconds: 10
