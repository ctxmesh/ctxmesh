# Dedicated ServiceAccount for the Go BFF (the UI's server-side layer).
#
# LEAST-PRIVILEGE BY DESIGN (ADR 0011): this SA holds NO agent-CRD access. The
# BFF is an auth-transparent proxy — every user-facing CRD read/write runs on a
# per-request client-go client built from the CALLER'S OWN bearer token, so the
# Kubernetes API server enforces the caller's RBAC (the M11 developer/operator/
# viewer personas), not the BFF's. This SA's mounted token is used ONLY to
# authenticate the in-cluster rest.Config BASE (API-server host + cluster CA);
# authenticating requires no RBAC verbs. The token is never used to act on the
# user's agent CRDs — that closes the confused-deputy gap by construction.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: bff
  namespace: system
