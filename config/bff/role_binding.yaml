# Binds the BFF SA to its (empty) infra-reads-only Role. Namespaced RoleBinding,
# not a ClusterRoleBinding: the BFF's SA-side needs never span the cluster, and a
# Role keeps the least-privilege blast radius to the install namespace. See
# role.yaml / service_account.yaml for the ADR-0011 rationale (caller-scoped
# authz; the BFF SA holds no agent-CRD access).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: bff-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-role
subjects:
- kind: ServiceAccount
  name: bff
  namespace: system
---
# Binds the BFF SA to the cross-namespace online-scorer ClusterRole (M69, ADR
# 0062 Fork 2). ClusterRoleBinding because the online-scoring worker reads
# AgentDeployment + EvalSuite across ALL agent namespaces to resolve each
# agent's EvalSuite.online policy. Read-only (get/list) — the same trust class
# as the worker's cpDB + Langfuse creds, NOT the ADR-0011 caller-scoped path.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    control-plane: bff
    app.kubernetes.io/name: agent-engine
    app.kubernetes.io/managed-by: kustomize
  name: bff-online-scorer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bff-online-scorer
subjects:
- kind: ServiceAccount
  name: bff
  namespace: system
