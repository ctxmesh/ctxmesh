# gitleaks configuration for ctxmesh (M147.4).
#
# The pre-public gate scanned ALL history in both repos — 935 commits here, 1,527 in agent-brain,
# ~27 MB — and found five hits, every one a false positive (verified individually, 2026-08-31):
# a comment stating credentials are never literals, a deliberately-invalid `not-a-real-token` used to
# prove a 401 path, a curl health-check example, and two prose matches on "capability" / "KNOWLEDGE_".
#
# The allowlists below exist so that result is REPEATABLE. A scanner that reports the same five false
# positives on every CI run gets ignored, and an ignored gate is worse than no gate — the same failure
# mode as the harness `lint-scripts` target that rotted red because nothing enforced it.
#
# Each allowlist is scoped to a PATH and a REASON. None is global: a blanket rule would defeat the
# scanner, which is the one thing standing between us and publishing a credential.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|<]|$)'''
entropy = 3.5
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = "Documentation and manifest COMMENTS that name credential mechanisms without carrying one"
  regexTarget = "match"
  paths = ['''config/.*\.yaml$''']
  regexes = ['''(?i)(langfuse|prometheus)[/ ]?(creds|credentials)''']

[[rules]]
id = "curl-auth-header"
description = "curl Authorization header"
regex = '''(?i)\bcurl\b(?:.*|.*(?:[\r\n]{1,2}.*){1,5})[\s\x60'"]-H\s{0,5}["']?(?:Authorization:\s{0,5}(?:Bearer|Token)\s{0,5}[a-z0-9=_\-\.]{10,150})'''
keywords = ["curl"]

  [rules.allowlist]
  description = "Deliberately-invalid tokens in harness scripts that PROVE a 401/403 path"
  regexTarget = "match"
  regexes = ['''(?i)Bearer\s+(not-a-real|invalid|fake|dummy|expired|bogus)[a-z0-9\-_]*''']

[allowlist]
description = "Global paths that cannot carry a live credential"
paths = [
  # Fixtures and example servers exist to be non-secret; their READMEs show curl invocations.
  '''.*/testdata/.*''',
  '''.*_test\.go$''',
  # The vendored/generated UI dependency tree is not ours to police here.
  '''^ui/node_modules/.*''',
  '''^sdk/typescript/node_modules/.*''',
  # ── M151 ────────────────────────────────────────────────────────────────
  # Two UI files the generic-api-key rule flags, neither of which can carry a
  # credential. Path-scoped and reasoned, per the M147 rule that an allowlist
  # entry without a stated reason is how a real leak eventually gets waved
  # through.
  #
  # 1. The UI's Vitest suites are not covered by the global `_test.go` path, and
  #    one of them is a SECURITY test: secret-bindings-page.test.tsx builds a
  #    hostile DTO carrying "sk-live-MUST-NEVER-RENDER-0000" on every field a
  #    payload could smuggle a value through, and asserts the page renders none
  #    of them. The string is a self-describing sentinel — flagging it means the
  #    scanner is catching the test that exists to prevent the thing it is
  #    scanning for.
  '''^ui/src/.*\.test\.tsx?$''',
  # 2. ui/visual/fixtures.ts answers the API for the offline screenshot sweep.
  #    Its `secretBindingRef` fields are SecretBinding NAMES — a reference to
  #    where a credential lives, which is the whole point of the CRD — and it
  #    reaches no network and ships in no image.
  '''^ui/visual/fixtures\.ts$''',
]
