# PR/branch pipeline per ADR 0003 (agent-brain/decisions/0003):
# lint -> unit -> envtest -> build -> { e2e, security }
#
# Polyglot split (m12.9): ctxmesh is Go + Python SDK (M10) + a Vite/React
# UI (M12). `make lint` = golangci-lint + py-lint + ui-lint and `make test`
# = go test + py-test + ui-test — i.e. the umbrella targets fan into three
# toolchains. Rather than let one Go-only runner silently bootstrap Python
# (venv) and Node (nvm) — slow and fragile — each language gets its OWN job
# that PROVISIONS its toolchain deterministically:
#   lint / unit  — Go   (setup-go): golangci-lint + go test (Go halves only)
#   py           — Py   (setup-python 3.9): make py-lint py-test
#   ui           — Node (setup-node via ui/.nvmrc + corepack pnpm): eslint/tsc/vitest/build
#   helm         — helm (no cluster): make helm-verify (no-drift) + helm-lint
# e2e is owned by the agent-brain harness (ADR 0004): it checks out the
# (private) brain with the fine-grained BRAIN_CHECKOUT_TOKEN secret and drives
# `make -C harness tier2 SLICE=m2-gateway` on a kind cluster with Knative Serving.
# m2-gateway supersets the m1 deploy path; m1-specific coverage stays in envtest.
# The M12 UI/Helm e2e slices (m12-ui, m12-helm) run in nightly.yml (need a full
# kind cluster); this PR pipeline gets the cheap UI + Helm gates above.
name: CI

on:
  push:
    branches: [main, "m*"]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Verify linter configuration
        run: make lint-config
      # Go half of `make lint` only (golangci-lint incl. gofumpt). py-lint /
      # ui-lint run in the py / ui jobs so no toolchain is bootstrapped here.
      - name: Install golangci-lint (pinned via Makefile)
        run: make golangci-lint
      - name: golangci-lint (incl. gofumpt)
        run: ./bin/golangci-lint run

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # gitleaks scans HISTORY, not just the tip — a secret removed in the last commit is still
          # public forever once pushed. fetch-depth 0 is load-bearing, not a convenience.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install gitleaks (pinned)
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      # The M147 pre-public gate, made permanent. It is deliberately NOT a downstream job of `lint`:
      # a credential reaching a public repo is not a style problem, and it must be reported even when
      # the rest of the pipeline is red.
      - name: Scan full history for secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" git --no-banner -c .gitleaks.toml --redact .

  unit:
    name: unit
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      # Go half of `make test` only (the py-test / ui-test halves are the py /
      # ui jobs). Reproduces the umbrella recipe: manifests+generate+fmt+vet,
      # then `go test ./... -coverprofile cover.out`.
      - name: Go unit tests (manifests/generate/fmt/vet + go test)
        run: |
          make manifests generate fmt vet
          go test ./... -coverprofile cover.out

  py:
    name: py
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # The SDK targets Python 3.9 (sdk/python/pyproject.toml requires-python
      # >=3.9; the pinned ruff 0.6.9 / pytest 8.3.3 support 3.9). Pin the CI
      # interpreter to 3.9 so the venv `make py-venv` builds matches the target.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      # py-lint (ruff) + py-test (pytest) each depend on py-venv, which builds
      # the pinned venv from the provisioned python3 — deterministic in CI.
      - name: Python SDK lint + tests (ruff + pytest, pinned venv)
        run: make py-lint py-test

  ui:
    name: ui
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Real Node toolchain PINNED to ui/.nvmrc (Node 22) — no in-job nvm
      # bootstrap. corepack activates the pnpm version pinned by ui/package.json
      # "packageManager" (pnpm@9.15.0), so both Node and pnpm are deterministic.
      # We run the pnpm scripts DIRECTLY in ui/ (not `make ui-lint`, which routes
      # through hack/ui-node.sh's nvm bootstrap) so this job owns the toolchain.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/.nvmrc
      - name: Activate pnpm (corepack, pinned by package.json)
        # working-directory is load-bearing: `packageManager` is declared in ui/package.json and there
        # is no root package.json, so `corepack prepare --activate` from the repo root has nothing to
        # read and fails. Masked since ~M79 because the pipeline never got past `lint` (m52.G3).
        working-directory: ui
        run: corepack enable && corepack prepare --activate
      - name: Install UI deps (frozen lockfile)
        working-directory: ui
        run: pnpm install --frozen-lockfile
      - name: Lint (eslint)
        working-directory: ui
        run: pnpm run lint
      - name: Typecheck (tsc)
        working-directory: ui
        run: pnpm run typecheck
      - name: Unit/component tests (vitest)
        working-directory: ui
        run: pnpm run test
      - name: Build the SPA (tsc -b + vite build)
        working-directory: ui
        run: pnpm run build

  helm:
    name: helm
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # helm-verify runs `kustomize build` + `helm template` and diffs them, so
      # it needs Go (kustomize is a Makefile tool) + python3 (helm_nodrift_diff.py).
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      # Pin helm explicitly (no floating latest) so the no-drift gate is stable.
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.16.3
      # No-drift gate: the committed chart == generated from config/, AND
      # `helm template` (default values) == `kustomize build config/default`.
      # Catches chart drift on every PR — cheap, no cluster.
      # hack/check-crd-version-parity.sh imports PyYAML; setup-python provides the interpreter but not
      # the package, so the parity gate failed on `import yaml`. Masked since ~M79 (m52.G3) because the
      # pipeline never reached this job.
      - name: Install PyYAML (the CRD parity gate needs it)
        run: python3 -m pip install --quiet pyyaml
      - name: Helm no-drift gate (chart == kustomize build)
        run: make helm-verify
      - name: helm lint
        run: make helm-lint
      # CRD version-parity: conversion is None, so multi-version CRDs must keep matching
      # top-level CEL validations across versions (audit FUNC-8).
      - name: CRD version-parity gate
        run: make crd-version-parity
      # M148 ✅ line: the install proof runs in CI so it cannot rot the way G7/G11 did.
      #
      # Every assertion is about the RENDER, so it needs no cluster and costs seconds —
      # which is what makes it affordable on every PR. It catches the exact class of
      # defect M148 fixed: a resource the chart consumes and never creates, an env var
      # code reads that has no chart home, RAG wired on only one of its two halves, and
      # a production render that installs something which cannot start.
      #
      # The CLUSTER-level bring-up is deliberately not here: it needs Knative + KEDA +
      # a kind cluster (~10 min a run) and this project has already had its Actions
      # minutes exhausted once (m52.G3). Carded for M150.
      - name: Install-truth gate (the chart provisions what it consumes)
        run: ./hack/install-truth.sh
      # M149 m149.3 — least privilege, asserted on what we SHIP.
      #
      # M146's acceptance found ctxmesh-operator holding verbs:["*"] on agentdeployments,
      # silently implying the `kill` permission that milestone was building — and recorded
      # why no behavioural test could have caught it: a handler test injects a fake
      # authorizer, so it proves the handler ASKS, never that RBAC answers as intended.
      # This gate reads the manifests, so it needs no cluster and costs milliseconds.
      - name: RBAC least-privilege gate (no verb wildcards, no cluster-scoped Secret writes)
        run: ./hack/rbac-least-privilege.sh config/rbac
      # M153 m153.3 — the console may not offer a provider the API rejects.
      #
      # The connect wizard offered four providers; the BFF accepted two. Picking one of
      # the other two meant typing an API key into a form that could never work. Every
      # per-screen test passed: the page rendered its four choices, the BFF rejected
      # "custom" correctly, and only WALKING from one screen to the next revealed the
      # product promising something it cannot do. Two static lists, checked against each
      # other, in milliseconds.
      - name: Provider parity gate (the console offers exactly what the API supports)
        run: ./hack/provider-parity.sh
      # M154 m154.2 — a release must publish everything an install needs, at a version.
      #
      # Every other test installs from the working tree, so none of them could see that
      # the chart's first-party images were bare names (docker.io/library/controller),
      # that appVersion was "latest", or that release.yml pushed one of five images and
      # no chart. This reads the release artifacts themselves.
      - name: Release-truth gate (the release publishes what an install needs)
        run: ./hack/release-truth.sh
      # The SDKs are typed sugar over the launcher plane, so drift between them is uniquely
      # expensive: it tells an author a capability exists, or is shaped a certain way, when
      # the platform disagrees — and the failure lands in the USER's agent at runtime, never
      # in our CI. Nothing bound them together until an audit found `POST /a2a/{target}`
      # served by the launcher and exposed by neither SDK.
      - name: SDK-contract gate (the SDKs track the product)
        run: ./hack/sdk-contract.sh
      # M155 — every console flow must be completable by at least one shipped role.
      #
      # The BFF writes with the CALLER's client (ADR 0011), so a flow is only real if some
      # shipped role grants the permission it needs. Nothing checked that, and four flows —
      # provider connect, key-authed MCP registration, MCP OAuth grants, org credentials —
      # were uncompletable by every persona. They were found one at a time over two months
      # and carded as separate bugs, because nothing connected them.
      - name: Flow-completability gate (no flow no role can complete)
        run: ./hack/flow-completability.sh

  envtest:
    name: envtest
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Envtest integration tests
        run: make test-integration

  build:
    name: build
    needs: envtest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Build manager binary
        run: make build
      - name: Build manager image
        run: make docker-build

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out agent-brain (harness owns e2e — ADR 0004)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ctxmesh/agent-brain
          token: ${{ secrets.BRAIN_CHECKOUT_TOKEN }}
          path: agent-brain
          persist-credentials: false
          # Brain ref mirrors the engine branch (m<n> <-> m<n>, main <-> main),
          # per the per-milestone branching convention in agent-brain/CLAUDE.md.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
      - name: Bring up the harness cluster (Knative Serving + Kourier)
        run: make -C agent-brain/harness dev-up M=1
      - name: Run the M2 e2e slice
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        run: make -C agent-brain/harness tier2 SLICE=m2-gateway

  security:
    name: security
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Build image for scanning
        run: make docker-build
      - name: Trivy image scan (HIGH/CRITICAL, unfixed ignored)
        # Pinned trivy version — bump deliberately; the vuln DB updates at runtime.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.2 image --exit-code 1 \
            --severity HIGH,CRITICAL --ignore-unfixed controller:latest

  conventional-commits:
    name: conventional-commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: PR commits follow Conventional Commits
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=0
          while IFS= read -r subj; do
            case "$subj" in
              Merge*) continue ;;
            esac
            if ! printf '%s' "$subj" | grep -qE '^(feat|fix|chore|docs|test|refactor|perf|build|ci|style|revert)(\([a-z0-9./-]+\))?!?: .+'; then
              echo "not conventional: $subj"
              bad=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit "$bad"

  dco:
    name: dco
    # Contributions are certified by DCO, not a CLA (ADR 0134). There is nothing to
    # sign: `git commit -s` appends the Signed-off-by trailer, and this job checks that
    # every commit on the PR carries one. Enforced in CI rather than trusted, for the
    # same reason the conventional-commits job exists — a convention nobody checks is a
    # convention that decays, and provenance is the one that is expensive to unwind.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          bad=0
          while IFS= read -r sha; do
            subj="$(git log -1 --format=%s "$sha")"
            case "$subj" in
              Merge*) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>'; then
              echo "missing Signed-off-by: $sha $subj"
              echo "  fix with: git rebase --signoff origin/${BASE_REF}"
              bad=1
            fi
          done < <(git log --format=%H "origin/${BASE_REF}..HEAD")
          exit "$bad"
