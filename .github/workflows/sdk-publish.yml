# SDK release: build, verify, and (on a tag) publish the ctxmesh Python SDK to PyPI.
#
# DX-1 (Fable audit): make `pip install ctxmesh` real. The `build-verify` job is a normal CI
# gate — it builds the wheel+sdist, `twine check`s the metadata, then smoke-installs the wheel
# into a CLEAN venv and imports `ctxmesh` + `ctxmesh.testing` + runs an agent OFFLINE (no source
# on the path). That is the exact check validated locally at authoring time.
#
# The `publish` job is WRITTEN + locally-validated but its real run is DEFERRED per ADR 0048
# (release engineering is a user-reserved milestone) and ADR 0006 (constrained-CI: author
# workflows, validate logic locally, defer the real GitHub run). Enabling it is a user pass:
#   1. Reserve the `ctxmesh` project name on PyPI.
#   2. Configure PyPI Trusted Publishing (OIDC) for this repo + the `pypi` GitHub Environment —
#      so NO long-lived API token is ever stored (the modern standard; nothing secret in git).
#   3. SHA-pin `pypa/gh-action-pypi-publish` (repo convention) at enablement time.
# Until then, pushing the product's `v*` tag runs a no-op-safe job (the environment gate holds it).
name: SDK Publish

on:
  # PRs touching the SDK get the build+verify gate (a broken wheel never merges).
  pull_request:
    branches: [main]
    paths: ["sdk/python/**", ".github/workflows/sdk-publish.yml"]
  # A release is cut by pushing the PRODUCT's `v*` tag — the same tag that publishes the
  # images and the chart. The SDKs used to have their own `sdk-v*` namespace, which made
  # "which SDK works with which cluster?" a question a user had to answer for themselves.
  # They ship at the product's version now (ADR 0135).
  push:
    tags: ["v*"]
  # Re-publish a version without cutting a tag. Needed the day npm rejected the publish for
  # a reason unrelated to the artifact: everything else had already shipped, and a new tag
  # purely to retry one job would have burned a version number on every registry.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. v0.1.0-beta.2"
        required: true
        type: string

permissions: {}

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    name: build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      # Stamp BOTH SDKs at the tag before building. Committed versions drift the moment
      # someone forgets to bump them, and a wheel that misreports its own version is
      # unfixable after upload — PyPI will not let you replace a file.
      - name: Stamp the SDKs at ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          python3 - "$v" <<'PY'
          import json, pathlib, re, sys
          v = sys.argv[1]
          pp = pathlib.Path("sdk/python/pyproject.toml")
          pp.write_text(re.sub(r'^version = ".*"$', f'version = "{v}"', pp.read_text(), count=1, flags=re.M))
          ip = pathlib.Path("sdk/python/src/ctxmesh/__init__.py")
          ip.write_text(re.sub(r'^__version__ = ".*"$', f'__version__ = "{v}"', ip.read_text(), count=1, flags=re.M))
          tp = pathlib.Path("sdk/typescript/package.json")
          pkg = json.loads(tp.read_text()); pkg["version"] = v
          tp.write_text(json.dumps(pkg, indent=2) + "\n")
          print(f"stamped both SDKs at {v}")
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist sdk/python
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-install the wheel in a clean venv + run an agent offline
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          # Run from a dir with NO source on the path — proves the INSTALLED wheel is complete
          # (serve + testing packaged, py.typed shipped), not the working tree.
          cd /tmp && /tmp/clean/bin/python - <<'PY'
          import ctxmesh
          from ctxmesh import agent, serve  # noqa: F401 - import is the assertion
          from ctxmesh.config import PlaneConfig, RunContext
          from ctxmesh.serve import process_invoke
          from ctxmesh.testing import MemoryStub, DiscoveryStub, GatewayStub
          with MemoryStub() as mem, DiscoveryStub() as disc, GatewayStub(content="ci offline") as gw:
              cfg = PlaneConfig.for_test(
                  memory_base_url=mem.base_url, discovery_base_url=disc.base_url,
                  model_gateway_url=gw.base_url,
                  run=RunContext(agent_name="a", conversation_id=""))
              client = agent.from_config(cfg)
              body = process_invoke(
                  client,
                  lambda r: r.client.model.chat("gpt-4o-mini", [{"role": "user", "content": r.input}]).text,
                  "a", b'{"input":"hi"}', {})
              assert body["output"] == "ci offline", body
          print("OK: pip-installed ctxmesh ran an agent offline")
          PY
      - name: Upload dist artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctxmesh-dist
          path: dist/

  publish:
    name: publish-pypi
    needs: build-verify
    # workflow_dispatch too: gating on tags only meant a dispatch SKIPPED PyPI, which is the
    # exact job the dispatch path was added to be able to retry.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DEFERRED (ADR 0048): the `pypi` Environment gate + PyPI Trusted Publishing must be
    # configured by the user before this runs for real. Until then the environment holds it.
    environment:
      name: pypi
      url: https://pypi.org/project/ctxmesh/
    permissions:
      id-token: write # OIDC — Trusted Publishing mints a short-lived token; no stored secret.
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ctxmesh-dist
          path: dist/
      # SHA-pin this at enablement (repo convention); release/v1 is the maintainer-pinned major.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          # As every other registry job here does. A release publishing five SDKs to five
          # registries will sometimes be re-run because ONE failed, and PyPI was the only one
          # that would then die on a duplicate rather than pass through.
          skip-existing: true

  # ── npm ─────────────────────────────────────────────────────────────────────
  # ADR 0070 deferred this, mirroring a Python not-on-PyPI posture that ADR 0135 has
  # since removed; the amendment records the reversal.
  #
  # Trusted publishing on npm is configured in the PACKAGE's settings, so unlike PyPI
  # there is no pending-publisher: the package must exist before OIDC can be wired. The
  # first version is therefore published by hand, and this job is idempotent so that
  # manual publish and this one cannot collide — it skips a version already on the
  # registry rather than failing the release on a duplicate.
  # ── crates.io ──────────────────────────────────────────────────────────────
  # Trusted publishing: crates.io exchanges the workflow's OIDC identity for a short-lived
  # token, so nothing long-lived is stored. It has NO pending-publisher support (RFC 3691
  # lists it under future possibilities), so the crate was published once by hand to create
  # it, and this took over from there.
  publish-crates:
    name: publish-crates
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: crates
      url: https://crates.io/crates/ctxmesh
    permissions:
      id-token: write # OIDC — the whole point; no token in a secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Stamp the version from the tag
        working-directory: sdk/rust
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          python3 - "$v" <<'PY'
          import re, sys, pathlib
          v = sys.argv[1]
          p = pathlib.Path("Cargo.toml")
          p.write_text(re.sub(r'^version = ".*"$', f'version = "{v}"', p.read_text(), count=1, flags=re.M))
          q = pathlib.Path("src/lib.rs")
          q.write_text(re.sub(r'^pub const VERSION: &str = ".*";$', f'pub const VERSION: &str = "{v}";', q.read_text(), count=1, flags=re.M))
          print(f"stamped the Rust SDK at {v}")
          PY
      - uses: rust-lang/crates-io-auth-action@e919bc7605cde86df457cf5b93c5e103838bd879 # v1
        id: auth
      - name: Publish (skip if this version is already on the registry)
        working-directory: sdk/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          # Idempotent, like the npm job: a manual publish and this one must not collide, and a
          # re-run of a release must not fail on a duplicate.
          if curl -sf -A ctxmesh-ci "https://index.crates.io/ct/xm/ctxmesh" | grep -q "\"vers\":\"$v\""; then
            echo "ctxmesh $v is already on crates.io — nothing to do."
            exit 0
          fi
          cargo publish --allow-dirty

  # ── RubyGems ───────────────────────────────────────────────────────────────
  # Skips cleanly when the trusted publisher is not configured yet, rather than failing the
  # whole release: four SDKs publish to four registries and a missing credential on one must
  # not take the others down.
  publish-rubygems:
    name: publish-rubygems
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: rubygems
      url: https://rubygems.org/gems/ctxmesh
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a2bbe5b1b236842c1cb7dd11e8e3b51e0a616acc # v1.202.0
        with:
          ruby-version: "3.3"
      - name: Stamp the version from the tag
        working-directory: sdk/ruby
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          sed -i -E "s/VERSION = \".*\"/VERSION = \"$v\"/" lib/ctxmesh/version.rb
          grep VERSION lib/ctxmesh/version.rb
      # configure-rubygems-credentials, not release-gem: the latter runs `rake release`, which
      # needs a Rakefile with Bundler's gem tasks AND does its own git tagging — this repo is
      # released by pushing a product tag, so a second tagger would fight it.
      - uses: rubygems/configure-rubygems-credentials@daab0479595bcc124493903b3df17273d86e073f # main
      - name: Build and push (skip if this version is already on the registry)
        working-directory: sdk/ruby
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          # RubyGems normalises 0.1.0-beta.3 to 0.1.0.pre.beta.3, so ask the registry rather
          # than assuming the string round-trips.
          if gem list -r --all --prerelease ctxmesh 2>/dev/null | grep -qF "$(ruby -e 'puts Gem::Version.new(ARGV[0]).to_s' "$v")"; then
            echo "ctxmesh $v is already on RubyGems — nothing to do."
            exit 0
          fi
          gem build ctxmesh.gemspec
          gem push ctxmesh-*.gem

  # ── Maven Central ──────────────────────────────────────────────────────────
  # The only registry here with no OIDC option: Central needs a portal token AND a GPG key, so
  # four secrets. The job SKIPS when they are absent rather than failing, because six SDKs across
  # five registries means one missing credential must not take a release down.
  publish-maven:
    name: publish-maven
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: maven
      url: https://central.sonatype.com/artifact/ai.ctxmesh/ctxmesh
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Are the credentials configured?
        id: creds
        env:
          U: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          K: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$U" ] && [ -n "$K" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Maven Central credentials are not configured; the Java SDK was NOT published. Set MAVEN_CENTRAL_USERNAME/PASSWORD and MAVEN_GPG_PRIVATE_KEY/PASSPHRASE."
          fi

      # setup-java imports the key and writes settings.xml with the server id the pom names.
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: steps.creds.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Stamp the version from the tag
        if: steps.creds.outputs.ready == 'true'
        working-directory: sdk/java
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          mvn -B -q versions:set -DnewVersion="$v" -DgenerateBackupPoms=false
          sed -i -E "s/VERSION = \".*\";/VERSION = \"$v\";/" src/main/java/ai/ctxmesh/Client.java
          grep -m1 'VERSION =' src/main/java/ai/ctxmesh/Client.java

      - name: Publish (skip if this version is already on Central)
        if: steps.creds.outputs.ready == 'true'
        working-directory: sdk/java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"; v="${v#v}"
          # Central is immutable: a re-run of a release must not fail on a duplicate.
          if curl -sf "https://repo1.maven.org/maven2/ai/ctxmesh/ctxmesh/$v/" >/dev/null 2>&1; then
            echo "ai.ctxmesh:ctxmesh:$v is already on Central — nothing to do."
            exit 0
          fi
          mvn -B -P release deploy -DskipTests

  publish-npm:
    name: publish-npm
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/ctxmesh
    permissions:
      id-token: write # OIDC — trusted publishing mints a short-lived token; no stored secret.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # NO registry-url. It exists for TOKEN auth: setup-node writes an .npmrc carrying
      # `_authToken=${NODE_AUTH_TOKEN}` and `always-auth=true`, and with no token in the
      # environment npm reads that as "auth is already configured", so the OIDC exchange
      # does not happen cleanly (actions/setup-node#1551). The tell in the log is
      # `npm warn Unknown user config "always-auth"`. Trusted publishing needs no registry
      # line — registry.npmjs.org is the default.
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: sdk/typescript/.nvmrc
      # Node 22 ships npm 10.x. Trusted publishing needs npm >= 11.5.1 — without it the
      # CLI never attempts OIDC, falls back to looking for a token, finds none, and the
      # publish fails in a way that reads as an auth problem rather than a version one.
      - name: npm >= 11.5.1 (trusted publishing)
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version
      - name: Stamp the version from the tag
        working-directory: sdk/typescript
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - "${VERSION_OVERRIDE:-$GITHUB_REF_NAME}" <<'PY'
          import json, pathlib, sys
          v = sys.argv[1].lstrip("v")
          p = pathlib.Path("package.json")
          pkg = json.loads(p.read_text()); pkg["version"] = v
          p.write_text(json.dumps(pkg, indent=2) + "\n")
          print(f"stamped the TS SDK at {v}")
          PY
      - name: Build
        working-directory: sdk/typescript
        run: |
          set -euo pipefail
          npm install --no-package-lock
          npm run build
      - name: Publish (skip if this version is already on the registry)
        working-directory: sdk/typescript
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # An .npmrc auth line suppresses the OIDC exchange, and the resulting failure
          # reads as a permissions problem rather than a config one. Fail on it here.
          for f in "$HOME/.npmrc" .npmrc; do
            if [ -f "$f" ] && grep -q "_authToken" "$f"; then
              echo "::error::$f carries an _authToken line, which blocks OIDC trusted publishing"
              exit 1
            fi
          done
          v="${VERSION_OVERRIDE:-$GITHUB_REF_NAME}"
          v="${v#v}"   # the dispatch input carries the leading v, like the tag does
          if npm view "ctxmesh@${v}" version >/dev/null 2>&1; then
            echo "ctxmesh@${v} is already published — nothing to do."
            exit 0
          fi
          # A pre-release must not become `latest`, or `npm install ctxmesh` hands
          # everyone a beta.
          tag=latest
          case "${VERSION_OVERRIDE:-$GITHUB_REF_NAME}" in *-alpha*|*-beta*|*-rc*) tag=beta ;; esac
          npm publish --provenance --access public --tag "$tag"
