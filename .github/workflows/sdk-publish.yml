# SDK release: build, verify, and (on a tag) publish the ctxmesh Python SDK to PyPI.
#
# DX-1 (Fable audit): make `pip install ctxmesh` real. The `build-verify` job is a normal CI
# gate — it builds the wheel+sdist, `twine check`s the metadata, then smoke-installs the wheel
# into a CLEAN venv and imports `ctxmesh` + `ctxmesh.testing` + runs an agent OFFLINE (no source
# on the path). That is the exact check validated locally at authoring time.
#
# The `publish` job is WRITTEN + locally-validated but its real run is DEFERRED per ADR 0048
# (release engineering is a user-reserved milestone) and ADR 0006 (constrained-CI: author
# workflows, validate logic locally, defer the real GitHub run). Enabling it is a user pass:
#   1. Reserve the `ctxmesh` project name on PyPI.
#   2. Configure PyPI Trusted Publishing (OIDC) for this repo + the `pypi` GitHub Environment —
#      so NO long-lived API token is ever stored (the modern standard; nothing secret in git).
#   3. SHA-pin `pypa/gh-action-pypi-publish` (repo convention) at enablement time.
# Until then, pushing the product's `v*` tag runs a no-op-safe job (the environment gate holds it).
name: SDK Publish

on:
  # PRs touching the SDK get the build+verify gate (a broken wheel never merges).
  pull_request:
    branches: [main]
    paths: ["sdk/python/**", ".github/workflows/sdk-publish.yml"]
  # A release is cut by pushing the PRODUCT's `v*` tag — the same tag that publishes the
  # images and the chart. The SDKs used to have their own `sdk-v*` namespace, which made
  # "which SDK works with which cluster?" a question a user had to answer for themselves.
  # They ship at the product's version now (ADR 0135).
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: sdk-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    name: build-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      # Stamp BOTH SDKs at the tag before building. Committed versions drift the moment
      # someone forgets to bump them, and a wheel that misreports its own version is
      # unfixable after upload — PyPI will not let you replace a file.
      - name: Stamp the SDKs at ${{ github.ref_name }}
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          python3 - "$v" <<'PY'
          import json, pathlib, re, sys
          v = sys.argv[1]
          pp = pathlib.Path("sdk/python/pyproject.toml")
          pp.write_text(re.sub(r'^version = ".*"$', f'version = "{v}"', pp.read_text(), count=1, flags=re.M))
          ip = pathlib.Path("sdk/python/src/ctxmesh/__init__.py")
          ip.write_text(re.sub(r'^__version__ = ".*"$', f'__version__ = "{v}"', ip.read_text(), count=1, flags=re.M))
          tp = pathlib.Path("sdk/typescript/package.json")
          pkg = json.loads(tp.read_text()); pkg["version"] = v
          tp.write_text(json.dumps(pkg, indent=2) + "\n")
          print(f"stamped both SDKs at {v}")
          PY

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --wheel --outdir dist sdk/python
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Smoke-install the wheel in a clean venv + run an agent offline
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          # Run from a dir with NO source on the path — proves the INSTALLED wheel is complete
          # (serve + testing packaged, py.typed shipped), not the working tree.
          cd /tmp && /tmp/clean/bin/python - <<'PY'
          import ctxmesh
          from ctxmesh import agent, serve  # noqa: F401 - import is the assertion
          from ctxmesh.config import PlaneConfig, RunContext
          from ctxmesh.serve import process_invoke
          from ctxmesh.testing import MemoryStub, DiscoveryStub, GatewayStub
          with MemoryStub() as mem, DiscoveryStub() as disc, GatewayStub(content="ci offline") as gw:
              cfg = PlaneConfig.for_test(
                  memory_base_url=mem.base_url, discovery_base_url=disc.base_url,
                  model_gateway_url=gw.base_url,
                  run=RunContext(agent_name="a", conversation_id=""))
              client = agent.from_config(cfg)
              body = process_invoke(
                  client,
                  lambda r: r.client.model.chat("gpt-4o-mini", [{"role": "user", "content": r.input}]).text,
                  "a", b'{"input":"hi"}', {})
              assert body["output"] == "ci offline", body
          print("OK: pip-installed ctxmesh ran an agent offline")
          PY
      - name: Upload dist artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ctxmesh-dist
          path: dist/

  publish:
    name: publish-pypi
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DEFERRED (ADR 0048): the `pypi` Environment gate + PyPI Trusted Publishing must be
    # configured by the user before this runs for real. Until then the environment holds it.
    environment:
      name: pypi
      url: https://pypi.org/project/ctxmesh/
    permissions:
      id-token: write # OIDC — Trusted Publishing mints a short-lived token; no stored secret.
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ctxmesh-dist
          path: dist/
      # SHA-pin this at enablement (repo convention); release/v1 is the maintainer-pinned major.
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
