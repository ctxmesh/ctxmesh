# Tag job per ADR 0003: versioned image pushed to GHCR on v* tags.
# Helm chart lint/package is added when the chart exists (tracked on the
# milestone board in agent-brain).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  image:
    name: release-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build versioned image
        run: make docker-build IMG="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
      - name: Push image
        run: docker push "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
