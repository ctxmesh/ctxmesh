# Release — publish every artifact an install needs, at one version.
#
# WHAT THIS REPLACED, AND WHY
# ---------------------------
# This workflow used to build and push ONE image (the controller) and no chart, while
# the chart references four first-party images and the controller injects a fifth
# (managed-agent) into every managed agent at runtime. A release that ships one of five
# images and no chart is not a release; nobody could install the product from it.
#
# That was invisible to every test the project had, because every test installs from the
# working tree — from `config/`, or from images built locally and loaded into kind. A
# release is the first artifact that has to stand up without the checkout. `hack/
# release-truth.sh` is the static guard (it reads the chart's own image values and this
# file); `harness/scripts/e2e-install-from-artifacts.sh` is the live one.
#
# THE VERSION IS THE TAG. Every image and the chart carry it, so an install is
# reproducible and an upgrade is defined — see ADR 0133.
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # ── The notes, first ───────────────────────────────────────────────────────
  # Built before anything is published, so a tag with no CHANGELOG section, or a README that pins
  # another version, fails without leaving artifacts behind. The install command is the README's,
  # verbatim: the stranger job below runs that same command, so the command the Release page shows
  # is the command that was proven.
  notes:
    name: release-notes-draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build notes.md from the CHANGELOG section and the README install command
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # The section runs from its own heading to the next one at the same level.
          awk -v tag="$tag" '
            $0 ~ "^## " tag "( |$)" { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${tag}' section — the release would have no notes."
            exit 1
          fi
          # The first OCI install command in the README and its continuation lines.
          awk '
            /^helm install ctxmesh oci:\/\// { on = 1 }
            on { print; if ($0 !~ /\\$/) exit }
          ' README.md > install.txt
          if [ ! -s install.txt ]; then
            echo "::error::README.md has no 'helm install ctxmesh oci://' command to announce."
            exit 1
          fi
          if ! grep -qE -- "--version ${tag#v}( |\\|$)" install.txt; then
            echo "::error::README.md installs $(grep -oE -- '--version [^ ]+' install.txt || echo 'no --version'), not ${tag#v}."
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo '```sh'
            cat install.txt
            echo '```'
            echo
            echo "> **The first install pulls nine images and takes several minutes.** \`--wait\` without"
            echo "> \`--timeout\` uses Helm's 5-minute default, which a cold cluster does not meet — the"
            echo "> postgres image alone can take longer than that. The timeout above is a ceiling, not a"
            echo "> wait: a warm cluster finishes in well under it."
            echo
            echo '```sh'
            echo "# afterwards, confirm the release actually landed"
            echo "helm status ctxmesh -n ctxmesh"
            echo '```'
            echo
            echo "Compatibility: https://ctxmesh.github.io/reference/compatibility/"
          } >> notes.md
          echo "--- notes.md ---"; cat notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error

  images:
    name: release-images
    needs: notes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        # Every first-party image an install needs. `image` is the chart's repository
        # basename (release-truth.sh matches on it); `target` is the Makefile rule.
        include:
          - image: controller
            target: docker-build
            local: controller:latest
          - image: bff
            target: docker-build-bff
            local: bff:latest
          - image: token-service
            target: docker-build-token-service
            local: token-service:latest
          - image: statelayer-proxy
            target: docker-build-statelayer-proxy
            local: statelayer-proxy:latest
          # The three images the CONTROLLER injects into agent pods. None was published, while
          # the matrix comment above claims "every first-party image an install needs" — so a
          # default install could not run a single agent to Ready:
          #   agent-otel-collector — injected into EVERY agent pod; the unpublished default is
          #       dev.local/... so it ImagePullBackOffs on any real cluster, tools or not.
          #   agent-discovery — injected whenever an agent has a tool binding; same dead end.
          #   egress-sidecar — the ALWAYS-ON tool-call chokepoint since M82, and its image has NO
          #       fallback at all, so an empty value makes Knative reject the Service with
          #       `missing field(s): spec.template.spec.containers[N].image` — a container INDEX,
          #       with no status condition and no event to explain it.
          # Exactly the reasoning the managed-agent entry below already records.
          - image: agent-otel-collector
            target: docker-build-collector
            local: dev.local/agent-otel-collector:0.116.0
          - image: agent-discovery
            target: docker-build-discovery
            local: dev.local/agent-discovery:0.1.0
          - image: egress-sidecar
            target: docker-build-egress-sidecar
            local: egress-sidecar:latest
          # managed-agent is not in the chart's image values — the CONTROLLER injects it
          # from a compiled-in default. It is still an image every managed agent needs,
          # and an unpublished default is precisely the ContainerMissing dead end M153
          # hit on the dev clusters. Shipping that to users is not an option.
          - image: managed-agent
            target: docker-build-managed
            local: managed-agent:latest
          # base-python / base-node are the images an AGENT AUTHOR builds FROM. The docs
          # have always said `FROM ghcr.io/ctxmesh/base-python`, and no release ever
          # published it — anyone following the SDK guide got an auth failure on a tag
          # that does not exist. Same class as the managed-agent default above: a
          # documented path that cannot be walked.
          - image: base-python
            target: docker-build-base-python
            local: base-python:latest
          - image: base-node
            target: docker-build-base-node
            local: base-node:latest
          # echo-agent is what the quickstart and every CRD reference example tell a user
          # to deploy. It was never published, so the first thing a new user runs ended in
          # ImagePullBackOff.
          - image: echo-agent
            target: docker-build-example
            local: echo-agent:latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build ${{ matrix.image }}
        # The controller rule takes IMG; the rest bake their own local tag and are
        # retagged below. One retag step keeps every image on the same code path.
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "docker-build" ]; then
            make docker-build IMG="${{ matrix.local }}"
          else
            make "${{ matrix.target }}"
          fi
      - name: Tag + push ghcr.io/ctxmesh/${{ matrix.image }}:${{ github.ref_name }}
        run: |
          set -euo pipefail
          ref="ghcr.io/ctxmesh/${{ matrix.image }}:${GITHUB_REF_NAME}"
          docker tag "${{ matrix.local }}" "$ref"
          docker push "$ref"

  chart:
    name: release-chart
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
      # The chart's version and appVersion are stamped from the TAG, not read from
      # Chart.yaml. A committed version drifts from the tag the moment anyone forgets to
      # bump it, and a chart whose appVersion disagrees with the images it installs is
      # the same "pins nothing" defect in a subtler costume.
      - name: Stamp the chart at ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          helm package deploy/helm/ctxmesh \
            --version "$v" --app-version "${GITHUB_REF_NAME}" -d dist/
      - name: Push the chart
        run: |
          set -euo pipefail
          v="${GITHUB_REF_NAME#v}"
          helm push "dist/ctxmesh-${v}.tgz" oci://ghcr.io/ctxmesh/charts

  # ── A tag that does not install is not announced ───────────────────────────
  # The published chart and images, pulled anonymously onto a cold cluster with the README's install
  # command, to a Ready agent, a tool call and a visible run. The artifacts are already public by
  # now (a chart's version is baked into the package, so there is no staging copy to promote); what
  # this job withholds is the Release page. A red here burns the version: the fix ships as the next
  # tag (ADR 0149).
  #
  # The harness comes from agent-brain main, which pairs with the engine's last closed milestone.
  stranger:
    needs: [images, chart]
    uses: ./.github/workflows/stranger.yml
    permissions:
      contents: read
    with:
      brain_ref: main
      version: ${{ github.ref_name }}
      install_doc: readme
    secrets:
      BRAIN_CHECKOUT_TOKEN: ${{ secrets.BRAIN_CHECKOUT_TOKEN }}

  # ── The Release page ────────────────────────────────────────────────────────
  # Runs LAST: a Release page pointing at artifacts that do not install reads as success, which is
  # worse than no page.
  github-release:
    name: release-notes
    needs: [notes, stranger]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-alpha*|*-beta*|*-rc*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            $prerelease
