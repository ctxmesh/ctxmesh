# Nightly full e2e per ADR 0003: the complete milestone acceptance (tier 3)
# on a fresh kind cluster with Knative Serving. The milestone number below
# advances as milestones close (co-evolution rule in the agent-brain harness README).
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  full-e2e:
    name: nightly-full-e2e
    runs-on: ubuntu-latest
    # Bumped 45→60 (m5-memory), 60→75 (m6-mesh), 75→120 (m7-eventing + the
    # heavier M=7 stack: Calico + KEDA + Eventing + MinIO install on top of m3-m6),
    # 120→150 (m12-helm + m12-ui: helm install + kind-load bff/echo + a headless
    # Playwright browser run + a live Playground agent invocation).
    timeout-minutes: 150
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Check out agent-brain (harness owns e2e — ADR 0004)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ctxmesh/agent-brain
          token: ${{ secrets.BRAIN_CHECKOUT_TOKEN }}
          path: agent-brain
          persist-credentials: false
          # Brain ref mirrors the engine branch (nightly runs on main <-> main).
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Install kind
        run: |
          curl -fsSLo ./kind "https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
      - name: Bring up the harness cluster (M=7 full stack — Calico + Knative Serving/Eventing + KEDA + MinIO + Langfuse)
        # M=7 ⊇ M=1..M6: the m7-eventing slice needs KEDA + Knative Eventing +
        # MinIO, so the whole nightly runs on the M=7 stack. The earlier slices
        # tolerate it (Calico enforces the m6 NetworkPolicy as a bonus). Heavy
        # for one CI job — split at the CI-revisit pass if the runner can't fit it.
        run: make -C agent-brain/harness dev-up M=7
      - name: M3 observability e2e (light — collector debug sink, no Langfuse)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Per ADR 0006 the full Langfuse tier3 M=3 is local-only (won't fit the
        # 2-CPU runner); nightly runs the light m3-trace slice — the collector
        # runs, spans flow, asserted via the collector's debug exporter.
        run: make -C agent-brain/harness tier2 SLICE=m3-trace
      - name: M4 MCP tools e2e (bind, call, hot-swap without restart)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Reuses the same cluster; asserts tool_version v1→v2 on an unchanged
        # pod UID + the mcp_word_count TOOL span via the collector debug sink.
        run: make -C agent-brain/harness tier2 SLICE=m4-tools
      - name: M5 session-memory e2e (context survives scale-to-zero)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Reuses the same cluster; the State-Layer Valkey is deployed by the
        # engine's `make deploy` inside the slice (config/statelayer is wired
        # into config/default), so no extra dev-up step. Asserts turns 2→4
        # across a real zero-pod window (min-scale 0) plus the memory.append
        # (turn-1 write) and memory.get (turn-2 cold read) spans via the
        # collector debug sink. Langfuse not needed on the M=1 cluster, same
        # as the m3-trace / m4-tools slices.
        run: make -C agent-brain/harness tier2 SLICE=m5-memory
      - name: M6 mesh e2e (A2A, cross-registry isolation, guards, child span)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Reuses the same M=1 cluster. Deploys two AgentRegistries + three
        # agents (orchestrator-a, worker-a in team-a; outsider-b in team-b) via
        # the slice. Asserts intra-registry A2A delegation, cross-registry
        # BLOCKED, a cycle guard trip, and the a2a.call child span. NOTE: the
        # cross-registry block is enforced APP-LAYER (the callee launcher's
        # registryId check — ADR 0007 addendum), which is CNI-agnostic, so this
        # registryId check — ADR 0007 addendum). On the M=7 stack Calico also
        # enforces the NetworkPolicy defense-in-depth layer (bonus vs the M=1 run).
        run: make -C agent-brain/harness tier2 SLICE=m6-mesh
      - name: M7 async eventing e2e (event→trigger, DLQ, cron/job, scaling mechanism)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Needs the M=7 stack (KEDA + Knative Eventing + MinIO). Deploys an
        # eventing agent (plain Deployment + Trigger), a job + a CronJob batch
        # agent, and a queue-depth AgentScalingPolicy. Asserts: CloudEvent →
        # trigger (agent.invoke span), poison → per-registry DLQ, CronJob/Job
        # complete (native-sidecar collector), and the KEDA scaling MECHANISM
        # (ScaledObject accepted + HPA created + target resolves). Live
        # queue-depth scale-up is a documented phase-2 limitation (the in-memory
        # channel exposes no queue_depth metric) — specs/eventing-scaling.md.
        run: make -C agent-brain/harness tier2 SLICE=m7-eventing
      - name: M8 cost-governance e2e (per-agent budget — soft alert, hard-breach halt, traced)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Needs only M=3 infra (Knative + Langfuse + the gateway) but tolerates
        # the M=7 stack. Deploys one budgeted agent (spec.budget → the controller
        # repoints MODEL_GATEWAY_URL to the launcher budget proxy on :2996 and
        # sets GATEWAY_UPSTREAM_URL → LiteLLM). Asserts: under-budget calls answer
        # normally; the per-agent cap trips a one-shot budget.alert at the soft
        # threshold; the hard breach returns a typed budget_exceeded (402) and
        # HALTS the run (the refused call never reaches LiteLLM — forwarded-call
        # count stays flat); budget attrs (budget.state ok/soft/exceeded,
        # budget.agent.spent_usd/cap_usd) ride the gateway.call cost span. Slice
        # tests the per-agent dimension (the example agent doesn't stamp
        # X-Conversation-Id on its LLM call) — specs/cost-governance.md.
        run: make -C agent-brain/harness tier2 SLICE=m8-budget
      - name: M9 eval/prompts/feedback e2e (deploy-gate, prompt-only swap, feedback→trace)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Needs only M=3 infra (Knative + Langfuse) but tolerates the M=7 stack.
        # Asserts the full M9 🧪: (a) an EvalSuite gates a deploy — below-threshold
        # gate:block → candidate ksvc never written (nothing serves / prior
        # revision keeps serving), passing → awaiting-promotion → promoted on the
        # agents.ctxmesh.ai/promote annotation (human-gated, mock scorer); (b) a
        # PromptVersion ref swap rolls a new revision with the container image
        # @sha256 BYTE-UNCHANGED (prompt folds into the p= digest, not the image);
        # (c) POST :2995/feedback {value:1} → 202 → a NUMERIC Langfuse score on
        # the run's exact traceId (bool → 400). The eval.gate span is v1-deferred
        # (controller injects no EvalTracer) — asserted on status.gate instead.
        # specs/eval-prompts-feedback.md, ADR 0008.
        run: make -C agent-brain/harness tier2 SLICE=m9-eval
      - name: M10 Python SDK e2e (no-framework loop → step→tool→model tree in Langfuse)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Needs only M=3 infra (Knative + Langfuse) but tolerates the M=7 stack.
        # Deploys the no-framework sdk-custom-agent (uses the ctxmesh SDK's
        # step-tracing helpers) + the word-count MCP tool + mock gateway. Asserts
        # the full M10 🧪 in Langfuse: one trace rooted at agent.invoke →
        # sdk-custom-agent (AGENT) → plan (CHAIN)→chat (GENERATION), word-count
        # (TOOL, real MCP word_count result), answer (CHAIN)→chat (GENERATION) —
        # a custom loop getting the SAME deep tree a framework agent gets SDK-free.
        # Guard 0 rebuilds base-python from tip so the pod runs the SDK with the
        # 307-follow fix (tools.call reaches FastMCP /mcp/). specs/python-sdk.md.
        run: make -C agent-brain/harness tier2 SLICE=m10-sdk
      - name: M11 trace-governance + security e2e (redaction / authz / audit / egress)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Needs M=6+ (Calico for the egress NetworkPolicy) — the M=7 nightly stack
        # covers it. Guard 0 rebuilds the CONTRIB collector from tip (a core image
        # no-ops the transform/redaction OTTL → PII leaks). Asserts the full M11 🧪:
        # (1) redaction before persistence on BOTH export paths — the agent
        # OpenInference indexed message keys (value-wide replace_all_patterns) AND
        # the LiteLLM gateway's own trace (turn_off_message_logging; cost span
        # survives) — raw PII absent from the persisted Langfuse trace, tree intact;
        # (2) authz — unbound/anonymous rejected, agent-engine-developer can create,
        # viewer read-only; (3) audit — a CRD create+delete in the manager audit
        # log; (4) egress lockdown — non-allowlisted host denied (Calico) while the
        # collector→Langfuse export stays alive. Dedupe fail-closed is unit-proven,
        # not e2e'd. specs/trace-governance-security.md, ADR 0009.
        run: make -C agent-brain/harness tier2 SLICE=m11-security
      - name: M12 helm install e2e (helm lint + install brings the platform + UI Ready)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Pure install-smoke, no browser: `helm lint` + `helm install` the chart
        # (ui.enabled=true) onto the M=7 cluster → controller + BFF Deployments
        # Ready, /api/health 200, the SPA shell served, and the auth floor rejects
        # an anonymous /api call (401). The slice builds + `kind load`s bff:latest
        # itself (IfNotPresent, no registry — a forgotten load = ImagePullBackOff).
        # FRESH CI cluster: the namespace is NOT kustomize-owned, so `helm install`
        # adopts nothing — the m12.8b control-plane-conflict deferral is closed and
        # this runs WITHOUT UIE2E_RESET_CONTROL_PLANE. specs/ui.md, ADR 0010/0011.
        run: make -C agent-brain/harness tier2 SLICE=m12-helm
      # The m12-ui slice drives the DEPLOYED UI headless via Playwright; its
      # toolchain is nvm-pinned to harness/ui-e2e/.nvmrc (Node 22), sourced by
      # e2e-m12.sh. setup-node puts Node on PATH but the harness sources nvm
      # explicitly (non-interactive make shell), so install nvm into $NVM_DIR.
      - name: Install nvm for the Playwright UI toolchain (harness ui-e2e/.nvmrc)
        run: |
          curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh \
            | PROFILE=/dev/null bash
          test -s "$HOME/.nvm/nvm.sh"
      - name: M12 deployed-UI e2e (topology / config-builder / Playground + caller-scoped 403)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # Drives the helm-installed UI headless (Playwright/chromium) over the BFF
        # port-forward: the 3 🧪 (topology renders live agents, the config-builder
        # form creates a real AgentDeployment, the Playground streams a live run
        # against the Knative URL) + the caller-scoped 403 (viewer create blocked).
        # The slice builds + `kind load`s bff:latest AND the echo-agent image
        # itself, then bootstraps the nvm-pinned Playwright toolchain (chromium).
        # FRESH CI cluster: (1) no kustomize-owned control plane → real `helm
        # install` (no UIE2E_RESET_CONTROL_PLANE), and (2) the in-cluster BFF
        # reaches the Knative URL → the Playground LIVE run works with NO
        # UI_E2E_SKIP_PLAYGROUND_RUN escape hatch — both m12.8b deferrals close on
        # a clean cluster. Runs LAST (heaviest: helm install + browser + a live
        # agent run). specs/ui.md, ADR 0010/0011.
        run: make -C agent-brain/harness tier2 SLICE=m12-ui
      - name: M13 console-foundation e2e (token login / RBAC chrome / forced-403)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The v2 console foundation (ADR 0012): 50-login drives the REAL login
        # form (paste a persona token → whoami → console + who-am-I; wrong token
        # → honest inline error; deep-link return-path/open-redirect guard);
        # 51-rbac-chrome proves the viewer read-only chrome + the caller-scoped
        # forced-403 (viewer POST /api/agents → real API-server 403). Reuses the
        # same fresh-cluster helm-install path + nvm Playwright toolchain as
        # m12-ui, minting developer/operator/viewer persona tokens at runtime.
        run: make -C agent-brain/harness tier2 SLICE=m13-ui
      - name: M14 first-agent aha e2e (connect → describe → create → run → tool span)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The aha (§28-30): connect a provider → add a keyed BYO-MCP (auth both
        # directions) → describe an agent → generate/review/create → land on the
        # agent page → watch the SSE log tail come alive → Run → the native run
        # inspector shows the tool span with tokens/cost. The slice builds +
        # kind-loads bff + managed-agent + the fixture MCP + the tool-call-mock,
        # deploys them, seeds an apiBase ModelRoute (the m14.12b seam) so the run
        # emits a DETERMINISTIC tool span with no real key (UI_E2E_TOOLMOCK=1).
        # MUST run on this FRESH CI cluster (its ModelRoute CRD has apiBase; the
        # persistent dev cluster's predates it) — the fresh helm install gives the
        # current CRD. Runs LAST (heaviest: 4 images + 2 mock upstreams + browser).
        run: make -C agent-brain/harness tier2 SLICE=m14-ui
      - name: M15 fleet-management e2e (grouped topology at 200 agents + CRUD round-trips)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The fleet-management 🧪 (§31): seeds a 200-agent scale fixture across 3
        # namespaces × 3 registries (min-scale=0, no pods spin), then drives the
        # deployed console headless — grouped topology (spec 70-topology-scale:
        # groups render, not raw nodes; expand/collapse; search; NodeDetailDrawer;
        # viewer-ForbiddenInline) and CRUD (spec 71-crud: find→inspect→edit wizard
        # PUT round-trip→typed-name delete; viewer no write affordances + forced-403).
        # The scale fixture is torn down at exit (cleanup trap). Extends the M14
        # bring-up path (helm + persona RBAC + fixture MCP + tool-mock). Runs LAST
        # (heaviest: M14 stack + scale fixture + 70/71 Playwright specs).
        # ADR 0006 shared-cluster note: full headless slice on a FRESH CI cluster;
        # locally provable without the cluster: tier0 + tsc --noEmit + playwright
        # test --list + shellcheck. (ADR 0004 gate-and-skip-gracefully applies.)
        run: make -C agent-brain/harness tier2 SLICE=m15-ui
      - name: M16 observability-depth e2e (native trace explorer + feedback + cost)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The observability-depth 🧪 (§31, spec observability-depth-ui): reuses the
        # M14 bring-up (helm + persona RBAC + fixture MCP + tool-mock + Langfuse),
        # invokes the aha agent to seed ≥1 traced run, then drives the deployed
        # console headless — spec 80-trace-explorer (runs browser → row-click →
        # the native /traces/:id span tree with nestingDepth + I/O toggle +
        # Langfuse forensics link-out + NO embedded iframe; no status filter) and
        # spec 81-feedback (dashboard embeds no Langfuse iframe [unconditional] +
        # cost card → /cost; /cost per-agent breakdown with the recent-window
        # caveat; the feedback panel on a trace). Kills the second Langfuse login.
        # ADR 0006 shared-cluster note: full headless slice on a FRESH CI cluster;
        # locally provable without the cluster: tier0 + tsc --noEmit + playwright
        # test --list + shellcheck. (ADR 0004 gate-and-skip-gracefully applies —
        # the Langfuse-fed legs skip when the adapter/runs are absent.)
        run: make -C agent-brain/harness tier2 SLICE=m16-ui
      - name: M17 authoring-depth e2e (OAuth MCP + tool hot-swap + approval queue)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The authoring-depth 🧪 (§28.2/§31, spec authoring-depth-ui): reuses the
        # M16 bring-up + deploys the OAuth-fixture MCP (harness/fixtures/m17,
        # OAuth 2.1 authorize/token/refresh, PKCE S256), then drives the deployed
        # console headless — spec 90-tool-hot-swap (bind a catalog tool → the
        # MCPToolBinding propagation status surfaces honestly [Ready→propagated,
        # else the reason]; viewer forced-403) and spec 91-oauth-mcp (the OAuth
        # add-MCP branch redirects to the fixture's /authorize; the operator
        # approval queue approve/reject; NO token ever in the SPA). MCP-resource
        # OAuth, NOT the M18 console-login OIDC. ADR 0006: full headless slice on a
        # FRESH CI cluster; locally provable — tier0 + tsc --noEmit + playwright
        # test --list + shellcheck + the fixture contract test. ADR 0004 gate-and-skip.
        run: make -C agent-brain/harness tier2 SLICE=m17-ui
      - name: M18 console-cohesion e2e (personas — providers/compose/fleet/redaction)
        env:
          AGENT_ENGINE: ${{ github.workspace }}
        # The console-cohesion 🧪 (§28–31, spec console-cohesion): reuses the M16/M17
        # bring-up shape (M18 adds NO new fixture server) + seeds a connected-provider
        # ModelRoute + the aha agent, then drives the deployed console headless per
        # persona — 100-developer-cohesion (Providers list + create-agent composes),
        # 101-first-run (onboarding checklist), 102-sre-fleet (drift/external badges),
        # 103-compliance (redaction-policy editor). All gate-gracefully (ADR 0004).
        # ADR 0006: full headless slice on a FRESH CI cluster; locally provable —
        # tier0 + tsc --noEmit + playwright test --list + shellcheck.
        run: make -C agent-brain/harness tier2 SLICE=m18-ui
