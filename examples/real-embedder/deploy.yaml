# real-embedder — the dev-cluster semantic embedding service (M140). Serves REAL
# all-MiniLM-L6-v2 embeddings behind /v1/embeddings so the KB ingestion + retrieval
# path produces genuine semantic vectors (not the hash mock). Offline + self-hosted:
# no external key, no paid API. Apply into the `agentry` namespace; the model gateway's
# embeddingRoute points its /v1/embeddings hop at svc real-embedder:8080.
#
# Build the image first: `make docker-build-real-embedder` (tag dev.local/real-embedder:m117),
# then `kind load docker-image dev.local/real-embedder:m117 --name agentry-dev`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: real-embedder
  namespace: agentry
  labels:
    app: real-embedder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: real-embedder
  template:
    metadata:
      labels:
        app: real-embedder
    spec:
      containers:
        - name: embedder
          image: dev.local/real-embedder:m117
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: real-embedder
  namespace: agentry
spec:
  selector:
    app: real-embedder
  ports:
    - port: 8080
      targetPort: 8080
