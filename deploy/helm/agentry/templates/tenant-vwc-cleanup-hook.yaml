{{- /*
Tenant-label VWC pre-delete cleanup (M134, ADR 0102). The manager-owned tenant-label
ValidatingWebhookConfiguration is created at RUNTIME (internal/webhook.ApplyTenantLabelVWC), so it is
NOT a Helm release resource — `helm uninstall` cannot GC it, and an ownerReference is invalid (a
cluster-scoped VWC cannot have a namespaced owner). Left behind, it is a FAIL-CLOSED webhook with a dead
backend: ordinary namespace writes still pass (matchConditions scope it to tenant-label writes), but any
tenant-label write cluster-wide is dead forever. This pre-delete hook runs `/manager --cleanup-tenant-vwc`
(idempotent — NotFound is success) to delete it while the release still exists, so a failed cleanup ABORTS
the uninstall with everything intact + retryable (vs a post-delete hook that would orphan after teardown).

Hand-maintained (not gen_helm_chart-generated) + hook-annotated → excluded from the no-drift diff. Renders
UNCONDITIONALLY (covers the webhook-was-disabled case; the delete just no-ops). Least-privilege ClusterRole:
get/delete pinned to the one VWC by resourceName. hook-delete-policy before-hook-creation (retry a prior
failed run) + hook-succeeded (don't self-orphan the cleanup crew). Weights: SA/CR/CRB at -5, Job at 0.

Escape hatch if the image is unpullable at uninstall: `helm uninstall --no-hooks` then
`kubectl delete validatingwebhookconfiguration tenant-label-validator --ignore-not-found`.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentry-tenant-vwc-cleanup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/component: tenant-vwc-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agentry-tenant-vwc-cleanup
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/component: tenant-vwc-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # get/delete pinned to the single manager-owned VWC (resourceNames works for get/delete). Nothing else.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations"]
    verbs: ["get", "delete"]
    resourceNames: ["tenant-label-validator"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agentry-tenant-vwc-cleanup
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/component: tenant-vwc-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agentry-tenant-vwc-cleanup
subjects:
  - kind: ServiceAccount
    name: agentry-tenant-vwc-cleanup
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agentry-tenant-vwc-cleanup
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/component: tenant-vwc-cleanup
  annotations:
    "helm.sh/hook": pre-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  # A broken hook must fail LEGIBLY inside Helm's timeout, not hang the uninstall.
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentry
        app.kubernetes.io/component: tenant-vwc-cleanup
    spec:
      restartPolicy: Never
      serviceAccountName: agentry-tenant-vwc-cleanup
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: {{ printf "%s:%s" .Values.controllerManager.image.repository (.Values.controllerManager.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: IfNotPresent
          command: ["/manager"]
          args: ["--cleanup-tenant-vwc"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
