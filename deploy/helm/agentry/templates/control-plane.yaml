apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: agentry
    control-plane: controller-manager
  name: agentry-controller-manager
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.controllerManager.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentry
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: agentry
        control-plane: controller-manager
    spec:
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect
        - --health-probe-bind-address=:8081
        command:
        - /manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: STATELAYER_PROXY_URL
          value: http://agentry-statelayer-proxy.{{ .Values.namespace }}.svc:8080
        - name: CONSOLE_URL
          value: {{ .Values.bff.consoleURL | default "" | quote }}
        - name: COLLECTOR_IMAGE
          value: {{ .Values.controllerManager.injectedImages.collector | default "" | quote }}
        - name: DISCOVERY_IMAGE
          value: {{ .Values.controllerManager.injectedImages.discovery | default "" | quote }}
        - name: MCP_OBO_EGRESS_ENABLED
          value: {{ .Values.controllerManager.oboEgress.enabled | quote }}
        - name: EGRESS_SIDECAR_IMAGE
          value: {{ .Values.controllerManager.oboEgress.sidecarImage | default "" | quote }}
        - name: MCP_CAPABILITY_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              key: MCP_CAPABILITY_PUBLIC_KEY
              name: bff-capability
              optional: true
        - name: MCP_CAPABILITY_AUDIENCE
          value: {{ .Values.controllerManager.oboEgress.capabilityAudience | default "" | quote }}
        - name: MCP_CREDENTIAL_NAMESPACE
          value: {{ .Values.bff.mcp.credentialNamespace | default .Values.namespace }}
        - name: TOKEN_SERVICE_URL
          value: {{ .Values.controllerManager.oboEgress.tokenServiceURL | default (printf "%s://agentry-token-service.%s.svc:8443" (ternary "https" "http" .Values.tokenService.tls.required) .Values.namespace) }}
        - name: DEV_DATA_PLANE
          value: {{ .Values.devDataPlane.enabled | quote }}
        - name: ENABLE_TENANT_LABEL_WEBHOOK
          value: {{ ternary "true" "false" .Values.security.tenantLabelWebhook.enabled | quote }}
        envFrom:
        - secretRef:
            name: bff-adapters
            optional: true
        image: {{ printf "%s:%s" .Values.controllerManager.image.repository (.Values.controllerManager.image.tag | default .Chart.AppVersion) }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        - containerPort: 9443
          name: webhook
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: webhook-certs
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentry-controller-manager
      terminationGracePeriodSeconds: 10
      volumes:
      - name: webhook-certs
        secret:
          secretName: agentry-webhook-server-cert
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: agentry
    control-plane: gateway
  name: agentry-gateway
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.gateway.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentry
      control-plane: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentry
        control-plane: gateway
    spec:
      containers:
      - args:
        - --config
        - /etc/litellm/config.yaml
        image: ghcr.io/berriai/litellm:v1.91.0
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 15
        name: litellm
        ports:
        - containerPort: 4000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 10
        resources:
          limits:
            cpu: "2"
            memory: 1536Mi
          requests:
            cpu: 50m
            memory: 512Mi
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/litellm
          name: gateway-config
          readOnly: true
      terminationGracePeriodSeconds: 10
      volumes:
      - configMap:
          name: agentry-gateway-config
        name: gateway-config
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: agentry
    control-plane: statelayer-proxy
  name: agentry-statelayer-proxy
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.statelayerProxy.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentry
      control-plane: statelayer-proxy
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: statelayer-proxy
      labels:
        app.kubernetes.io/name: agentry
        control-plane: statelayer-proxy
    spec:
      containers:
      - env:
        - name: STATELAYER_ADDR
          value: {{ .Values.statelayer.externalAddr | default (printf "agentry-statelayer.%s.svc:6379" .Values.namespace) }}
        - name: STATELAYER_USERNAME
          value: ""
        - name: STATELAYER_PASSWORD
          value: ""
        image: {{ printf "%s:%s" .Values.statelayerProxy.image.repository (.Values.statelayerProxy.image.tag | default .Chart.AppVersion) }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 20
        name: statelayer-proxy
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentry-statelayer-proxy
      terminationGracePeriodSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: agentry
    control-plane: token-service
  name: agentry-token-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.tokenService.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agentry
      control-plane: token-service
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: token-service
      labels:
        app.kubernetes.io/name: agentry
        control-plane: token-service
    spec:
      containers:
      - env:
        - name: MCP_CREDENTIAL_NAMESPACE
          value: {{ .Values.bff.mcp.credentialNamespace | default .Values.namespace }}
        - name: TOKEN_SERVICE_TLS_CERT_FILE
          value: /etc/token-service/tls/tls.crt
        - name: TOKEN_SERVICE_TLS_KEY_FILE
          value: /etc/token-service/tls/tls.key
        - name: TOKEN_SERVICE_CLIENT_CA_FILE
          value: /etc/token-service/tls/ca.crt
        - name: TOKEN_SERVICE_TLS_REQUIRED
          value: {{ .Values.tokenService.tls.required | quote }}
        envFrom:
        - secretRef:
            name: bff-adapters
            optional: true
        image: {{ printf "%s:%s" .Values.tokenService.image.repository (.Values.tokenService.image.tag | default .Chart.AppVersion) }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          initialDelaySeconds: 10
          periodSeconds: 20
          tcpSocket:
            port: 8443
        name: token-service
        ports:
        - containerPort: 8443
          name: mtls
          protocol: TCP
        readinessProbe:
          initialDelaySeconds: 3
          periodSeconds: 10
          tcpSocket:
            port: 8443
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /etc/token-service/tls
          name: tls
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agentry-token-service
      terminationGracePeriodSeconds: 10
      volumes:
      - name: tls
        secret:
          optional: true
          secretName: token-service-tls
