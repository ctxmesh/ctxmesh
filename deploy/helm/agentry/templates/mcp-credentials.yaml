{{- /*
The LOCKED MCP credential namespace (m25.1b, ADR 0029 §7).

This is a Helm-only, values-gated add-on — NOT generated from config/ — so it is
NOT part of the kustomize no-drift set (make helm-verify checks only the four
generated templates + the DEFAULT-values render). It renders NOTHING unless
bff.mcp.credentialNamespace is set, so with default values `helm template` still
equals `kustomize build config/default` (no drift). Turning it on is a deliberate,
documented prod step: it moves every MCP grant Secret (a user's OAuth tokens) into a
namespace whose Secret access is RBAC'd to the BFF credential-component SA only, so a
tenant sharing the cluster cannot read another user's grant.

Reason it is not generated from config/default: that overlay forces a single
`namespace: agentry` on every resource (kustomize namespace transform),
so a dedicated namespace's RBAC cannot be expressed there without a build change.
Keeping this Helm-only + default-off honors the ADR's dedicated-namespace design
while preserving the generated-chart no-drift contract. The egress-gateway SA's
read-only grant is added here when that SA lands (m25.4).
*/ -}}
{{- if .Values.bff.mcp.credentialNamespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.bff.mcp.credentialNamespace }}
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    agentry.ctxmesh.ai/purpose: mcp-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentry-credential-component
  namespace: {{ .Values.bff.mcp.credentialNamespace }}
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
# Credential-component access to MCP grant Secrets ONLY, and ONLY in this locked
# namespace — never a tenant/agent namespace, never a user CRD. This is the bounded
# exception to the BFF SA's otherwise-empty ruleset (config/bff/role.yaml).
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentry-credential-component
  namespace: {{ .Values.bff.mcp.credentialNamespace }}
  labels:
    app.kubernetes.io/name: agentry
    app.kubernetes.io/managed-by: {{ .Release.Service }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentry-credential-component
subjects:
# The BFF's privileged credential client (cmd/bff/main.go — inline-consent grant writes) AND the
# token-service's credential resolver/store (cmd/token-service/main.go, which reads
# MCP_CREDENTIAL_NAMESPACE and resolves/stores grants via K8sBackend) both operate on grant Secrets
# in this locked namespace, so BOTH SAs are bound here (OTH-5: the token-service SA was missing →
# 403 for OBO resolution in the locked-namespace config). No TENANT SA is bound — that omission IS
# the cross-tenant isolation boundary.
- kind: ServiceAccount
  name: agentry-bff
  namespace: {{ .Values.namespace }}
- kind: ServiceAccount
  name: agentry-token-service
  namespace: {{ .Values.namespace }}
{{- end }}
