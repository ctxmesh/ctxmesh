# values.yaml — agent-engine Helm chart.
#
# The control-plane + CRD manifests are generated from `kustomize build
# config/default`; these values are the knobs an operator overrides. With the
# defaults below unchanged, `helm template` renders byte-for-byte the same
# resources as `make deploy` (proven by `make helm-verify`).

# Namespace the platform installs into. MUST match the namespace baked into
# config/default (agent-engine-system) for the no-drift default to hold. Change
# it for a custom install; `--create-namespace` (or crds.install) still applies.
namespace: agent-engine-system

controllerManager:
  image:
    # The controller-manager image. Override repository+tag for a real registry
    # (air-gapped installs point this at the internal registry, spec §6).
    # PRODUCTION: point repository at a SIGNED image in your registry (e.g.
    # ghcr.io/<org>/agent-engine-controller) pinned to an immutable digest, and
    # enforce signatures with a cluster admission policy (cosign / Sigstore
    # policy-controller / Kyverno). The chart sets the image ref; signature
    # ENFORCEMENT is a cluster-policy concern (specs/deployment.md), not a toggle.
    repository: controller
    # Empty tag falls back to Chart.appVersion ("latest"), matching
    # `controller:latest` in config/default. Set an immutable tag in production.
    tag: ""

  # Control-plane HA (m34.5, ADR 0037). The controller-manager already runs with
  # --leader-elect, so >1 replica is a hot-standby leader-election cluster (one active
  # leader reconciles; the rest fail over fast). Default 1 keeps the vanilla chart ==
  # kustomize (helm-verify no-drift). Set 2+ for a highly-available control plane.
  replicas: 1

  # An optional PodDisruptionBudget for the control plane. OFF by default (no-drift).
  # Enable ALONGSIDE replicas>1 so a voluntary disruption (node drain/upgrade) cannot
  # evict every manager at once — a leader always survives.
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

# CRDs are installed with the chart by default. Set false to manage CRD
# lifecycle out of band (e.g. a shared cluster where CRDs are pre-applied).
crds:
  install: true

# --- Bundled dev data plane (Valkey statelayer + MinIO objectstore) ----------
# DEV / TRIAL ONLY (PRD §23). These run an in-cluster Valkey + MinIO with
# DETERMINISTIC dev credentials (never real secrets). In production set
# `enabled: false` and point the controller at an externally-managed data plane.
devDataPlane:
  enabled: true

# --- Prometheus wiring -------------------------------------------------------
# The controller-manager exposes HTTPS metrics on :8443 (already in the
# control-plane manifests). A ServiceMonitor + a metrics-ingress NetworkPolicy
# are opt-in: they require the Prometheus Operator CRD / a NetworkPolicy-
# enforcing CNI (ADR 0007) respectively, so they are OFF by default to keep
# `helm install` clean on a vanilla cluster. Enable on a monitored cluster.
prometheus:
  # Install the ServiceMonitor (requires the Prometheus Operator CRDs).
  serviceMonitor:
    enabled: false
networkPolicy:
  # Install the NetworkPolicy that restricts /metrics ingress to namespaces
  # labeled `metrics: enabled` (requires a NetworkPolicy-enforcing CNI).
  metricsIngress:
    enabled: false

# --- UI + Go BFF (folded in, m12.8a) -----------------------------------------
# The operator/engineer UI (static Vite SPA) + the Go BFF that serves it and the
# /api surface, behind the M11 control-plane auth. The BFF's SA is least-
# privilege (ADR 0011): it holds NO agent-CRD access — every user-facing CRD
# read/write runs on the CALLER'S own token, so the K8s API server enforces the
# caller's RBAC (the M11 personas). See templates/bff.yaml (generated from
# config/bff). Enabled by default so `helm install` brings the UI up with the
# platform (spec §6); set false for a headless control-plane-only install.
ui:
  enabled: true

# --- BFF feature flags (m14.4) -----------------------------------------------
# The Go BFF's connect-a-provider flow (ADR 0015): paste a provider API key once
# and get a working model route, validated + stored server-side (the key never
# touches the browser). Enabled by default for dev/trial so the console's first
# step is a paste, not a terminal. Set `enabled: false` on a HARDENED install:
# the connect endpoints (POST/GET /api/providers, GET /api/providers/{name}/
# models) then 404 and the UI falls back to referencing an out-of-band-created
# SecretBinding. This templates the BFF deployment's PROVIDER_CONNECT_ENABLED
# env: with this default the render is "true" == kustomize (helm-verify no-drift);
# `helm install --set bff.providerConnect.enabled=false` renders "false" to
# disable it — the ADR 0015 hardened-install path.
bff:
  providerConnect:
    enabled: true
  # The create-from-prompt generation-model pin (ADR 0014). Empty (the default)
  # leaves generation using the caller's connected-provider model unpinned — the
  # zero-config dev/trial path. An operator that wants a GOVERNED generation model
  # sets a comma-separated list (e.g. "claude-sonnet-4-6,gpt-4o"); it becomes the
  # UI's model dropdown source and the allowed set the /api/agents/generate
  # endpoint enforces. This templates the BFF deployment's PLATFORM_GENERATION_MODELS
  # env; with this default the render is the quoted empty string == kustomize
  # (helm-verify no-drift).
  generation:
    platformModels: ""
  # The BYO-MCP flow (ADR 0016): register your OWN MCP server, discover its tools
  # (with inputSchema), and catalog them — all server-side (the optional bearer key
  # never touches the browser). Enabled by default for dev/trial so the console's
  # add-MCP wizard works out of the box. Set `enabled: false` on a HARDENED install
  # to forbid BYO MCP: the register/catalog endpoints (POST/GET /api/mcpservers,
  # GET /api/tools) then 404. `requireApproval: true` (hardened) marks newly
  # registered MCP tools pending-approval instead of self-serve (the approval queue
  # itself is M17). This templates the BFF deployment's MCP_ENABLED /
  # MCP_REQUIRE_APPROVAL envs; with these defaults the render is "true"/"false" ==
  # kustomize (helm-verify no-drift).
  mcp:
    enabled: true
    requireApproval: false
    # credentialNamespace is the LOCKED platform namespace that holds every MCP grant
    # Secret (m25.1b, ADR 0029 §7). Empty (the default) keeps the legacy
    # per-request-namespace grant path (ADR 0011) — no extra namespace/RBAC renders, so
    # the default chart == kustomize (helm-verify no-drift). Set it (e.g.
    # `agent-engine-credentials`) to render the dedicated namespace + a
    # credential-component-only Role/RoleBinding (templates/mcp-credentials.yaml) and
    # route grants there, so a tenant sharing the cluster cannot read another user's
    # OAuth tokens. Pair it with a per-cluster MCP_GRANT_HMAC_KEY (bff-adapters Secret).
    # Changing it later re-keys grants (dev re-consent). PRODUCTION SHOULD SET THIS.
    credentialNamespace: ""

# --- Console login: OIDC/SSO via a bundled Dex broker (m19.5, ADR 0020) --------
# OFF by default: the OSS/dev default is token login (ADR 0012), so nothing here
# renders and the helm-verify no-drift default is unchanged. Enable to bundle Dex
# (a lightweight CNCF OIDC broker) so humans log in with an org identity instead of
# a pasted token. Cluster-OIDC via Dex is OPEN-CORE; federated SAML/SCIM/multi-IdP
# is enterprise (PRD §24) — the enterprise build populates connectors[], not a fork.
#
# THE LOAD-BEARING CLUSTER STEP (m19.5 risk): the K8s API server must be told to
# TRUST the Dex issuer, or the ID token Dex mints won't authenticate and RBAC won't
# bind. This chart ships Dex + the console client but CANNOT set apiserver flags
# (that's cluster-admin) — see NOTES.txt for the exact --oidc-* flags. On a managed
# cluster that can't set them, KEEP token login (ADR 0012); that is NOT a regression.
auth:
  oidc:
    # Bundle Dex + the console OIDC client. Default false → no Dex renders.
    enabled: false
    # The Dex issuer URL: the PUBLIC address both browsers AND the API server reach
    # Dex at. It MUST match the apiserver --oidc-issuer-url byte-for-byte. Override
    # for your ingress / LoadBalancer host.
    issuer: "https://dex.agent-engine.example.com"
    image:
      repository: ghcr.io/dexidp/dex
      tag: "v2.41.1"
    # The console OAuth client — Auth-Code + PKCE, a PUBLIC client (no secret in the
    # browser; PKCE is the proof). redirectURIs is the SPA's callback origin(s).
    client:
      id: agent-engine-console
      redirectURIs:
        - "https://console.agent-engine.example.com/auth/callback"
    # Zero-config demo login (DEV / TRIAL ONLY — PRD §23 deterministic dev creds,
    # NEVER a real secret): a single static user so a fresh install logs in with no
    # external IdP. OVERRIDE email + passwordHash for anything shared, or set
    # enabled:false and add a real connector below. The default password is
    # "agent-engine-dev" (the bcrypt hash below). Change it before exposing Dex.
    staticUser:
      enabled: true
      email: "admin@agent-engine.local"
      username: "admin"
      # bcrypt("agent-engine-dev"). Regenerate with:
      #   htpasswd -bnBC 10 "" <your-password> | tr -d ':\n'
      passwordHash: "$2y$10$.wIDp8LyQ40/H.bdsuASxevjXyUk0gXCj9jaGQVJp.BnqiVxCxpj6"
    # Federated IdP connectors (enterprise): each entry is a raw Dex connector object
    # (type/id/name/config). Google/Azure AD/Okta/GitHub/LDAP = OIDC connectors;
    # SAML = a Dex SAML connector. Empty = static-user-only (the OSS demo).
    connectors: []
    # Langfuse shared-issuer client (m19.7, ADR 0020): register Langfuse as a second
    # client of THIS Dex so the console's forensics link-out opens Langfuse without a
    # SECOND login. OFF by default. Langfuse is a server-side app → a CONFIDENTIAL
    # client, so clientSecret is REQUIRED when enabled (Helm errors if empty). Set the
    # SAME secret on Langfuse (AUTH_DEX_CLIENT_SECRET) + point it at this issuer — see
    # NOTES.txt. Absent → the link-out still works but Langfuse asks for its own login
    # (honest degrade). NEVER commit a real secret; supply it at install via --set / a
    # values file kept out of git.
    langfuse:
      enabled: false
      clientId: "langfuse"
      redirectURI: "https://langfuse.agent-engine.example.com/api/auth/callback/dex"
      clientSecret: ""
    # Render an EXAMPLE ClusterRoleBinding mapping the demo user's OIDC identity to
    # the operator persona, so the demo login is immediately usable. It binds
    # User "<usernamePrefix><staticUser.email>" to ClusterRole agent-engine-operator.
    # The prefix MUST match the apiserver --oidc-username-prefix (default below).
    # Set false to manage RBAC out of band (the enterprise path maps IdP groups).
    demoBinding: true
    usernamePrefix: "oidc:"
