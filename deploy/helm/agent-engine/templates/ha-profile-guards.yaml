{{- /*
Production-profile HA invariants (ADR 0051, M55) — Helm-only, render NO resources.

Helm can't infer "production", so the operator declares `profile: production`
(values-production.yaml). Under it, `helm template` FAILS unless the control plane
is actually HA — so a declared-production install can't silently ship
single-replica. The DEFAULT profile ("") renders leniently → dev stays lean +
no-drift. Distinct from ha-guards.yaml (contradictions that are wrong in ANY
profile). Closes m52.D2 (the proxy-HA render guard) and generalizes it.
*/ -}}
{{- if eq .Values.profile "production" }}
{{- if lt (int .Values.statelayerProxy.replicas) 2 }}
{{- fail "\n\nprofile=production requires statelayerProxy.replicas>=2.\nThe M53 cutover routes agent memory/quota/dedup through the state-layer proxy, and\nthe budget check fails CLOSED through it (ADR 0050 §5) — a single-replica proxy drain\n402s every budget-capped agent. Set statelayerProxy.replicas>=2 + a PDB.\n" }}
{{- end }}
{{- if lt (int .Values.bff.replicas) 2 }}
{{- fail "\n\nprofile=production requires bff.replicas>=2 (control-plane HA, ADR 0051).\n" }}
{{- end }}
{{- if not .Values.bff.runStore.enabled }}
{{- fail "\n\nprofile=production requires bff.runStore.enabled — the BFF must dispatch runs to\nthe durable run-worker (an external Postgres run store), else runs execute in-process\non one pod and can't survive a BFF loss / scale >1 (ADR 0051).\n" }}
{{- end }}
{{- if lt (int .Values.bff.runStore.worker.minReplicaCount) 2 }}
{{- fail "\n\nprofile=production requires bff.runStore.worker.minReplicaCount>=2 — a WARM worker\npool (avoid a scale-from-0 cold start on an interactive run; a drain never zeroes the\npool, ADR 0051 Fork-C).\n" }}
{{- end }}
{{- if .Values.devDataPlane.enabled }}
{{- fail "\n\nprofile=production forbids devDataPlane.enabled — the bundled in-cluster Valkey +\nMinIO use DETERMINISTIC dev credentials (PRD §23). Point at an externally-managed,\nHA data plane instead (devDataPlane.enabled=false).\n" }}
{{- end }}
{{- if and (not .Values.statelayer.externalAddr) (not .Values.statelayer.persistence.enabled) }}
{{- fail "\n\nprofile=production requires statelayer.externalAddr (BYO-external Valkey/managed Redis) OR\nstatelayer.persistence.enabled (in-cluster persistent Valkey). With neither — and devDataPlane\ndisabled (required above) — STATELAYER_ADDR points at the agent-engine-statelayer Service, which\nis NOT rendered, so the fail-closed state-layer proxy can't reach Valkey and 402s every\nbudget-capped agent (audit OPS-4c/OPS-3). Prefer externalAddr for HA (ADR 0053).\n" }}
{{- end }}
{{- /* OPS-3: the rest of the control/data plane must be HA too. The proxy is a
   fail-closed critical path (above); the gateway (every LLM call), the token-service
   (OBO credential plane), and the controller-manager (leader-elected warm standby) are
   equally single-points-of-failure at replicas:1. values-production.yaml already declares
   all of these >=2 + PDBs on — enforce it so a declared-production install can't ship a
   single-replica data plane. */ -}}
{{- if lt (int .Values.gateway.replicas) 2 }}
{{- fail "\n\nprofile=production requires gateway.replicas>=2 — the LiteLLM model gateway fronts\nEVERY LLM call; a single-replica drain stalls all agent runs (audit OPS-3).\n" }}
{{- end }}
{{- if lt (int .Values.tokenService.replicas) 2 }}
{{- fail "\n\nprofile=production requires tokenService.replicas>=2 — the OBO credential plane is\non the tool-call hot path; a single-replica drain fails third-party credential\nresolution (audit OPS-3).\n" }}
{{- end }}
{{- if lt (int .Values.controllerManager.replicas) 2 }}
{{- fail "\n\nprofile=production requires controllerManager.replicas>=2 — leader election makes\nthe extra replica a WARM standby, so a node drain/upgrade doesn't leave the operator\nun-reconciled (audit OPS-3).\n" }}
{{- end }}
{{- if not .Values.componentPodDisruptionBudgets.enabled }}
{{- fail "\n\nprofile=production requires componentPodDisruptionBudgets.enabled — else a voluntary\ndisruption (node drain/upgrade) can evict a whole HA set at once (audit OPS-3).\n" }}
{{- end }}
{{- if not .Values.controllerManager.podDisruptionBudget.enabled }}
{{- fail "\n\nprofile=production requires controllerManager.podDisruptionBudget.enabled (audit OPS-3).\n" }}
{{- end }}
{{- if not .Values.tokenService.tls.required }}
{{- fail "\n\nprofile=production requires tokenService.tls.required — the credential plane dispenses\nthird-party USER credentials and must not silently downgrade to plain HTTP (audit SEC-5).\nProvision the platform mTLS certs (token-service-tls Secret) and set tokenService.tls.required=true.\n" }}
{{- end }}
{{- /* SEC-4: MCP per-user grant Secrets (3rd-party OAuth tokens) must live in a LOCKED,
   dedicated namespace — else they land in the agent's OWN namespace where a tenant can
   read another user's grant tokens (internal/bff/server.go). Helm can't inspect the
   operator-provisioned bff-adapters Secret, so it can't verify MCP_GRANT_HMAC_KEY / the
   capability seed here (unsalted identity hashes without the HMAC key) — those are
   documented as required alongside CONTROLPLANE_DSN; the enforceable, highest-risk knob is
   the credential namespace. */ -}}
{{- if .Values.bff.mcp.enabled }}
{{- if not .Values.bff.mcp.credentialNamespace }}
{{- fail "\n\nprofile=production with bff.mcp.enabled requires bff.mcp.credentialNamespace — else per-user\nMCP grant Secrets (3rd-party OAuth tokens) are stored in the AGENT's own namespace, where a\ntenant CAN read another user's grant tokens (ADR 0029 §7). Set a locked, dedicated\ncredential namespace; also provision MCP_GRANT_HMAC_KEY + the capability seed in the\nbff-adapters Secret (unsalted identity hashes + disabled capability minting otherwise).\n" }}
{{- end }}
{{- end }}
{{- /* GA Gate A (ADR 0096) → M134: make a reduced security posture LOUD, not silent. The tenant-label
   webhook is now DEFAULT-ON (M134, ADR 0102) — the guard below fires only if an operator DISABLES it
   without acknowledging. OBO egress-TLS is still deferred (Gate E delta, m52.G25): a production install
   must confront it at render time rather than discover a runtime x509 break in production. */ -}}
{{- if .Values.controllerManager.oboEgress.enabled }}
{{- fail "\n\nprofile=production forbids controllerManager.oboEgress.enabled until Gate E (M128, ADR 0096).\nThe OBO egress sidecar delegates OAuth/credential reads to the token-service, which production runs\nTLS-ONLY (tokenService.tls.required) — but the sidecar is not yet wired with the CA to verify it, so\nevery delegation fails x509 at RUNTIME (there is no plaintext listener to fall back to). Encrypted\nsidecar->token-service transport (the CA wiring) ships in Gate E / M128. Until then: set\ncontrollerManager.oboEgress.enabled=false in production, or run per-user OBO in a non-production\nprofile (dev OBO works over plain HTTP).\n" }}
{{- end }}
{{- if and (not .Values.security.tenantLabelWebhook.enabled) (ne .Values.security.tenantLabelEnforcement "unenforced-UNSAFE-acknowledged") }}
{{- fail "\n\nprofile=production runs the tenant-label ValidatingWebhook by DEFAULT (M134, ADR 0102) — you set\nsecurity.tenantLabelWebhook.enabled=false WITHOUT acknowledging the reduced posture.\nThe webhook forbids a non-controller principal from setting/changing/removing a namespace's tenant label\n(a cross-tenant boundary move). It boots with the in-process cert-controller (no cert-manager), is\nfail-closed but matchConditions-scoped + system-ns-exempt, and was proven no-wedge fresh on a cluster\n(M134). Either RE-ENABLE it (security.tenantLabelWebhook.enabled=true — the default), or explicitly\nacknowledge running without it:\n  security.tenantLabelEnforcement: \"unenforced-UNSAFE-acknowledged\"\nCompensating control when off: setting the label requires namespace-write RBAC, which no tenant principal\nholds in a sane tenancy model (the webhook is defence-in-depth against RBAC misconfiguration).\n" }}
{{- end }}
{{- end }}
