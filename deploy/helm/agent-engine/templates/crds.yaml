    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: credentialstores.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    categories:
    - agents
    kind: CredentialStore
    listKind: CredentialStoreList
    plural: credentialstores
    shortNames:
    - credstore
    singular: credentialstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          CredentialStore selects the credential backend for OBO grants in its own namespace,
          overriding the cluster default. Modeled on ESO's namespaced SecretStore (ADR 0032).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec selects the backend for this namespace.
            properties:
              provider:
                description: provider selects and configures the credential backend
                  for this store.
                properties:
                  kubernetes:
                    description: kubernetes selects the built-in Kubernetes-Secret
                      backend (the zero-dep default).
                    properties:
                      credentialNamespace:
                        description: |-
                          credentialNamespace overrides the locked namespace that holds per-user grant
                          Secrets. Empty ⇒ the token-service's configured default (TOKEN_SERVICE_CREDENTIAL_NS).
                        type: string
                    type: object
                  openbao:
                    description: openbao selects an OpenBao/Vault backend.
                    properties:
                      address:
                        description: address is the OpenBao/Vault API address (e.g.
                          https://openbao.cred.svc:8200).
                        minLength: 1
                        type: string
                    required:
                    - address
                    type: object
                  postgres:
                    description: postgres selects the Postgres reference backend (the
                      scale profile).
                    properties:
                      dsnSecretRef:
                        description: dsnSecretRef locates the Postgres connection
                          string (a Secret key). Required.
                        properties:
                          key:
                            description: |-
                              key is the key within the Secret's data map whose value is the credential
                              to inject into the gateway, e.g. "api-key". Required.
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the Kubernetes Secret
                              resource. Required.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      encryption:
                        description: |-
                          encryption configures envelope encryption of the stored tokens (Axis B). When
                          unset the plane refuses to store plaintext — a Postgres backend MUST have a KEK.
                        properties:
                          kmsV2:
                            description: |-
                              kmsV2 points at a Kubernetes KMS v2 provider (generic; single-key per plugin — KEK
                              custody + rotation, but NOT per-tenant crypto-shred).
                            properties:
                              endpoint:
                                description: |-
                                  endpoint is the KMS v2 gRPC endpoint (typically a unix socket, e.g.
                                  unix:///var/run/kms/socket). Required.
                                minLength: 1
                                type: string
                              keyIDPrefix:
                                description: |-
                                  keyIDPrefix derives the per-tenant KEK id (keyID = <prefix><tenant>) so tenant
                                  deletion is a KEK-destroy (crypto-shredding). Empty ⇒ a single install-wide key.
                                type: string
                            required:
                            - endpoint
                            type: object
                          localKEKSecretRef:
                            description: |-
                              localKEKSecretRef locates a 32-byte AES-256 master KEK (a Secret + key); per-tenant
                              keys are HMAC-derived. Encryption-at-rest but NOT true crypto-shred (dev/default).
                            properties:
                              key:
                                description: |-
                                  key is the key within the Secret's data map whose value is the credential
                                  to inject into the gateway, e.g. "api-key". Required.
                                minLength: 1
                                type: string
                              name:
                                description: name is the name of the Kubernetes Secret
                                  resource. Required.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          openBaoTransit:
                            description: |-
                              openBaoTransit wraps DEKs with a named per-tenant OpenBao transit key — the KEK never
                              leaves OpenBao, and crypto-shred = delete the transit key (the reference scale custodian).
                            properties:
                              address:
                                description: address is the OpenBao/Vault API base
                                  URL (e.g. https://openbao.cred.svc:8200).
                                minLength: 1
                                type: string
                              caSecretRef:
                                description: caSecretRef optionally verifies the OpenBao
                                  server cert (a Secret + key).
                                properties:
                                  key:
                                    description: |-
                                      key is the key within the Secret's data map whose value is the credential
                                      to inject into the gateway, e.g. "api-key". Required.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Kubernetes
                                      Secret resource. Required.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                              keyPrefix:
                                description: keyPrefix derives the per-tenant transit
                                  key name (<keyPrefix><tenant>).
                                type: string
                              mountPath:
                                description: mountPath is the transit engine mount.
                                  Empty ⇒ "transit".
                                type: string
                              tokenSecretRef:
                                description: tokenSecretRef locates the OpenBao token
                                  the token-service authenticates with.
                                properties:
                                  key:
                                    description: |-
                                      key is the key within the Secret's data map whose value is the credential
                                      to inject into the gateway, e.g. "api-key". Required.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: name is the name of the Kubernetes
                                      Secret resource. Required.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - address
                            - tokenSecretRef
                            type: object
                        type: object
                        x-kubernetes-validations:
                        - message: exactly one KEK custodian (localKEKSecretRef, openBaoTransit,
                            or kmsV2) must be set
                          rule: '[has(self.localKEKSecretRef), has(self.openBaoTransit),
