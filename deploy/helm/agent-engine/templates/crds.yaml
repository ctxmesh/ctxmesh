                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          memory is the memory resource request for the agent container, e.g. "256Mi".
                          Maps to resources.requests.memory on the Knative Service container.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
