                                to redact. Applied to every sensitive payload attribute's value; each match
                                is replaced by the detector's marker.
                              maxLength: 256
                              minLength: 1
                              type: string
                          required:
                          - name
                          - pattern
                          type: object
                        maxItems: 16
                        type: array
