            - embeddingRoute
            - source
            type: object
            x-kubernetes-validations:
            - message: 'embeddingRoute is immutable after creation (one-way door #1,
                ADR 0061): changing the embedding model requires a full re-ingest
                — delete and recreate the KnowledgeBase'
