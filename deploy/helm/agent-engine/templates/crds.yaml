apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: alertpolicies.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    categories:
    - agents
    kind: AlertPolicy
    listKind: AlertPolicyList
    plural: alertpolicies
    shortNames:
    - ap
    singular: alertpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          AlertPolicy defines a set of threshold rules that fire notifications to console or webhook channels
          when any AgentDeployment metric (errorRate, p95Latency, budget, forecast, regression, runFailureRate)
          breaches its threshold. This is the M70 alerting-plane CRD (ADR 0063 D2). Detection and routing
          only — actuation (auto-rollback) is a separate controller path (ADR 0063 D4, deferred).

          It is a SINGLE-version CRD born directly in v1beta1 — no v1alpha1 history, no conversion webhook
          (the KnowledgeBase precedent).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: AlertPolicySpec defines the desired state of an AlertPolicy
              (M70, ADR 0063 D2).
            properties:
              conditions:
                description: |-
                  conditions is the list of threshold rules. The policy fires when ANY condition is breached.
                  At least one condition is required.
                items:
                  description: AlertCondition defines a single threshold rule. The
                    policy fires when any condition is breached.
                  properties:
                    name:
                      description: |-
                        name is a stable identifier for this condition; it keys the per-condition status in
                        AlertPolicyStatus.conditions.
                      type: string
                    threshold:
                      description: |-
                        threshold is the numeric firing threshold; semantics depend on type:
                          errorRate / runFailureRate — fraction 0..1 (e.g. "0.05" = 5 %)
                          p95Latency                 — milliseconds (e.g. "500")
                          budgetSoft                 — fraction-of-budget 0..1 (e.g. "0.8" = 80 % consumed)
                          forecastExceeded           — USD (e.g. "10.00")
                          regressionDetected         — ignored (event-driven; the RegressionDetected condition on the
                                                       AgentDeployment triggers this regardless of a numeric threshold)
                          approvalWaiting            — ignored (event-driven, per-RUN; the condition merely opts the
                                                       selected agents into HITL approval-waiting notifications — a run
                                                       pausing on plan_approval fires a per-run alert, ADR 0069 §3)

                        SLO taxonomy — PINNED, do NOT redefine (M84, ADR 0076):
                          errorRate  is the 5xx fraction (server errors ÷ all responses) at the Knative edge, aggregated
                                     PER AGENT across its revisions, measured over `window`. 4xx responses — INCLUDING the
                                     typed guardrail / approval-required / tool-denial denials, which are 4xx on the outbound
                                     model hop, not inbound 5xx — are NOT availability errors and are excluded by construction.
                                     errorRate is FOREVER a plain 5xx fraction over `window`; multi-window burn-rate is a
                                     future ADDITIVE `burnRate` condition type, never a mutation of this semantic.
                          p95Latency is the p95 request latency in MILLISECONDS at the Knative edge (queue-proxy), per agent.
                                     It measures total response duration; a streaming-TTFB variant is a future condition, not
                                     a redefinition of this one.
                          Both read Knative queue-proxy per-revision request metrics via Prometheus; when Prometheus is not
                          wired (or the metrics are absent) they ABSTAIN — a clear status reason, never a false alert.

                        Stored as a string to carry rates/ms/USD uniformly without lossy float conversion.
                      type: string
                    type:
                      description: type selects the condition kind.
                      enum:
                      - errorRate
                      - p95Latency
                      - budgetSoft
                      - forecastExceeded
                      - regressionDetected
                      - runFailureRate
                      - approvalWaiting
                      type: string
                    window:
                      description: |-
                        window is the evaluation look-back window (e.g. "5m", "1h"). Ignored by regressionDetected and
                        approvalWaiting (both event-driven, not window-based).
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
              route:
                description: route describes where fired alerts are delivered.
                properties:
                  channels:
                    description: channels is the list of notification destinations.
                      At least one is required.
                    items:
                      description: AlertChannel describes a single notification destination.
                      properties:
                        email:
                          description: |-
                            email configures SMTP delivery to the named recipients. Required when type=email; ignored
                            otherwise. The SMTP TRANSPORT (host/port/from/credentials) is platform config on the controller
                            (SMTP_HOST / SMTP_PORT / SMTP_FROM / SMTP_USERNAME / SMTP_PASSWORD); an unconfigured relay skips
                            the dispatch (logged), never wedging alerting — the same fail-safe posture as a bad webhook.
                          properties:
                            subject:
                              description: subject optionally overrides the default
                                alert subject line.
                              type: string
                            to:
                              description: to is the list of recipient email addresses
                                (at least one).
                              items:
                                type: string
                              minItems: 1
                              type: array
                          required:
                          - to
                          type: object
                        type:
                          description: |-
                            type selects the channel kind.
                              webhook — external POST, signed with the HMAC key from secretRef.
                              console — the durable console alert feed (cpDB alert_events table).
                              email   — SMTP delivery to the named recipients via the platform relay (M132).
                          enum:
                          - webhook
                          - console
                          - email
                          type: string
                        webhook:
                          description: webhook configures the external POST endpoint.
                            Required when type=webhook; ignored otherwise.
                          properties:
                            secretRef:
                              description: |-
                                secretRef names a Secret (in the same namespace as the AlertPolicy) that holds the
                                HMAC signing key under the key "signingKey". The controller (trusted SA) reads this
                                Secret to sign outbound payloads; the BFF never reads it (ADR 0011).
                              type: string
                            url:
                              description: url is the HTTPS endpoint that receives
                                the signed alert POST.
                              type: string
                          required:
                          - url
                          type: object
                      required:
                      - type
                      type: object
                    minItems: 1
                    type: array
                required:
                - channels
                type: object
              selector:
                description: |-
                  selector picks the AgentDeployments this policy watches. An empty selector matches all
                  AgentDeployments in the same namespace.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: matchLabels selects AgentDeployments whose labels
                      match all of the specified key/value pairs.
                    type: object
                  names:
                    description: names lists explicit AgentDeployment names to watch.
                      Takes union with matchLabels.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - conditions
            - route
            type: object
          status:
            description: |-
              AlertPolicyStatus defines the observed state of an AlertPolicy. Populated by the reconciler
              (m70.4 evaluation, not this skeleton task m70.3).
            properties:
              conditions:
                description: |-
                  conditions is the STANDARD status-condition list (Ready, ...) that kubectl wait / kstatus / GitOps
                  health read (ADR 0100/M127). Ready reflects the policy is admitted + evaluating.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation most recently
                  reconciled.
                format: int64
                type: integer
              ruleStates:
                description: |-
                  ruleStates reflects the per-spec-condition firing state, keyed by AlertCondition.name. (This was
                  status.conditions pre-GA — moved off the conventional path, ADR 0100/M127.)
                items:
                  description: |-
                    AlertRuleState records the per-condition firing state, stamped by the reconciler each evaluation
                    cycle (m70.4; renamed from AlertConditionStatus at GA Gate D, ADR 0100/M127, to free the conventional
                    status.conditions path for the standard []metav1.Condition below). The name matches AlertCondition.name.
                  properties:
                    firing:
                      description: firing is true when the condition is currently
                        breached.
                      type: boolean
                    lastNotifiedTime:
                      description: lastNotifiedTime is when the most recent alert
                        notification was sent for this condition.
                      format: date-time
                      type: string
                    lastTransitionTime:
                      description: lastTransitionTime is when the Firing field last
                        changed.
                      format: date-time
                      type: string
                    lastValue:
                      description: lastValue is the most recent evaluated metric value
                        (string, same encoding as Threshold).
                      type: string
                    name:
                      description: name matches the AlertCondition.name this status
                        entry corresponds to.
                      type: string
                  required:
                  - firing
                  - name
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
