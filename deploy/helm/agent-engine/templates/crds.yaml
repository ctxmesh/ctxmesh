                                type: string
                              name:
                                description: name is the name of the Kubernetes Secret
                                  resource. Required.
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                          clientTLSSecretName:
                            description: |-
                              clientTLSSecretName names a kubernetes.io/tls Secret providing tls.crt + tls.key —
                              the client cert the token-service presents to the provider. Required.
                            minLength: 1
                            type: string
                        required:
                        - caSecretRef
                        - clientTLSSecretName
                        type: object
                    required:
                    - endpoint
                    type: object
                type: object
                x-kubernetes-validations:
                - message: exactly one provider (kubernetes, postgres, openbao, remote)
                    must be set
                  rule: '[has(self.kubernetes), has(self.postgres), has(self.openbao),
                    has(self.remote)].filter(x, x).size() == 1'
