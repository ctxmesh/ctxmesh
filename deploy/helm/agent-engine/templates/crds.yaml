                  memberNamespaces is the count of namespaces actually reconciled for this
                  tenant (contested namespaces are excluded).
                format: int32
                type: integer
              observedGeneration:
                description: |-
                  observedGeneration is the .metadata.generation this status reflects — set by the
                  controller each reconcile so kstatus / `kubectl get -o` can detect a stale status.
                format: int64
                type: integer
              totalCorpusBytes:
                description: |-
                  totalCorpusBytes is the sum of KnowledgeBase.status.sizeBytes across all member
                  namespaces, updated on every reconcile when EITHER storage.corpusBytesSoftCap or
                  storage.corpusBytesHardCap is set. Reported for observability and the hard-cap check.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: workflows.agents.ctxmesh.ai
spec:
  group: agents.ctxmesh.ai
  names:
    categories:
    - agents
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    shortNames:
    - wf
    singular: workflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.registryRef
      name: Registry
      type: string
    - jsonPath: .spec.steps[*]
      name: Steps
      priority: 1
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Validated')].status
      name: Validated
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          Workflow is a namespaced, declarative graph of agent invocations — conditional / loop / map control flow
          over prior node outputs, evaluated deterministically in Go (never by a model) (M67, ADR 0060). The
          controller VALIDATES it (structure + CEL + the referenced-output⇒outputSchema rule + registry membership)
          and reports Validated/Invalid on status; it does NO execution. A workflow INSTANCE is a durable Run with a
          workflowRef (instances-of-record live in Postgres, not etcd), run by the executor-in-the-worker (later tasks).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              WorkflowSpec defines the desired state of a Workflow (ADR 0060): a graph of agent invocations with CEL
              data flow + conditional/loop/map control flow, all under a registry trust boundary.
            properties:
              budget:
                description: |-
                  budget bounds the workflow's total node launches (reuses the AgentTeam SpawnBudget shape). A nil
                  block resolves to all defaults in the controller / registry.
                properties:
                  maxFanOut:
                    default: 4
                    description: maxFanOut is the maximum number of sub-runs a single
                      supervisor step may start. Defaults to 4.
                    format: int32
                    minimum: 1
                    type: integer
                  maxSpawnDepth:
                    default: 3
                    description: |-
                      maxSpawnDepth is the maximum depth of the spawn tree (supervisor -> sub-agent -> ...), distinct
                      from A2A hop depth. Defaults to 3.
                    format: int32
                    minimum: 1
                    type: integer
                  maxTotalSpawns:
                    default: 20
                    description: |-
                      maxTotalSpawns is the maximum number of sub-runs across the whole spawn tree of one root run.
                      Defaults to 20.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              inputSchema:
                description: |-
                  inputSchema is the workflow's typed input as a JSON Schema (stored verbatim, preserve-unknown; the
                  M65 pattern). It types the `input` CEL variable. Optional (an untyped workflow input is a dynamic
                  map).
                type: object
                x-kubernetes-preserve-unknown-fields: true
              registryRef:
                description: |-
                  registryRef is the name of the AgentRegistry (same namespace) that is this workflow's trust boundary
                  (like AgentTeam): every step's agentRef MUST be a member of it. Sub-runs inherit it as their
                  Boundary. The registry is REFERENCED, never generated.
                maxLength: 63
                minLength: 1
                pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                type: string
              steps:
                description: |-
                  steps are the graph nodes. At least one; names are unique (listMapKey). The first step is the
                  default start (a determinable start is a validation rule).
                items:
                  description: |-
                    WorkflowStep is one node of the graph: an invocation of a standing AgentDeployment (agentRef) with CEL
                    input bindings, a typed output contract, and exactly one control-flow construct (next | branches | map |
                    loop). A node = a real agent sub-run at execution time (ADR 0060), so M65 structured outputs + M66
                    guardrails apply per-node with no new code.
                  properties:
                    agentRef:
                      description: |-
                        agentRef is the name of a standing AgentDeployment (same namespace) this node invokes as a sub-run.
                        It MUST be a member of the workflow's registryRef (the trust boundary, like AgentTeam).
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                      type: string
                    branches:
                      description: |-
                        branches are ordered conditional edges (the first matching `when` wins); `default` is the
                        fallthrough. Set instead of `next` for a conditional node.
                      items:
                        description: |-
                          WorkflowBranch is one ordered conditional edge of a step: when the CEL predicate `when` evaluates true
                          (over `input` + prior steps' outputs), control transfers to step `to`. Branches are evaluated in order;
                          the step's `default` is the fallthrough when none match.
                        properties:
                          to:
                            description: to is the name of the step to run when `when`
                              is true. It MUST reference an existing step.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                            type: string
                          when:
                            description: |-
                              when is a CEL boolean predicate over `input` (the workflow input) and `steps.<name>.output` for
                              prior steps. It is compiled + type-checked by the controller (ADR 0060). A step whose output is
                              referenced here MUST pin an outputSchema (the load-bearing rule).
                            maxLength: 4096
                            minLength: 1
                            type: string
                        required:
                        - to
                        - when
                        type: object
                      maxItems: 64
                      type: array
                      x-kubernetes-list-type: atomic
                    catch:
                      description: |-
                        catch is an ORDERED list of error-class catchers (M138, ADR 0109 §3): the first catcher whose
                        `errors` contains the node's classified failure code (or "*") routes to its `next` handler, which
                        binds the failure as the `error` CEL variable. Evaluated only after retries exhaust; no match ⇒
                        fail-fast. Routes on the CLASSIFIED code, never the free-text message. Not supported on map/loop nodes.
                      items:
                        description: |-
                          WorkflowCatch is one ordered error-class catcher of a step (M138, ADR 0109 §3 — AWS Step Functions
                          `Catch`/`ErrorEquals`): when the step's sub-run FAILS (after retries) with a failure code IN `errors`,
                          control transfers to step `next` (the handler), which binds the failure as the `error` CEL variable
                          (`{node, message, type}`). Catchers are evaluated in ORDER, FIRST match wins; `"*"` is the catch-all.
                          The single `onError: <step>` is sugar for `catch: [{errors: ["*"], next: <step>}]`.
                        properties:
                          errors:
                            description: |-
                              errors is the set of failure CODES this catcher matches — the closed platform vocabulary
                              (timeout, cancelled, budget_exceeded, guardrail_denied, tool_error, agent_error, platform_error)
                              or the wildcard "*" (all). Matching is on the CLASSIFIED code, never the free-text message.
                            items:
                              type: string
                            minItems: 1
                            type: array
                          next:
                            description: next is the handler step to run when a matching
                              failure occurs. It MUST reference an existing step.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                            type: string
                        required:
                        - errors
                        - next
                        type: object
                      type: array
                    default:
                      description: |-
                        default is the fallthrough step when no branch's `when` matches. Only meaningful with `branches`;
                        "" = terminal on fallthrough. It MUST reference an existing step when set.
                      maxLength: 63
                      pattern: ^([a-z0-9]([a-z0-9\-]*[a-z0-9])?)?$
                      type: string
                    input:
                      additionalProperties:
                        type: string
                      description: |-
                        input maps each node-input key to a CEL expression over `input` (the workflow input) + prior steps'
                        outputs (e.g. "steps.classify.output.topic"). Explicit data flow — there is no implicit
                        previous-feeds-next. Each value is compiled by the controller; a referenced step must pin an
                        outputSchema.
                      type: object
                    loop:
                      description: loop makes this a loop node (defined here; executed
                        v1b). Set instead of next/branches.
                      properties:
                        do:
                          description: do is the step run each iteration. It MUST
                            reference an existing step.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                          type: string
                        maxIterations:
                          description: |-
                            maxIterations caps the loop (required, > 0) so the workflow cannot loop forever. The spawn budget
                            backstops the total.
                          format: int32
                          minimum: 1
                          type: integer
                        until:
                          description: until is a CEL boolean predicate over `input`
                            + prior/iteration outputs. When true the loop exits.
                          maxLength: 4096
                          minLength: 1
                          type: string
                      required:
                      - do
                      - maxIterations
                      - until
                      type: object
                    map:
                      description: mapNode makes this a map/fan-out node (defined
                        here; executed v1b). Set instead of next/branches.
                      properties:
                        as:
                          description: as is the loop-variable name each list element
                            is bound to for the `do` step's input bindings.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                          type: string
                        completion:
                          default: all
                          description: |-
                            completion is the outcome-aware wake mode for the fan-out (ADR 0075 §1). `all` (the default) is a
                            fail-fast join: it collects EVERY item's output on full success but cancels the surviving siblings
                            and fails the map the moment the FIRST item fails/cancels (same OUTCOME as before — fail on any
                            failure, collect all on success — only earlier + with sibling-cancel). `any` returns the FIRST
                            SUCCESSFUL item's output as the map's output (cancelling the still-running siblings), and fails the
                            map only if EVERY item fails/cancels (exhaustion).
                          enum:
                          - all
                          - any
                          type: string
                        do:
                          description: do is the step run per list element. It MUST
                            reference an existing step.
                          maxLength: 63
                          minLength: 1
                          pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                          type: string
                        join:
                          description: |-
                            join is an optional reduction step that consumes the collected `do` outputs. When set it MUST
                            reference an existing step.
                          maxLength: 63
                          pattern: ^([a-z0-9]([a-z0-9\-]*[a-z0-9])?)?$
                          type: string
                        over:
                          description: over is a CEL expression yielding the list
                            to fan out over (typically `steps.<name>.output.items`).
                          maxLength: 4096
                          minLength: 1
                          type: string
                        parallelism:
                          default: 1
                          description: |-
                            parallelism bounds how many `do` invocations run concurrently. Minimum 1 (bounded fan-out; the
                            spawn budget backstops the total). Defaults to 1.
                          format: int32
                          minimum: 1
                          type: integer
                      required:
                      - as
                      - do
                      - over
                      type: object
                    name:
                      description: |-
                        name is the step's identifier, unique within the workflow (listMapKey). CEL references it as
                        `steps.<name>.output`.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([a-z0-9\-]*[a-z0-9])?$
                      type: string
                    next:
                      description: |-
                        next is the unconditional next step ("" = terminal). Exactly one of next / branches / map / loop is
                        set on a step (validated by the controller, not by admission).
                      maxLength: 63
                      pattern: ^([a-z0-9]([a-z0-9\-]*[a-z0-9])?)?$
                      type: string
                    onError:
                      description: |-
                        onError names a handler step this node routes to if its sub-run FAILS after exhausting its retry
                        budget — the workflow continues at the handler instead of fail-fasting (AWS Step Functions Catch /
                        Temporal). Empty ⇒ fail-fast (the default). The handler must be an existing step; it runs like any
                        node. Not supported on map/loop nodes. onError is sugar for a single catch-all `catch` clause; when
                        both are set, onError is the trailing catch-all after the ordered `catch` list.
                      maxLength: 63
                      pattern: ^([a-z0-9]([a-z0-9\-]*[a-z0-9])?)?$
                      type: string
                    outputSchema:
                      description: |-
                        outputSchema is the node's expected typed output as a JSON Schema (stored verbatim, preserve-unknown;
                        the M65 pattern). It is REQUIRED whenever this node's output is referenced by another step's
                        `when` / `input` / `map.over` — CEL over a typed object, not free text (the ADR 0060 load-bearing
                        rule). Optional for a terminal/unreferenced node.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    retries:
                      default: 0
                      description: |-
                        retries is the per-node retry count (a retry = a new iteration index at execution time; executed in
                        v1b). Defaults to 0.
                      format: int32
                      minimum: 0
                      type: integer
                  required:
                  - agentRef
                  - name
                  type: object
                maxItems: 128
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
            required:
            - registryRef
            - steps
            type: object
          status:
            description: WorkflowStatus defines the observed state of a Workflow.
              Populated by the m67.1 controller (validate-only).
            properties:
              conditions:
                description: |-
                  conditions reflect the validation state. Validated=True means the graph is structurally sound, every
                  CEL expression compiles, every referenced step pins an outputSchema, and registryRef + every step's
                  agentRef resolve to registry members. Validated=False (an Invalid result) carries the reason + message.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the .metadata.generation that was
                  last fully reconciled.
                format: int64
                type: integer
              specHash:
                description: |-
                  specHash is the hash of the validated spec, updated on every successful reconcile — drift detection
                  without full field comparison (the pinned-snapshot pattern; the executor pins this at instance
                  creation).
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
