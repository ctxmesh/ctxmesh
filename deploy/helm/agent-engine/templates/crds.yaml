    plural: agentversions
    singular: agentversion
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.deploymentName
      name: Deployment
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    deprecated: true
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          AgentVersion is the Schema for the agentversions API.
          Each AgentVersion is an immutable, controller-created snapshot of an
          AgentDeployment's spec at a specific point in time. Immutability is enforced
          by a CRD-level CEL rule — no webhook is required. AgentVersions are
          owner-referenced to their parent AgentDeployment and garbage collected
          automatically when the deployment is deleted.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec holds the immutable snapshot of the AgentDeployment
              spec.
            properties:
              deploymentName:
                description: |-
                  deploymentName is the name of the parent AgentDeployment this version
                  was snapshotted from.
                minLength: 1
                type: string
              snapshot:
                description: |-
                  snapshot is a verbatim copy of the AgentDeploymentSpec at the time this
                  AgentVersion was created. It is used by the controller to drive the
                  Knative Service template and is never modified after creation.
                properties:
                  allowedCallers:
                    description: |-
                      allowedCallers is the per-agent inbound allowlist (PRD §12.4 layer 3):
                      the names of peer agents permitted to call this agent over A2A. The
                      controller comma-joins it into the static AGENT_ALLOWED_CALLERS env var;
                      the callee's launcher rejects a caller not on the list with a typed
                      caller_not_allowed error. An empty/omitted list means the launcher applies
                      its default policy (registry-membership check only). Bounded at 64 entries
                      of at most 63 characters each (DNS-label-sized agent names).
                    items:
                      maxLength: 63
                      minLength: 1
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  approvalPolicyRef:
                    description: |-
                      approvalPolicyRef optionally names an ApprovalPolicy (same namespace) that declaratively requires
                      human approval for named tool calls (and optionally narrows who may approve) — M139, ADR 0111. The
                      controller merges its require-approval requirements into this agent's effective tool policy
                      (reusing the pause/resume/voucher runtime); a dangling ref sets a NotReady condition on the agent.
