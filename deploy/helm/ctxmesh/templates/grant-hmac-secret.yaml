{{- /*
The MCP grant HMAC key as a Secret (ADR 0154): the BFF and the run-worker read MCP_GRANT_HMAC_KEY from
it, never from a literal in their Deployment specs. Rendered from bff.mcp.grantHmacKey; with
bff.mcp.grantHmacKeySecret the operator owns the Secret and the chart renders nothing.
Hand-maintained (not generated), so it is outside the no-drift diff, which renders neither value.
*/ -}}
{{- if and .Values.bff.mcp.grantHmacKey .Values.bff.mcp.grantHmacKeySecret }}
{{- fail "\n\nset bff.mcp.grantHmacKey or bff.mcp.grantHmacKeySecret, not both: the BFF reads one Secret, and the other key would be ignored.\n" }}
{{- end }}
{{- if and .Values.bff.mcp.grantHmacKey (not .Values.bff.mcp.grantHmacKeySecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: ctxmesh-grant-hmac
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/component: bff
type: Opaque
stringData:
  MCP_GRANT_HMAC_KEY: {{ .Values.bff.mcp.grantHmacKey | quote }}
{{- end }}
