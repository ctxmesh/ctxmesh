{{- /*
Persistent in-cluster state layer (M48, ADR 0047) — OPT-IN, Helm-only.

Not part of config/default (kustomize), so with the default (persistence.enabled:false) NOTHING renders
and `helm template` still matches `kustomize build config/default` (helm-verify no-drift). It is the
in-cluster DURABLE alternative to the ephemeral devDataPlane Valkey (which lives under
devDataPlane.enabled): a StatefulSet + PVC + AOF Valkey whose memory survives a pod restart/reschedule.

Enable it TOGETHER with devDataPlane.enabled=false — running both would collide on the
`control-plane: statelayer` pod selector, so the chart fails loudly below. Because the statelayer Service
is bundled under devDataPlane, this template renders its OWN `ctxmesh-statelayer` Service (the
address MEMORY_BACKEND_ADDR / TENANT_QUOTA_ADDR expect) so agents can still reach it.
*/ -}}
{{- if .Values.statelayer.persistence.enabled }}
{{- if .Values.devDataPlane.enabled }}
{{- fail "statelayer.persistence.enabled and devDataPlane.enabled are mutually exclusive: set devDataPlane.enabled=false when enabling the persistent state layer (both would fight over the control-plane:statelayer pods). Migrating from the dev Deployment discards its ephemeral emptyDir data — see ADR 0047." }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: ctxmesh-statelayer
  namespace: {{ .Values.namespace }}
  labels:
    control-plane: statelayer
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - name: valkey
      port: 6379
      protocol: TCP
      targetPort: 6379
  selector:
    control-plane: statelayer
    app.kubernetes.io/name: ctxmesh
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statelayer
  namespace: {{ .Values.namespace }}
  labels:
    control-plane: statelayer
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: Helm
spec:
  serviceName: ctxmesh-statelayer
  replicas: 1
  selector:
    matchLabels:
      control-plane: statelayer
      app.kubernetes.io/name: ctxmesh
  template:
    metadata:
      labels:
        control-plane: statelayer
        app.kubernetes.io/name: ctxmesh
    spec:
      securityContext:
        # valkey runs as uid/gid 1000; fsGroup makes the PVC writable to it.
        fsGroup: 1000
      initContainers:
        # AOF-check (ADR 0047): a torn multi-part AOF after an unclean crash fails LOUD here (the init
        # exits non-zero → the pod is visibly stuck), not as silent data loss on Valkey start. On a fresh
        # volume (no manifest) it is a no-op.
        - name: aof-check
          image: valkey/valkey:8.1.3
          command:
            - sh
            - -c
            - |
              m=/data/appendonlydir/appendonly.aof.manifest
              if [ -f "$m" ]; then valkey-check-aof --fix "$m"; fi
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3
          args:
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          ports:
            - name: valkey
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: {{ .Values.statelayer.persistence.cpuLimit | quote }}
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.statelayer.persistence.storageClassName }}
        storageClassName: {{ .Values.statelayer.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.statelayer.persistence.size | quote }}
{{- end }}
