{{- /*
GA Gate A preflight (M124, ADR 0095) — a post-install/upgrade Helm hook that runs `bff -preflight` to
validate the install is COHERENTLY configured and FAIL LOUD (a failed hook, a clear message) on any
misconfiguration, instead of the platform silently degrading at runtime (a missing citation, a
queued-forever workflow, a per-user credential silently downgraded to a shared one — the GA audit's
"correct-when-configured, silent-when-not" theme).

Hand-maintained (not gen_helm_chart-generated), so it is NOT part of the helm-template==kustomize
no-drift diff (which covers only crds/control-plane/dev-data-plane/bff). It reuses the bff image + SA;
its env MIRRORS the control-plane OBO/KB/cost config so the check sees exactly what the platform sees.
Gate with `preflight.enabled=false` to skip (e.g. a BYO-everything operator running their own checks).
*/ -}}
{{- if .Values.preflight.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ctxmesh-preflight
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/component: preflight
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ctxmesh
        app.kubernetes.io/component: preflight
        # control-plane is what the datastore NetworkPolicies admit
        # (`control-plane: Exists`), and this Job's whole purpose is to reach the
        # datastores. Without the label the policy denied it, so a stock `helm install`
        # failed its OWN preflight on any cluster that enforces NetworkPolicy — every
        # time, with an i/o timeout that reads like the database is down.
        #
        # Nothing in the repo could see it: this Job is a chart-only helm hook, so the
        # kustomize dev path never runs it, and every other test installs from
        # config/. M154's install-from-artifacts slice ran it on a fresh cluster and
        # it failed on the first try.
        control-plane: preflight
    spec:
      restartPolicy: Never
      serviceAccountName: ctxmesh-bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: preflight
          image: {{ printf "%s:%s" .Values.bff.image.repository (.Values.bff.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: IfNotPresent
          args: ["-preflight"]
          env:
            # Mirror the control-plane OBO/KB/cost config so the check validates what the platform runs.
            # NB: MCP_CAPABILITY_PUBLIC_KEY is NOT set here explicitly — it comes from envFrom bff-capability
            # (the keygen hook's Secret). An explicit env entry would SHADOW envFrom and false the
            # keypair-coherence check.
            - name: MCP_OBO_EGRESS_ENABLED
              value: {{ .Values.controllerManager.oboEgress.enabled | quote }}
            - name: EGRESS_SIDECAR_IMAGE
              value: {{ .Values.controllerManager.oboEgress.sidecarImage | default "" | quote }}
            - name: MCP_CREDENTIAL_NAMESPACE
              value: {{ .Values.bff.mcp.credentialNamespace | default .Values.namespace }}
            - name: TOKEN_SERVICE_URL
              value: {{ .Values.controllerManager.oboEgress.tokenServiceURL | default (printf "%s://ctxmesh-token-service.%s.svc:8443" (ternary "https" "http" .Values.tokenService.tls.required) .Values.namespace) }}
            - name: COST_ROLLUP_ENABLED
              value: {{ .Values.bff.costRollupEnabled | quote }}
          # CONTROLPLANE_DSN (pinged) + the capability keypair (MCP_CAPABILITY_PRIVATE/PUBLIC_KEY, coherence
          # check) come from the bff-capability + bff-adapters Secrets the BFF reads; optional so
          # `helm template` renders before they exist.
          envFrom:
            # M148 hardening (close gate a, finding B1): the preflight Job is the install's
            # OWN gate, and it could not see the database M148 added. internal/preflight
            # only pings when ControlPlaneDSN is non-empty, and the DSN is not in the
            # required set — so with it absent the ping was SKIPPED and the job logged
            # "preflight OK". An operator with a wrong password got a green post-install
            # hook, a successful `helm install`, and then three CrashLooping components.
            # A probe that cannot fail is worse than no probe.
            - secretRef:
                name: ctxmesh-postgres-dsn
                optional: true
            - secretRef:
                name: bff-adapters
                optional: true
            - secretRef:
                name: bff-capability
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
{{- end }}
