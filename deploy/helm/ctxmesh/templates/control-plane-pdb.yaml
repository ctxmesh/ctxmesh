{{- /*
Control-plane PodDisruptionBudget (m34.5, ADR 0037) — OPT-IN, Helm-only.

Not part of config/default (kustomize), so with the default (enabled:false) NOTHING renders and
`helm template` still matches `kustomize build config/default` (helm-verify no-drift). Enable it
together with controllerManager.replicas>1 so a voluntary disruption (node drain, cluster upgrade)
can never evict every controller-manager at once — leader-election always has a surviving pod.
*/ -}}
{{- if .Values.controllerManager.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: controller-manager
  namespace: {{ .Values.namespace }}
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/managed-by: Helm
spec:
  minAvailable: {{ .Values.controllerManager.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: ctxmesh
{{- end }}
