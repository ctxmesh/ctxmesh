{{- /*
Durable run-worker (ADR 0034 / ADR 0051, M55) — OPT-IN, Helm-only.

Not part of config/default (kustomize), so with the default (bff.runStore.enabled=false)
NOTHING renders and `helm template` still matches `kustomize build config/default`
(helm-verify no-drift). Enable it (with an operator-provided run-store DSN Secret + the
BFF dispatch env, gen_helm_chart) so the BFF can scale replicas>1: this separate
Deployment claims + executes queued runs against the Postgres store, decoupled from any
BFF replica. KEDA scales it on the queued-run backlog. Mirrors config/run-worker/.
*/ -}}
{{- if .Values.bff.runStore.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: run-worker
  namespace: {{ .Values.namespace }}
  labels:
    control-plane: run-worker
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/component: run-worker
    app.kubernetes.io/managed-by: Helm
spec:
  # Warm floor: seed the Deployment at the worker's minReplicaCount so at least that many
  # workers claim runs from t=0 — before KEDA's HPA reconciles, and even if KEDA is absent
  # (otherwise a fresh durable-path install queues runs forever). KEDA (the ScaledObject
  # below) then scales ABOVE the floor on the queued-run backlog. Default floor is 1 (any
  # durable-path install gets a live worker — Gate A / ADR 0095 dec-3); the production
  # overlay raises it to 2 (a warm pool, ADR 0051 Fork-C); set worker.minReplicaCount=0 to
  # opt back into scale-to-zero.
  replicas: {{ .Values.bff.runStore.worker.minReplicaCount }}
  selector:
    matchLabels:
      control-plane: run-worker
      app.kubernetes.io/name: ctxmesh
  template:
    metadata:
      labels:
        control-plane: run-worker
        app.kubernetes.io/name: ctxmesh
    spec:
      serviceAccountName: ctxmesh-bff
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: run-worker
          # The run-worker IS the bff binary in worker mode (RUN_WORKER_CONCURRENCY>0), so it must use
          # the SAME overridable image as the BFF. A hardcoded `bff:latest` here (this template is
          # hand-maintained, so it never got gen_helm_chart's image→value rewrite) ErrImagePull's on any
          # real registry — and `profile: production` REQUIRES this Deployment (runStore.enabled), so the
          # documented prod path was dead-on-arrival (GA audit Ops P0-1, M124/Gate A).
          image: {{ printf "%s:%s" .Values.bff.image.repository (.Values.bff.image.tag | default .Chart.AppVersion) }}
          imagePullPolicy: IfNotPresent
          env:
            # M148 hardening (close gate a, finding B3). The run-worker runs the SAME bff
            # binary and EXECUTES ingestion runs (internal/bff/run_worker.go: if
            # rn.IsIngestionJob() { s.executeIngestion(...) }), and profile=production
            # makes it mandatory. M148 measured a 582Mi ingestion peak and raised the BFF
            # to 1Gi — but in the durable configuration that identical work ran here, in a
            # 256Mi container, with no soft limit. Production would have got the OOMKill
            # the milestone believed it had fixed, at a LOWER ceiling than the one that
            # failed.
            - name: CONTAINER_MEMORY_LIMIT_BYTES
              valueFrom:
                resourceFieldRef:
                  containerName: run-worker
                  resource: limits.memory
                  divisor: "1"
            # RUN_STORE_DSN is deliberately NOT an explicit env entry — see the envFrom
            # comment below. It arrives with CONTROLPLANE_DSN from the chart-owned Secret,
            # which is what lets ADR 0130's override order apply to it at all.
            # Workers EXECUTE runs (concurrency>0 starts the claim-loop pool). Dispatch
            # is OFF here — the front-end BFF is what dispatches (RUN_WORKER_DISPATCH).
            - name: RUN_WORKER_CONCURRENCY
              value: {{ .Values.bff.runStore.worker.concurrency | quote }}
            # MCP_OBO_REQUIRED (M124/Gate A, ADR 0095 §2): the worker re-mints run capabilities, so it
            # fails CLOSED the same as the BFF — when OBO egress is enabled but the capability seed is
            # absent, refuse to start rather than let sub-runs silently use the shared org/public credential.
            - name: MCP_OBO_REQUIRED
              value: {{ .Values.controllerManager.oboEgress.enabled | quote }}
          envFrom:
            # M148 hardening (close gate a, finding A1). This Deployment used to take
            # RUN_STORE_DSN from an explicit `env` secretKeyRef onto a `run-store` Secret
            # that NO chart path creates — and an explicit env beats every envFrom entry,
            # so it also shadowed the chart-owned DSN. With no `optional: true` the kubelet
            # could not build the container config at all (CreateContainerConfigError), so
            # the pod never started and never logged a cause. profile=production makes this
            # Deployment mandatory, so the documented production install was dead on
            # arrival — the exact bug M148 exists to fix, restated for a second Secret.
            #
            # This template is HAND-MAINTAINED (the run-worker is not in config/default),
            # which is why helm-verify never compared it against the kustomize twin that
            # m148.3 did fix. The two install paths silently disagreed.
            #
            # Chart-owned DSN FIRST — it carries CONTROLPLANE_DSN and RUN_STORE_DSN.
            - secretRef:
                name: ctxmesh-postgres-dsn
                optional: true
{{- if ne .Values.bff.runStore.dsnSecretName "run-store" }}
            # An operator pointing the run store at a SEPARATE database supplies their own
            # Secret; it comes after the chart's, so later-wins gives them the override.
            - secretRef:
                name: {{ .Values.bff.runStore.dsnSecretName }}
                optional: true
{{- end }}
            # The worker runs the SAME bff binary, so it needs the SAME operator env the
            # BFF gets from bff-adapters — most importantly CONTROLPLANE_DSN (required at
            # startup, ADR 0044) + the adapter creds (m55.5 finding: the M32 worker config
            # wired only bff-capability and CrashLooped on the missing CONTROLPLANE_DSN).
            - secretRef:
                name: bff-adapters
                optional: true
            # The capability signing key + audience (shared with the BFF, ADR 0030) so
            # the worker can re-mint each run's capability from its stored caller identity.
            - secretRef:
                name: bff-capability
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              # Raised 256Mi -> 1Gi to MATCH the BFF: this container runs the same
              # ingestion path, so it needs the same measured headroom (M148 B3).
              memory: 1Gi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: run-worker
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ctxmesh
    app.kubernetes.io/component: run-worker
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    name: run-worker
    kind: Deployment
    apiVersion: apps/v1
  minReplicaCount: {{ .Values.bff.runStore.worker.minReplicaCount }}
  maxReplicaCount: {{ .Values.bff.runStore.worker.maxReplicaCount }}
  cooldownPeriod: 60
  triggers:
    - type: postgresql
      name: queued-runs
      metadata:
        connectionFromEnv: RUN_STORE_DSN
        query: "SELECT count(*) FROM runs WHERE status = 'queued'"
        targetQueryValue: "5"
        activationTargetQueryValue: "0"
{{- end }}
