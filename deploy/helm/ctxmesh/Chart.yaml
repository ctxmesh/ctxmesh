apiVersion: v2
name: ctxmesh
# Renders as ONE truncated line in `helm search`, Artifact Hub cards and the GHCR
# listing, so only the first clause is ever read. The internal detail that used to
# live here (ADR/PRD citations, the BFF ServiceAccount's grants) is in the docs.
description: >-
  Kubernetes-native control plane for deploying, governing, and observing AI agents
  — CRDs, controller, model gateway, and web console. Requires Knative Serving +
  Eventing and KEDA on the cluster.
# The control-plane + CRD templates are GENERATED from `kustomize build
# config/default` by hack/gen-helm-chart.sh — see templates/ banners and the
# `make helm-verify` no-drift check. Do not hand-edit generated templates.
type: application
# Chart version — bump on chart-shape changes (independent of the app image).
version: 0.1.0-beta.1
# appVersion is the default controller image tag. It MUST equal the tag baked
# into `kustomize build config/default` (controller:latest) so that, with
# default values, `helm template` == `kustomize build config/default`.
# The product version this chart installs. NOT "latest": a chart that pins nothing
# cannot be upgraded FROM, and on a registry `latest` is whatever was pushed most
# recently — which makes an install unreproducible and an upgrade undefined.
appVersion: "v0.1.0-beta.1"
kubeVersion: ">=1.29.0-0"
keywords:
  - agents
  - llm
  - operator
  - kubernetes
home: https://github.com/ctxmesh/ctxmesh
sources:
  - https://github.com/ctxmesh/ctxmesh

maintainers:
  - name: ctxmesh
    url: https://github.com/ctxmesh
# Artifact Hub renders these on the chart page; without them it shows no category,
# licence or links.
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/prerelease: "true"
  artifacthub.io/links: |
    - name: Documentation
      url: https://ctxmesh.github.io
    - name: Source
      url: https://github.com/ctxmesh/ctxmesh
