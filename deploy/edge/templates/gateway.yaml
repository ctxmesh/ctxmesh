{{- if .Values.gateway.createGatewayClass }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform-edge
  namespace: {{ .Values.gateway.namespace }}
  {{- if .Values.dns.externalDns }}
  annotations:
    # external-dns (a cluster controller) creates DNS records for these hostnames → the gateway address.
    external-dns.alpha.kubernetes.io/hostname: "*.{{ .Values.baseDomain }},*.default.{{ .Values.baseDomain }}"
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    {{- if .Values.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: platform-edge-tls
      allowedRoutes:
        namespaces:
          from: All
    {{- end }}
