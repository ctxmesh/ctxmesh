{{- with .Values.agentEdge }}
# The agent edge (m37.3): each agent's own hostname serves the machine invoke endpoint AND the browser
# chatbox, split by path. This route is /invoke → the agent THROUGH Kourier by Host — guarded by the
# ext-auth SecurityPolicy (ADR 0039) and sandboxed on the way out. Named "agents" so the
# SecurityPolicy targetRef stays stable.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents
  namespace: {{ .agent.namespace }}
spec:
  parentRefs:
    - name: platform-edge
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - "*.{{ .subdomain }}.{{ $.Values.baseDomain }}"
  rules:
    - matches:
        - path:
            type: Exact
            value: {{ .invokePath }}
      filters:
        # M137/EU1b (ADR 0106 §3): strip Authorization before forwarding to the agent pod. ext-auth has
        # already read the bearer (to verify + mint the run capability); the agent only ever RELAYS the
        # injected capability (ADR 0033/0039) and must NEVER see the caller's bearer — a K8s console token
        # OR an end-user OIDC ID token, which a compromised agent pod could otherwise replay for the
        # token's full lifetime (worse in blast direction for a long-lived OIDC token).
        - type: RequestHeaderModifier
          requestHeaderModifier:
            remove:
              - Authorization
        # The tenant's container answers here, at an agent hostname, so nothing it returns may be a
        # document with that origin: the console's consent page trusts an opener at an agent
        # hostname (ADR 0040 amendment). A sandboxed document has an opaque origin and runs no
        # script. `set` replaces whatever the agent sent. Callers read /invoke with fetch or SSE,
        # which a response CSP does not affect. Never on agents-app: the chatbox needs its scripts.
        # A sandbox does not stop the browser storing a cookie, and the OAuth binding cookie is
        # set on this host (consoleURL empty) or a sibling (Domain=<base> over plain HTTP), so the
        # agent's Set-Cookie is dropped: /invoke is a machine API with no use for one.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Content-Security-Policy
                value: sandbox
              - name: X-Content-Type-Options
                value: nosniff
            remove:
              - Set-Cookie
      backendRefs:
        - name: {{ .agent.service }}
          port: {{ .agent.port }}
---
# Everything else on the agent host → the BFF: the single-agent chatbox SPA + /api/* (login, invoke,
# MCP-consent callback). The RequestHeaderModifier flags the BFF to serve the chatbox pinned to the
# host's agent (`set` overwrites any inbound value, so a client can't forge a different agent). No
# ext-auth here — the SPA self-authenticates with its own bearer login, like the console origin.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agents-app
  namespace: {{ .app.namespace }}
spec:
  parentRefs:
    - name: platform-edge
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - "*.{{ .subdomain }}.{{ $.Values.baseDomain }}"
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: {{ .chatboxHeader }}
                value: "1"
      backendRefs:
        - name: {{ .app.service }}
          port: {{ .app.port }}
{{- end }}
