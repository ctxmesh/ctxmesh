{{- range $name, $r := .Values.routes }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $r.namespace }}
spec:
  parentRefs:
    - name: platform-edge
      namespace: {{ $.Values.gateway.namespace }}
  hostnames:
    - {{ if $r.wildcard }}"*.{{ $r.subdomain }}.{{ $.Values.baseDomain }}"{{ else }}{{ $r.subdomain }}.{{ $.Values.baseDomain }}{{ end }}
  rules:
    - backendRefs:
        - name: {{ $r.service }}
          port: {{ $r.port }}
---
{{- end }}
